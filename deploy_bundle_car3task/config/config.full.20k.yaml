run_id: starvla_qwengr00t_car3task_0904_v5
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: ryk9012-gwangju-institute-of-science-and-technology
wandb_project: starVLA_h1_2_car
is_debug: false
version_id: '0.21'
framework:
  name: QwenGR00T
  qwenvl:
    base_vlm: Qwen/Qwen3.5-0.8B
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048
  action_model:
    action_model_type: DiT-B
    action_hidden_dim: 1024
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    action_dim: 42
    state_dim: 63
    action_horizon: 16
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      cross_attention_dim: 1024
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 16
      output_dim: 1024
      positional_embeddings: null
    future_action_window_size: 15
    past_action_window_size: 0
datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: /mnt/DATA1/yyg/lerobot/data/0820_car_data
    data_mix: car_3task
    lerobot_version: v2.0
    action_mode: rel
    action_mode_apply_keys:
    - action.h1_2.action.head.joint_position
    - action.h1_2.action.left_arm.joint_position
    - action.h1_2.action.right_arm.joint_position
    action_mode_state_map:
      action.h1_2.action.head.joint_position: state.h1_2.observation.head.joint_position
      action.h1_2.action.left_arm.joint_position: state.left_arm
      action.h1_2.action.right_arm.joint_position: state.right_arm
    sequential_step_sampling: false
    per_device_batch_size: 16
    load_all_data_for_training: true
    obs_image_size:
    - 224
    - 224
    delete_pause_frame: false
    video_backend: torchcodec_cuda
    multiprocessing_context: spawn
    num_workers: 4
    prefetch_factor: 4
    in_order: false
trainer:
  max_train_steps: 20000
  num_warmup_steps: 2000
  save_interval: 2500
  eval_interval: 500
  learning_rate:
    base: 1.0e-05
    action_model: 0.0001
  lr_scheduler_type: warmup_stable_decay
  scheduler_specific_kwargs:
    num_decay_steps: 5000
    min_lr_ratio: 0.01
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  optimizer:
    name: Muon
    muon_modules:
    - action_model
    muon_lr: 0.0001
    muon_weight_decay: 1.0e-05
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
    weight_decay: 1.0e-05
config_yaml: examples/realRobots/H1_2_car/train_files/starvla_qwengr00t_car3task.yaml
output_dir: playground/Checkpoints/starvla_qwengr00t_car3task_0904_v5
