run_id: starvla_qwengr00t_egodexfull_trex_stage2_unfreeze
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: your_wandb_entity
wandb_project: starVLA_egodex
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T
  qwenvl:
    base_vlm: Qwen/Qwen3.5-0.8B
    attn_implementation: flash_attention_2
  action_model:
    action_dim: 48
    state_dim: 48
    action_horizon: 30

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: /mnt/DATA2/yyg/egodex
    data_mix: egodex_full_trex
    lerobot_version: "v3.0"
    action_mode: delta
    # rot6d is not a linear space — keep wrist rotations absolute, delta only on positions.
    action_mode_apply_keys:
      - action.left_wrist_pos
      - action.left_thumb_tip
      - action.left_index_tip
      - action.left_middle_tip
      - action.left_ring_tip
      - action.left_pinky_tip
      - action.right_wrist_pos
      - action.right_thumb_tip
      - action.right_index_tip
      - action.right_middle_tip
      - action.right_ring_tip
      - action.right_pinky_tip
    sequential_step_sampling: false
    per_device_batch_size: 32
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    delete_pause_frame: false
    video_backend: torchcodec_cuda
    multiprocessing_context: spawn
    num_workers: 8
    prefetch_factor: 4

trainer:
  max_train_steps: 30000
  num_warmup_steps: 1500
  save_interval: 5000
  eval_interval: 500
  learning_rate:
    base: 2.0e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  pretrained_checkpoint: /mnt/DATA2/yyg/starVLA/playground/Checkpoints/starvla_qwengr00t_egodexfull_trex_qwen3_5_0_8b/checkpoints/steps_50000_pytorch_model.pt
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
