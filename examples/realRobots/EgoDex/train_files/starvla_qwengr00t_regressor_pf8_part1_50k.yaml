run_id: starvla_qwengr00t_regressor_pf8_part1_frozenvlm_bs512_50k
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: null  # use the logged-in account's default entity
wandb_project: starVLA_egodex
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T_Regressor
  qwenvl:
    base_vlm: Qwen/Qwen3.5-0.8B
    attn_implementation: flash_attention_2
  action_model:
    action_dim: 48
    state_dim: 48
    action_horizon: 8  # 4 past + 4 future steps
    loss_type: l1+l2
    l1_weight: 1.0
    l2_weight: 1.0
    num_past_steps: 4  # first half of the window is PAST actions (for past/future logging)
    diffusion_model_cfg:
      norm_elementwise_affine: true  # learnable LayerNorm affine in every block
    moe_expert_layers: 0
    num_target_vision_tokens: 0  # no future tokens (no loss on them; GR00T's FLARE is off)

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: /mnt/DATA2/yyg/egodex
    data_mix: egodex_part1_pf8
    lerobot_version: "v3.0"
    action_mode: delta  # bidirectional: future = a[t]-s[t] then consecutive diffs; past = backward diffs toward t
    # rot6d is not a linear space — keep wrist rotations absolute, delta only on positions.
    action_mode_apply_keys:
      - action.left_wrist_pos
      - action.left_thumb_tip
      - action.left_index_tip
      - action.left_middle_tip
      - action.left_ring_tip
      - action.left_pinky_tip
      - action.right_wrist_pos
      - action.right_thumb_tip
      - action.right_index_tip
      - action.right_middle_tip
      - action.right_ring_tip
      - action.right_pinky_tip
    sequential_step_sampling: false
    per_device_batch_size: 128
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    delete_pause_frame: false
    # decord CPU decoding on per-episode files (epsplit): container open is
    # ~5ms, so CPU decode keeps up. fork is safe (workers never touch CUDA)
    # and avoids per-worker CUDA contexts. Use torchcodec_cuda + spawn only
    # if GPU decoding is ever needed again.
    video_backend: decord
    video_backend_kwargs: {num_threads: 1}  # decord default (0=auto) spawns ~27 threads per worker
    multiprocessing_context: fork
    num_workers: 16
    # run the Qwen-VL processor (image patching + tokenization) in the workers
    preprocess_in_workers: true
    prefetch_factor: 2

trainer:
  max_train_steps: 50000
  num_warmup_steps: 2000
  save_interval: 10000
  eval_interval: 1000000  # mse_score is computed every train step by the framework (free); separate eval pass disabled
  # Same lr for both groups: AdamW (embeddings / biases / norms) and Muon matrices.
  learning_rate:
    base: 1.0e-03
    action_model: 1.0e-03
  # WSD: warmup 0-2k -> stable 2k-45k -> cosine decay 45k-50k
  lr_scheduler_type: warmup_stable_decay
  scheduler_specific_kwargs:
    num_decay_steps: 5000
    min_lr_ratio: 0.01
  # VLM frozen at the stock Qwen3.5-0.8B weights (loaded via base_vlm at
  # init, no checkpoint); regression head trains from scratch.
  freeze_modules: 'qwen_vl_interface'
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true

  # torch.optim.Muon for 2D matrices (high lr), AdamW for the rest.
  # REQUIRES ZeRO stage 0 (launcher sets ACCELERATE_DEEPSPEED_ZERO_STAGE=0).
  optimizer:
    name: Muon
    muon_lr: 1.0e-03
    muon_weight_decay: 1.0e-05
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-05
