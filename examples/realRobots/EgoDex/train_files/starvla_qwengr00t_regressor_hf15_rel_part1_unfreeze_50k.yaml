run_id: starvla_qwengr00t_regressor_hf15_rel_part1_unfreezevlm_bs512_50k
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: null
wandb_project: starVLA_egodex
is_debug: false
version_id: "0.21"

# Experiment B: WTA regressor head (K=8, score head, 1 expert layer, shared decoder),
# VLM UNFROZEN, two-frame input (t-15, t), rel action mode, part1, 50k x bs512.
framework:
  name: QwenGR00T_Regressor
  qwenvl:
    base_vlm: Qwen/Qwen3.5-0.8B
    attn_implementation: flash_attention_2
    # ZeRO-0 (needed by Muon) keeps no fp32 master copy, so the trained VLM
    # must hold fp32 weights; compute stays bf16 via autocast.
    torch_dtype: float32
    load_bf16: false
  action_model:
    action_dim: 48
    state_dim: 48
    action_horizon: 30
    loss_type: l1+l2
    l1_weight: 1.0
    l2_weight: 1.0
    moe_expert_layers: 1
    num_target_vision_tokens: 0
    diffusion_model_cfg:
      norm_elementwise_affine: true

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: /mnt/DATA2/yyg/egodex
    # two-frame input: frame t-15 (0.5 s ago) + frame t; state/language at t; 30 future actions
    data_mix: egodex_part1_hf15
    lerobot_version: "v3.0"
    action_mode: rel  # every step = a[t+k] - s[t] (positions); rot6d absolute
    action_mode_apply_keys:
      - action.left_wrist_pos
      - action.left_thumb_tip
      - action.left_index_tip
      - action.left_middle_tip
      - action.left_ring_tip
      - action.left_pinky_tip
      - action.right_wrist_pos
      - action.right_thumb_tip
      - action.right_index_tip
      - action.right_middle_tip
      - action.right_ring_tip
      - action.right_pinky_tip
    sequential_step_sampling: false
    # 32 x 4 accumulation x 4 GPUs = 512. With the VLM unfrozen the vision-tower
    # activations of two frames are stored for backward: 128/GPU OOMs at 95 GB.
    per_device_batch_size: 32
    load_all_data_for_training: true
    # (W, H). 352x192 keeps the 16:9 aspect of the 640x360 video (no squash) and
    # costs 66 vision tokens per frame, the same as the old 224x224 (64 tokens).
    obs_image_size: [352, 192]
    # text tag in front of each image so the VLM can tell the two frames apart
    frame_tags: ["Previous frame, 0.5 seconds ago:", "Current frame:"]
    delete_pause_frame: false
    video_backend: decord
    video_backend_kwargs: {num_threads: 1}
    multiprocessing_context: fork
    num_workers: 16
    preprocess_in_workers: true
    prefetch_factor: 2

trainer:
  max_train_steps: 50000
  num_warmup_steps: 2000
  save_interval: 10000
  eval_interval: 1000000  # mse_score is computed every train step by the framework (free); separate eval pass disabled
  # WSD: warmup 0-2k -> stable 2k-45k -> cosine decay 45k-50k
  lr_scheduler_type: warmup_stable_decay
  scheduler_specific_kwargs:
    num_decay_steps: 5000
    min_lr_ratio: 0.01
  # whole model trains: VLM (fp32 weights, bf16 autocast) at 2e-5, head at its own lr
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 4
  gradient_checkpointing: false
  learning_rate:
    base: 2.0e-05
    qwen_vl_interface: 2.0e-05
    action_model: 1.0e-03
  # Muon only on the head matrices (muon_modules); the VLM uses AdamW at its group lr.
  # REQUIRES ZeRO stage 0 (launcher sets ACCELERATE_DEEPSPEED_ZERO_STAGE=0).
  optimizer:
    name: Muon
    muon_lr: 1.0e-03
    muon_weight_decay: 1.0e-05
    muon_modules: [action_model]
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-05
