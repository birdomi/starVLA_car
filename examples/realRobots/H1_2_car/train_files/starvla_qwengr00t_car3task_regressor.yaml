run_id: starvla_qwengr00t_car3task_regressor_bs128
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: ryk9012-gwangju-institute-of-science-and-technology
wandb_project: starVLA_h1_2_car
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T_Regressor
  qwenvl:
    base_vlm: Qwen/Qwen3.5-0.8B
    attn_implementation: flash_attention_2
  action_model:
    action_dim: 40   # arms(14) + hands(26), head dropped
    state_dim: 42    # head(2) + arms(14) + hands(26), legs/waist/pad dropped
    action_horizon: 16
    # Deterministic regression instead of flow matching: no denoising, one
    # forward pass predicts the chunk. Tests whether diffusion mode-averaging
    # was what flattened the fast motion peaks.
    loss_type: l1+l2
    l1_weight: 1.0
    l2_weight: 1.0
    num_hypotheses: 1            # single hypothesis (no WTA)
    num_target_vision_tokens: 0  # no FLARE future-token loss
    moe_expert_layers: 1
    diffusion_model_cfg:
      norm_elementwise_affine: true

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: /mnt/DATA1/yyg/lerobot/data/0820_car_data
    data_mix: car_3task_arms
    lerobot_version: "v2.0"
    # Head and arm targets are relative to the matching state group at t=0;
    # hand (ee) grip targets stay absolute — same as the Isaac-GR00T car runs.
    action_mode: rel
    action_mode_apply_keys:
      - action.h1_2.action.left_arm.joint_position
      - action.h1_2.action.right_arm.joint_position
    action_mode_state_map:
      action.h1_2.action.left_arm.joint_position: state.left_arm
      action.h1_2.action.right_arm.joint_position: state.right_arm
    sequential_step_sampling: false
    # Global batch 512 (16 x 4 GPUs x grad_accum 8) — same scale as pfmulti.
    per_device_batch_size: 32   # global batch 128 (32 x 4 GPUs)
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    delete_pause_frame: false
    video_backend: torchcodec_cuda
    multiprocessing_context: spawn
    num_workers: 4
    prefetch_factor: 4
    in_order: false

trainer:
  # Same recipe as the pfmulti runs: Muon + WSD @ global batch 512.
  max_train_steps: 20000
  num_warmup_steps: 2000
  save_interval: 2500
  eval_interval: 500
  learning_rate:
    base: 1.0e-05
    action_model: 1.0e-04
  # WSD: warmup 0-2k -> stable 2k-15k -> cosine decay 15k-20k
  lr_scheduler_type: warmup_stable_decay
  scheduler_specific_kwargs:
    num_decay_steps: 5000
    min_lr_ratio: 0.01
  # VLM trains too: Muon is restricted to the action_model group via
  # optimizer.muon_modules; Qwen falls in the 'base' group -> pure AdamW @ 1e-5.
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: false

  # torch.optim.Muon for 2D matrices (high lr), AdamW for the rest.
  # REQUIRES ZeRO stage 0 (launch with ACCELERATE_DEEPSPEED_ZERO_STAGE=0).
  optimizer:
    name: Muon
    # Muon only for these lr groups; all other groups (incl. the VLM in
    # 'base') get plain AdamW at their group lr.
    muon_modules: [action_model]
    # 1e-3 was tuned at global batch 512; this run uses batch 64 (accum 1).
    muon_lr: 1.0e-04
    muon_weight_decay: 1.0e-05
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-05
