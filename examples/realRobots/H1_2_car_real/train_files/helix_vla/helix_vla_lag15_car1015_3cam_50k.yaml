# Helix_VLA (starVLA/model/framework/VLM4A/Helix_VLA.py) on car-1015-v1-ep (34 tasks, 13696 train episodes; prepared
# 10-19 by prepare_car1015_dataset.py). Same model / optimizer as the RoboCasa run
# (examples/simBenchmarks/Robocasa_tabletop/train_files/helix_vla/helix_vla_lag12_rcfull_50k.yaml), car data layout:
#  * System 2 = Qwen3.5-0.8B (ViT + LM fully fine-tuned) on the 3 camera frames t - 15 (0.5 s, the car DualSystem's VLM
#    lag: vlm15 runs) -> LM last hidden states -> LayerNorm
#  * System 1 = C-RADIOv4-SO400M (fine-tuned) on the 3 frames t (3 x (196 patches + 2 summary) tokens, per-view position
#    embeddings) + state token + GR00T flow DiT-B -> a[t .. t+49] absolute (1.67 s at 30 Hz, = the car DualSystem's
#    System 1 horizon), q99
#  * state 42-D at t = recorded (measured) head state.head s0:2 + arms + hands (left hand 37:50 | right hand 50:63), q99.
#    (The car DualSystem used the previous head command a[t-1][0:2] instead: Helix_VLA_PrevCmd +
#    car1015_v1_3cam_vlm15_prevcmd_nohc. The measured head lags the command ~0.4 s and is sample-and-hold.)
#  * 224 x 224 (the car runs' frame size), one ColorJitter draw per sample over all views / frames (as the car runs)
#  * 50k steps x global 128 = 6.4M samples ~ 1.05 epochs of the 6.07M train steps (min_episode_length 150)
# Deployment: S2 on the frames of 0.5 s ago, S1 on the current ones -> the client sends per camera [frame t - 15, frame t]
# (wrong image count raises) and the 42-D state with the measured head (s0:2) in front.
# Launch (GPUs free): STARVLA_CUDA_DECODER_CACHE=16 setsid nohup bash examples/realRobots/H1_2_car_real/train_files/run_car_yaml.sh <this yaml> 0,1,2,3 29811 &
run_id: starvla_helix_vla_lag15_car1015_3cam_50k
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: ryk9012-gwangju-institute-of-science-and-technology
wandb_project: starVLA_h1_2_car
is_debug: false
version_id: "0.21"

framework:
  name: Helix_VLA
  num_views: 3              # head_left_2, wrist_left_2, wrist_right_2 (data config video_keys order, camera-major)
  qwenvl:
    base_vlm: Qwen/Qwen3.5-0.8B
    attn_implementation: flash_attention_2
    torch_dtype: float32    # trained -> fp32 weights; compute is bf16 autocast
    load_bf16: false
  radio:
    path: playground/Pretrained_models/C-RADIOv4-SO400M
    feature: backbone
    input_size: [224, 224]  # == obs_image_size
    outlier_norm: 100.0
    prefix_tokens: summary  # SigLIP2-g + DINOv3 CLS (2 x 1152)
    trainable: true         # all of C-RADIO (patch embedder + position embedding + 27 blocks)
  helix:
    s2_lag: 15              # System 2 frame = t - 15 (must match the data config video delta_indices [-15, 0])
    s2_norm: true
    s1_vision: true
    use_prefix: true
  action_model:
    action_model_type: DiT-B
    action_dim: 42          # head(2) + L arm(7) + L hand(13) + R arm(7) + R hand(13)
    state_dim: 42           # measured head(2) + L arm(7) + R arm(7) + L hand(13) + R hand(13)
    action_horizon: 50      # 1.67 s at 30 Hz; data config h1_2_car_3cam_vlm15_headstate = a[t .. t+49]
    repeated_diffusion_steps: 8
    num_inference_timesteps: 4
    num_target_vision_tokens: 0

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: /mnt/DATA2/yyg/starVLA/playground/Datasets
    data_mix: car1015_v1_3cam_vlm15_headstate   # 3 views at [t - 15, t] + 42-D state (measured head + arms + hands) at t + a[t .. t+49]
    color_jitter: {brightness: 0.4, contrast: 0.4, saturation: 0.4, hue: 0.05}
    min_episode_length: 150
    lerobot_version: "v3.0"
    action_mode: abs
    sequential_step_sampling: false
    per_device_batch_size: 32   # 32 x 4 GPUs = global 128
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    delete_pause_frame: false
    video_backend: torchcodec_cuda   # source mp4s are GOP 250 (symlinks): CPU random access is ~12x slower
    multiprocessing_context: spawn   # torchcodec_cuda cannot init CUDA in forked workers
    num_workers: 8
    cache_parquet_tables: false      # one small parquet per episode
    prefetch_factor: 4
    in_order: false

trainer:
  max_train_steps: 50000
  num_warmup_steps: 1000
  save_interval: 10000
  eval_interval: 1000
  learning_rate:
    base: 1.0e-05           # qwen_vl_interface (full fine-tuning)
    radio_encoder: 1.0e-05  # C-RADIO fine-tuning
    radio_cond: 1.0e-04
    s2_norm: 1.0e-04
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr_rate: 0.01
  freeze_modules: ""
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 0.0
