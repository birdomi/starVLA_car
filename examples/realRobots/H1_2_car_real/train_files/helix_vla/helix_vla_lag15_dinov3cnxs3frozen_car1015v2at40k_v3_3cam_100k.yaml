# CONTINUATION of helix_vla_lag15_dinov3cnxs3frozen_car1015v2_lowcomp_3cam_100k.yaml (10-22, user: "그냥 40K 끝나면 이 데이터로
# 학습하자"): its steps_40000 weights (symlinked into this run's checkpoints/) resumed with trainer.is_resume -> step 40000,
# the same cosine schedule continued to 100k, on car-1015-v3-ep instead of v2: 13 tasks (turn signals 0-3, wiper once /
# twice / speed 1-3 9-13, sunroof 30-31, engine 32-33; hazard, high beam, wiper 1->2->3, menus, interior lights dropped),
# both gravity-comp regimes (car1015_v3_exclude_episodes.json), 5294 train eps >= 150 frames (2.58M steps), v3 q99 stats.
# Only weights are checkpointed -> AdamW moments restart from zero at step 40000 (LR there ~0.67 x peak, no re-warmup).
# Everything else is identical to the v2 yaml (below its header).
run_id: starvla_helix_vla_lag15_dinov3cnxs3frozen_car1015v2at40k_v3_3cam_100k
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: ryk9012-gwangju-institute-of-science-and-technology
wandb_project: starVLA_h1_2_car
is_debug: false
version_id: "0.21"

framework:
  name: Helix_VLA
  num_views: 3              # head_left_2, wrist_left_2, wrist_right_2 (data config video_keys order, camera-major)
  qwenvl:
    base_vlm: Qwen/Qwen3.5-0.8B
    attn_implementation: flash_attention_2
    torch_dtype: float32    # trained -> fp32 weights; compute is bf16 autocast
    load_bf16: false
  radio:
    backbone: dinov3_convnext
    path: playground/Pretrained_models/dinov3-convnext-small-pretrain-lvd1689m
    stage: 3                # stages 1-3 only (stride 16) -> 14 x 14 x 384 at 224
    input_size: [224, 224]  # == obs_image_size
    trainable: false        # frozen (pretrained LVD-1689M weights, eval mode); only radio_cond (projection + position embeddings) learns
  helix:
    s2_lag: 15              # System 2 frame = t - 15 (must match the data config video delta_indices [-15, 0])
    s2_norm: true
    s1_vision: true
    use_prefix: true
  action_model:
    action_model_type: DiT-B
    action_dim: 42          # head(2) + L arm(7) + L hand(13) + R arm(7) + R hand(13)
    state_dim: 42           # measured head(2) + L arm(7) + R arm(7) + L hand(13) + R hand(13)
    action_horizon: 50      # 1.67 s at 30 Hz; data config h1_2_car_3cam_vlm15_headstate = a[t .. t+49]
    repeated_diffusion_steps: 8
    num_inference_timesteps: 4
    num_target_vision_tokens: 0

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: /mnt/DATA2/yyg/starVLA/playground/Datasets
    data_mix: car1015_v3_3cam_vlm15_headstate   # 3 views at [t - 15, t] + 42-D state (measured head + arms + hands) at t + a[t .. t+49]
    color_jitter: {brightness: 0.4, contrast: 0.4, saturation: 0.4, hue: 0.05}
    min_episode_length: 150
    lerobot_version: "v3.0"
    action_mode: abs
    sequential_step_sampling: false
    per_device_batch_size: 32   # 32 x 4 GPUs = global 128
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    delete_pause_frame: false
    video_backend: torchcodec_cuda   # source mp4s are GOP 250 (symlinks): CPU random access is ~12x slower
    multiprocessing_context: spawn   # torchcodec_cuda cannot init CUDA in forked workers
    num_workers: 8
    cache_parquet_tables: false      # one small parquet per episode
    prefetch_factor: 4
    in_order: false

trainer:
  max_train_steps: 100000
  is_resume: true          # latest checkpoints/steps_*_pytorch_model.pt -> completed_steps + LR schedule
  num_warmup_steps: 1000
  save_interval: 10000
  eval_interval: 1000
  learning_rate:
    base: 1.0e-05           # qwen_vl_interface (full fine-tuning)
    radio_cond: 1.0e-04
    s2_norm: 1.0e-04
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr_rate: 0.01
  freeze_modules: ""
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 0.0
