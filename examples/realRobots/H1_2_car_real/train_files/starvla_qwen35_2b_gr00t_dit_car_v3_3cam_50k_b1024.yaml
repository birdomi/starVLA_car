# Same model / recipe as starvla_qwen35_2b_gr00t_dit_car1015_v3_3cam_50k.yaml; only the DATA differs: car-v3 (10-29) =
# car-1015-v3 + car-0901-0923 (episodes not in v3, incl. the hazard / high-beam / interior-light / 1-2-3 wiper tasks v3
# dropped) + car_data_3rd (1019-1027; washer tasks new), rule_v1-filtered, deduplicated, val episodes found in any train
# split trained on: 9,980 train episodes (47.0 h, ~5.08M frames), 297 val, 21 tasks (prepare_car_v3.py).
# All data weighted equally: every frame of the pooled set is equally likely, i.e. the same as one concatenated dataset
# (balance_dataset_weights: true makes the per-dataset weight = its frame count; with false each of the 4 parts would
# get 1/4 of the batches, so the 199-episode v3 val slice would be drawn ~25x more often than a v3 train frame).
# Batch 32 per GPU x 32 GPUs (8 nodes) = global 1024 (twice the b512 twin starvla_qwen35_2b_gr00t_dit_car_v3_3cam_50k.yaml), 50k steps:
# 50k x 1024 = 51.2M samples ~ 10 epochs of the merged set (v3 baseline: ~9.9 epochs of v3), twice the b512 plan;
# same learning rates, warmup and save interval. ~1.7 s/step -> may pass the 24 h walltime: resume with
# EXTRA_ARGS="--trainer.is_resume True" (weights of the latest steps_* checkpoint + LR schedule; AdamW moments restart).
# QwenGR00T (Qwen3.5-2B, fully fine-tuned + GR00T flow DiT-B) on car-1015-v3-ep (13 tasks of car-1015-v1, 5311 train
# episodes, 2.58M frames). Same recipe as starvla_qwengr00t_dit_car1015_3cam_50k.yaml (0.8B, car-1015-v1), ported to
# KISTI Hangang (GH200, 8 nodes x 4 GPU):
#  * Qwen on the 3 camera frames t (head_left_2, wrist_left_2, wrist_right_2), 224 x 224, one ColorJitter draw per sample
#  * state 42-D at t = measured head s0:2 + arms + hands, q99; a[t .. t+49] absolute (1.67 s at 30 Hz), q99
#  * ZeRO-2 bf16 (DeepSpeed keeps the fp32 master copy) instead of ZeRO-0 fp32: same as the 4B run (starvla_qwen35_4b_gr00t_dit_car1015_v3_3cam_50k.yaml)
#  * 16 x 32 GPUs = global 512 (0.8B recipe: 128), 50k steps = 25.6M samples ~ 9.9 epochs of v3
# Launch: examples/realRobots/H1_2_car_real/train_files/hangang/train_car.sbatch <this yaml>
run_id: starvla_qwen35_2b_dit_car_v3_3cam_50k_b1024
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: ryk9012-gwangju-institute-of-science-and-technology
wandb_project: starVLA_h1_2_car
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T
  qwenvl:
    base_vlm: playground/Pretrained_models/Qwen3.5-2B
    # fla Triton kernels recompile per sequence length -> pad prompts to a multiple of 64
    pad_to_multiple_of: 64
    attn_implementation: flash_attention_2
    torch_dtype: bfloat16
  action_model:
    action_model_type: DiT-B
    action_dim: 42          # head(2) + L arm(7) + L hand(13) + R arm(7) + R hand(13)
    state_dim: 42           # measured head(2) + L arm(7) + R arm(7) + L hand(13) + R hand(13)
    action_horizon: 50      # 1.67 s at 30 Hz; data config h1_2_car_3cam_headstate = a[t .. t+49]
    repeated_diffusion_steps: 8
    num_inference_timesteps: 4
    num_target_vision_tokens: 0

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: /appsdata/t509a04/data
    data_mix: car_v3_3cam_headstate   # same views / state / action as car1015_v3_3cam_headstate (+ ch2 clip on 0901 / 3rd)
    episode_lists: examples/realRobots/H1_2_car_real/car_v3_episode_lists.json   # per-dataset episode ids (train mixture)
    balance_dataset_weights: true   # sample proportional to frames = all frames equal (see header)
    color_jitter: {brightness: 0.4, contrast: 0.4, saturation: 0.4, hue: 0.05}
    min_episode_length: 150
    lerobot_version: auto   # per dataset from meta/info.json: v3 is v3.0, the 0901 / 3rd overlays are v2.0
    action_mode: abs
    sequential_step_sampling: false
    per_device_batch_size: 32   # 32 x 32 GPUs = global 1024
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    delete_pause_frame: false
    video_backend: torchvision_av   # no torchcodec / decord on aarch64; source mp4s are GOP 250 -> CPU decode heavy
    video_backend_kwargs: {num_threads: 1}
    multiprocessing_context: fork
    num_workers: 16
    preprocess_in_workers: false
    cache_parquet_tables: false      # one small parquet per episode
    prefetch_factor: 4
    in_order: false

trainer:
  max_train_steps: 50000
  num_warmup_steps: 1000
  save_interval: 5000
  eval_interval: 1000
  learning_rate:
    base: 1.0e-05           # qwen_vl_interface (full fine-tuning)
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr_rate: 0.01
  freeze_modules: ""
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  logging_frequency: 100
  gradient_clipping: 1.0
  skip_nonfinite_steps: true   # bf16 ZeRO-2 has no overflow check: skip inf / NaN gradient steps (the 10-29 run went NaN at ~2450)
  gradient_accumulation_steps: 1
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 0.0
