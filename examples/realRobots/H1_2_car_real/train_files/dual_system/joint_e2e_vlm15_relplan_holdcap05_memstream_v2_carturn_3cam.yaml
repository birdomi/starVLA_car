# Episode memory trained AS DEPLOYED (dual_system.memory.stream): the memory run
# (joint_e2e_vlm15_relplan_holdcap05_mem_ft46k_v2_carturn_3cam.yaml) unrolled it over only the last 2 s (4 updates from
# the initial memory) in training while deployment updates it every 0.5 s from the episode start -> after ~4 updates
# the deployed memory left its training distribution (val progress drifted to ~0.5, -0.4 in the last quarter).
#  * loader streams (datasets.vla_data.stream): every batch position walks one random episode from frame 0 in steps of
#    15 frames (0.5 s), then the next one; consecutive training steps = consecutive 0.5 s steps of the same episodes
#    (128 streams; each stream's first episode joins at a random step and is masked from the losses until it ends)
#  * the memory is carried across training steps: one update per step on the VLM frame t - 15 (System 2's VLM frame),
#    gradient through the last 4 updates (truncated BPTT over cached VLM tokens), the older memory detached
#  * one VLM forward per sample per step (the window run needed 4) -> data offsets t - 15, t only
#  * eval: continuous memory over 8 whole val episodes (as deployed)
#  * from the window memory run's steps_10000 (= 56k), 10k steps (outputs labelled memstream66k)
# Launch: bash ../run_car_yaml.sh <this yaml> <gpus> <port>
run_id: starvla_dualsystem_v2_e2e_vlm15_relplan_holdcap05_memstream_carturn_3cam
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: ryk9012-gwangju-institute-of-science-and-technology
wandb_project: starVLA_h1_2_car
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T_DualSystem
  qwenvl:
    base_vlm: Qwen/Qwen3.5-0.8B
    attn_implementation: flash_attention_2
    torch_dtype: float32    # trained -> fp32 weights (ZeRO-0 keeps no fp32 master copy); compute is bf16 autocast
    load_bf16: false
  radio:
    path: playground/Pretrained_models/C-RADIOv4-SO400M   # smallest released C-RADIOv4 (H / SO400M / 1D-H only)
    feature: backbone
    input_size: [224, 224]  # == frame_size (the car runs' 224 x 224 views)
    outlier_norm: 100.0     # C-RADIO's fixed top-row artifact token is masked
    prefix_tokens: summary  # SigLIP2-g + DINOv3 CLS (RADIO's 2304-d summary, 2 x 1152 tokens) -> both systems
  dual_system:
    action_rate_hz: 30.0    # car video / action rate
    keyframes: {t_min: -2.0, t_max: 4.0, dt: 0.1}   # 61 keyframes: 20 past / 1 current / 40 future
    s1_horizon_s: 1.6666666666666667   # 50 actions (round(s1_horizon_s * 30))
    video_offsets: [-15, 0]  # == data config video delta_indices (h1_2_car_turn_dual_vlm15_nohc): VLM frame t - 15 (= the memory's new frame), current frame
    stale_input: vlm        # VLM tokens of frame t - 15; C-RADIO / state / System 1 at t
    s1_offset_probs: [1.0, 0.0]   # System 2's VLM tokens: always frame t - 15 (frame t where t - 15 lies before the episode)
    num_views: 3            # head_left_2, wrist_left_2, wrist_right_2 (data config video_keys order)
    frame_size: [224, 224]  # == obs_image_size
    train_systems: [system2, system1]   # joint
    loss_weights: {system2: 1.0, system1: 1.0}
    mask_out_of_episode: true
    eval: {num_samples: 64, seed: 0, train_stats: true, stream_episodes: 8}   # val normalised with the train statistics; streamed memory over 8 whole val episodes
    state_prev_action_dims: [0, 1]   # previous head command (action-normalised) -> state[0:2]
    relative_plan:
      stats_path: /mnt/DATA2/yyg/starVLA/playground/Datasets/car-turn-signal-v2-ep/train/meta/dual_nohc_dataset_statistics.json
      # [action_start, action_end, state_start] into the 42-D state = [prev head(2), L arm(7), R arm(7), L hand(13), R hand(13)]
      # action = [head(2), L arm(7), L hand(13), R arm(7), R hand(13)]
      ref: [[0, 2, 0], [2, 9, 2], [9, 22, 16], [22, 29, 9], [29, 42, 29]]
      scale: 1.0
    memory:
      update_offsets: [-15]   # one update per training step on the VLM frame t - 15 (streamed)
      stream: {tbptt: 4}      # memory carried across steps; gradient through the last 4 updates
      num_tokens: 16
      d_model: 768
      depth: 2
      num_heads: 12
      mlp_ratio: 4.0
      progress_bins: 50
      progress_loss_weight: 0.1
  system2:
    use_radio_prefix: true # C-RADIO summary tokens (SigLIP2-g / DINOv3 CLS = 2304-d summary) in s2_context
    d_model: 768
    depth: 12
    num_heads: 12
    use_state: true
    vlm_age_embed: false    # no age MLP on the VLM tokens (the lag is fixed at 0.5 s; 0 only within the first 15 frames)
    num_noise_samples: 4    # noise draws per sample per step (the DiT is cheap next to the VLM)
    diffusion: {type: flow_matching, beta_alpha: 1.5, beta_beta: 1.0, noise_s: 0.999, num_timestep_buckets: 1000, sample_steps: 4}  # GR00T
    interpolation: {default_mode: linear, groups: [], strict: true}   # head / arms / hands are all continuous
  system1:
    use_radio_prefix: true # current frame's C-RADIO summary tokens in the cross-attention context
    d_model: 768           # same size as the System 2 DiT / the GR00T action head
    depth: 12
    num_heads: 12
    use_state: true         # state at frame t as a cross-attention token
    num_noise_samples: 4
    diffusion: {type: flow_matching, beta_alpha: 1.5, beta_beta: 1.0, noise_s: 0.999, num_timestep_buckets: 1000, sample_steps: 4}  # GR00T
    traj_source: pred       # System 2's own sampled plan of frame t (no_grad, plan age 0), as at test time
    traj_pred_steps: 4      # Euler steps of System 2's plan (= inference)
    traj_token_dropout: 0.2 # each trajectory token -> learned mask token w.p. 0.2 (training only)
    grad_ckpt: true         # recompute the System 1 DiT blocks in backward (same math; S2 + S1 at b32 peaked 92 GB of 98)
  action_model:             # action / state layout (QwenGR00T keys)
    action_dim: 42
    state_dim: 42           # previous head command(2) + arms(14) + hands(26) (loader state 40 + 2)
    action_horizon: 50      # = System 1 horizon (50 / 30 s)

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    emit_action_valid: true # action_valid / frame_valid masks (padded slots outside the episode)
    emit_progress: true     # t / (T - 1) -> the memory's progress classes
    data_root_dir: /mnt/DATA2/yyg/starVLA/playground/Datasets
    data_mix: car_turn_signal_v2_holdcap05_dual_vlm15_nohc   # hold-capped train; 3 views / 40-D state at t + {-15, 0} + a[t-60 .. t+120]
    stream: {stride: 15, random_start: true}   # episodes walked from frame 0 every 0.5 s, one per batch position
    # photometric augmentation (train split only): one ColorJitter draw per sample shared by all 3 cameras and all
    # time offsets (a global exposure / white-balance shift, as between the collection and the deployment camera).
    # brightness x[0.6, 1.4], contrast x[0.6, 1.4] (lifts / lowers the black level too), saturation x[0.6, 1.4], hue +-0.05
    color_jitter: {brightness: 0.4, contrast: 0.4, saturation: 0.4, hue: 0.05}
    min_episode_length: 150
    lerobot_version: "v3.0"
    action_mode: abs
    sequential_step_sampling: false
    per_device_batch_size: 32   # 32 x 4 GPUs = global 128
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    delete_pause_frame: false
    video_backend: torchcodec_cuda   # launch with STARVLA_CUDA_DECODER_CACHE=150 (run_car_yaml.sh caller)
    multiprocessing_context: spawn   # torchcodec_cuda cannot init CUDA in forked workers
    num_workers: 6
    cache_parquet_tables: true
    prefetch_factor: 6
    in_order: true          # streaming: batch k + 1 of a position continues batch k
  val_data:   # held-out val split (60 episodes), eval hook only; decoded once and cached -> CPU decoding
    dataset_py: lerobot_datasets
    include_state: true
    emit_action_valid: true
    data_root_dir: /mnt/DATA2/yyg/starVLA/playground/Datasets
    emit_progress: true
    data_mix: car_turn_signal_v2_val_dual_vlm15_nohc
    lerobot_version: "v3.0"
    action_mode: abs
    obs_image_size: [224, 224]
    video_backend: torchcodec

trainer:
  pretrained_checkpoint: /mnt/DATA2/yyg/starVLA/playground/Checkpoints/starvla_dualsystem_v2_e2e_vlm15_relplan_holdcap05_mem_ft46k_carturn_3cam/checkpoints/steps_10000_pytorch_model.pt   # = 56k (the window-trained memory run's end)
  max_train_steps: 10000
  num_warmup_steps: 0
  save_interval: 2000
  eval_interval: 1000
  learning_rate:
    base: 2.0e-06           # unused (qwen_vl_interface frozen)
    system2: 2.0e-05
    system1: 2.0e-05
    episode_memory: 1.0e-04 # new module (memory transformer + progress head / token)
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr_rate: 0.01
  freeze_modules: radio_encoder, qwen_vl_interface   # VLM frozen (its 46k weights)
  max_grad_norm: 1.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 0.0
