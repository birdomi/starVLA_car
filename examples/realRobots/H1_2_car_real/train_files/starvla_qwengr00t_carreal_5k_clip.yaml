run_id: starvla_qwengr00t_dit_carreal_5k_clip
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: ryk9012-gwangju-institute-of-science-and-technology
wandb_project: starVLA_h1_2_car
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T
  qwenvl:
    base_vlm: Qwen/Qwen3.5-0.8B
    attn_implementation: flash_attention_2
  action_model:
    action_dim: 42   # head(2) + arms(14) + hands(26)
    state_dim: 44    # head(2) + head_cmd(2) + arms(14) + hands(26)
    action_horizon: 30   # 1.0 s at 30 Hz

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: /mnt/DATA2/yyg/starVLA/playground/Datasets/car-real
    data_mix: car_real_left_turn
    lerobot_version: "v3.0"
    # head and arms are relative to the state group they track; the head uses
    # `head_cmd` (0-lag command) rather than the measured head, which lags ~0.7 s.
    action_mode: rel
    action_mode_apply_keys:
      - action.head
      - action.left_arm
      - action.right_arm
    action_mode_state_map:
      action.head: state.head_cmd
      action.left_arm: state.left_arm
      action.right_arm: state.right_arm
    sequential_step_sampling: false
    per_device_batch_size: 32   # global batch 128 (32 x 4 GPUs)
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    delete_pause_frame: false
    video_backend: torchcodec_cuda
    multiprocessing_context: spawn   # torchcodec_cuda cannot init CUDA in forked workers
    num_workers: 4
    prefetch_factor: 4
    in_order: false

trainer:
  # 5k steps = 23 epochs of the 27.5k frames. The previous 10k-step schedule was
  # cut at 5k, so it never entered its decay phase; this one anneals properly.
  max_train_steps: 5000
  num_warmup_steps: 500
  save_interval: 500
  eval_interval: 500
  learning_rate:
    base: 1.0e-05
    action_model: 1.0e-04
  # WSD: warmup 0-500 -> stable 500-3.5k -> cosine decay 3.5k-5k
  lr_scheduler_type: warmup_stable_decay
  scheduler_specific_kwargs:
    num_decay_steps: 1500
    min_lr_ratio: 0.01
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true

  # Muon on the action head's 2D matrices only; the VLM stays on plain AdamW.
  # REQUIRES ZeRO stage 0 (launch with ACCELERATE_DEEPSPEED_ZERO_STAGE=0).
  optimizer:
    name: Muon
    muon_modules: [action_model]
    muon_lr: 1.0e-04
    muon_weight_decay: 1.0e-05
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-05
