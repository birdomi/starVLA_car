# QwenGR00T_EpisodeMemory (starVLA/model/framework/VLM4A/QwenGR00T_EpisodeMemory.py) on car-1015-v1-ep, fine-tuned from
# the car1015 QwenGR00T baseline (starvla_qwengr00t_dit_car1015_3cam_50k.yaml). Adds the gated-attention episode memory of
# QwenGR00T_DualSystem (dual_system/memory.py EpisodeMemory, attention gated), STREAMED (user 10-21: "처음 시작부터 계속
# 받는걸로 하자"):
#  * memory: 16 tokens (2 blocks, d 768) updated CONTINUOUSLY from the episode start, once every 0.5 s (stream stride
#    15) on the current frame's VLM last hidden states (the DiT's own vl_embs, no extra VLM pass). Training walks every
#    batch position through whole episodes (datasets.vla_data.stream, in_order) and carries its memory across steps;
#    truncated BPTT over the last 4 updates (2 s), the older memory detached. Positions whose history is incomplete
#    (first episode joined mid-way: random_start) leave every loss until their next episode.
#  * readout: memory tokens + 1 progress token (t / (T - 1), 50 bins, CE x 0.1) -> the DiT's memory cross-attention
#    (memory_cond: zero-initialised output projection -> step 0 predicts exactly as the checkpoint)
#  * VLM frozen (its baseline weights): the current frame's vl_embs are the baseline's; past frames run without
#    gradient. Trained: the memory (new) and the action DiT (incl. the new memory cross-attention).
# Why: the 10k / 30k baseline evals (playground/eval_results/car1015_qwengr00t_dit_3cam_50k) split / end mirror looks at
# chunk seams (seq check 6% / 32% vs GT 96%): a single frame does not tell how long the head has been turned.
# Deployment: M = model.memory_init(1) at the episode start, then every 0.5 s (15 frames) out = predict_action(example
# with the 3 current frames + 42-D state, memory=M); M = out["memory"]; also returns "progress".
# Launch (cache 150 -> "Failed to create NVDEC decoder" at step 7, 10-21: 8 workers x 96 files x 720p): STARVLA_CUDA_DECODER_CACHE=16 setsid nohup bash examples/realRobots/H1_2_car_real/train_files/run_car_yaml.sh <this yaml> 0,1,2,3 29813 &
run_id: starvla_qwengr00t_dit_episodememory_stream_from30k_car1015_3cam
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: ryk9012-gwangju-institute-of-science-and-technology
wandb_project: starVLA_h1_2_car
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T_EpisodeMemory
  num_views: 3              # head_left_2, wrist_left_2, wrist_right_2 (frame t)
  qwenvl:
    base_vlm: Qwen/Qwen3.5-0.8B
    attn_implementation: flash_attention_2
    torch_dtype: float32
    load_bf16: false
  action_model:
    action_model_type: DiT-B
    action_dim: 42
    state_dim: 42           # measured head(2) + L arm(7) + R arm(7) + L hand(13) + R hand(13)
    action_horizon: 50
    repeated_diffusion_steps: 8
    num_inference_timesteps: 4
    num_target_vision_tokens: 0
    diffusion_model_cfg:
      memory_cond: true     # zero-init memory cross-attention in the DiT's cross-attention blocks
      memory_dim: 1024      # == the VLM hidden size (EpisodeMemory readout width)
  episode_memory:
    update_offsets: [0]     # stream: one update per step on the current frame (interval = datasets.vla_data.stream.stride)
    stream: {tbptt: 4}      # gradient through the last 4 updates (2 s); needs the frozen VLM
    num_tokens: 16
    d_model: 768
    depth: 2
    num_heads: 12
    mlp_ratio: 4.0
    attention: gated        # sigmoid output gate per head channel (Qwen3.5 full-attention style)
    progress_bins: 50
    progress_loss_weight: 0.1

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: /mnt/DATA2/yyg/starVLA/playground/Datasets
    data_mix: car1015_v1_3cam_headstate   # 3 views + 42-D state at t + a[t .. t+49] (the baseline's data config)
    emit_progress: true       # progress target t / (T - 1)
    # episodes walked from their start every 15 frames (0.5 s), one per batch position; random_start: each stream's first
    # episode from a random step (masked until the next one); random_phase: every episode's grid starts at a random
    # frame in [0, 15), so the walks cover all frames, not only 0, 15, 30, ...
    stream: {stride: 15, random_start: true, random_phase: true}
    color_jitter: {brightness: 0.4, contrast: 0.4, saturation: 0.4, hue: 0.05}
    min_episode_length: 150
    lerobot_version: "v3.0"
    action_mode: abs
    sequential_step_sampling: false
    per_device_batch_size: 32   # 32 x 4 GPUs = global 128
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    delete_pause_frame: false
    video_backend: torchcodec_cuda
    multiprocessing_context: spawn
    num_workers: 8
    cache_parquet_tables: false
    prefetch_factor: 4
    in_order: true          # streaming: batch k + 1 of a position continues batch k

trainer:
  # Full load with strict=False: only episode_memory.* and the DiT's norm_mem / attn_mem keys are missing.
  # baseline steps_30000 (user 10-21: start now on GPUs 0-3); 30k + 20k = the baseline's 50k total steps
  pretrained_checkpoint: /mnt/DATA2/yyg/starVLA/playground/Checkpoints/starvla_qwengr00t_dit_car1015_3cam_50k/checkpoints/steps_30000_pytorch_model.pt
  max_train_steps: 20000      # 128 streams x 20k steps x 0.5 s ~ 86k episode walks (~6.3 per episode, each on 1/15 of its frames)
  num_warmup_steps: 1000
  save_interval: 10000       # user 10-21: every 10k (10k, 20k)
  eval_interval: 1000
  learning_rate:
    base: 1.0e-05           # nothing left in this group: the VLM is frozen
    action_model: 1.0e-04   # as the baseline's peak (also the new zero-init memory cross-attention)
    episode_memory: 1.0e-04 # new module
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr_rate: 0.01
  freeze_modules: qwen_vl_interface
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 0.0
