run_id: starvla_qwengr00t_dit_leftturn_v2_mix
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: ryk9012-gwangju-institute-of-science-and-technology
wandb_project: starVLA_h1_2_car
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T
  qwenvl:
    base_vlm: Qwen/Qwen3.5-0.8B
    attn_implementation: flash_attention_2
  action_model:
    action_dim: 42   # head(2) + arms(14) + hands(26)
    state_dim: 42    # head_cmd(2) + arms(14) + hands(26); measured head is not an input
    action_horizon: 30   # 1.0 s at 30 Hz

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: /mnt/DATA2/yyg/starVLA/playground/Datasets
    data_mix: car_left_turn_v2
    lerobot_version: "v3.0"
    # Mixed: the arms are rel (anchored on their own measured joints), the head
    # and both hands are absolute.
    #
    # Only the keys listed in action_mode_apply_keys are anchored; every other
    # action key keeps its absolute values, in the data and in the statistics
    # alike (calculate_rel_action_statistics writes one blob holding both).
    #
    # Arms rel: they track their own state closely, so the residual range is 3-8x
    # narrower than the joint range (R arm q01..q99 spans 13.6-16.8 deg as a
    # residual vs 34.4-137.6 deg absolute) and the same normalized error maps to
    # 5.5x less physical error.
    # Head abs: `head_cmd[t]` is the action pipeline delayed ~100 ms
    # (|action[t+3] - head_cmd[t]| = 0.90 deg), so anchoring on it makes the
    # start of every chunk a near-zero target - rel yaw std is 1.13 deg at step 3
    # against 12.50 deg at step 29. Absolute targets make the difficulty uniform
    # across the chunk. head_cmd remains a state input, just not an anchor.
    # Hands abs: grip targets were never anchored in any of these runs.
    action_mode: rel
    action_mode_apply_keys:
      - action.left_arm
      - action.right_arm
    action_mode_state_map:
      action.left_arm: state.left_arm
      action.right_arm: state.right_arm
    sequential_step_sampling: false
    per_device_batch_size: 32   # global batch 128 (32 x 4 GPUs)
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    delete_pause_frame: false
    video_backend: torchcodec_cuda
    multiprocessing_context: spawn   # torchcodec_cuda cannot init CUDA in forked workers
    # 64-core box shared with other jobs (load ~90): 4 workers could not keep up
    # and the loop stalled 15 s every 4 steps (data_times 15.5 vs model 1.8).
    # Not disk-bound - iowait is 0 and the 51 GB of video fits in the 1.26 TB
    # page cache - so the fix is more decode workers, not faster storage.
    num_workers: 12
    prefetch_factor: 6
    in_order: false

trainer:
  # 412k frames: 1 epoch = 3,224 steps at batch 128, so 100k steps = 31.0
  # epochs. (The same 100k on car-real was 326 epochs — this set is 15x larger.)
  # Checkpoints every 5k so the best one can be picked after the fact.
  max_train_steps: 100000
  num_warmup_steps: 2000
  save_interval: 5000
  eval_interval: 500
  learning_rate:
    base: 1.0e-05
    action_model: 1.0e-04
  # WSD: warmup 0-2k -> stable 2k-80k -> cosine decay 80k-100k
  lr_scheduler_type: warmup_stable_decay
  scheduler_specific_kwargs:
    num_decay_steps: 20000
    min_lr_ratio: 0.01
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true

  # Muon on the action head's 2D matrices only; the VLM stays on plain AdamW.
  # REQUIRES ZeRO stage 0 (launch with ACCELERATE_DEEPSPEED_ZERO_STAGE=0).
  optimizer:
    name: Muon
    muon_modules: [action_model]
    muon_lr: 1.0e-04
    muon_weight_decay: 1.0e-05
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-05
