run_id: starvla_qwengr00t_dit_leftturn_v2_prog_nohist
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: ryk9012-gwangju-institute-of-science-and-technology
wandb_project: starVLA_h1_2_car
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00TProgress
  qwenvl:
    base_vlm: Qwen/Qwen3.5-0.8B
    attn_implementation: flash_attention_2
  action_model:
    action_dim: 42   # head(2) + arms(14) + hands(26)
    state_dim: 42    # head_cmd(2) + arms(14) + hands(26); measured head is not an input
    action_horizon: 30   # 1.0 s at 30 Hz
    # Single-frame state (data_mix car_left_turn_v2 -> state_indices [0]), so the
    # DiT sees exactly the 1 + 32 + 30 = 63 tokens the 100k checkpoint was
    # trained on. Going to a 15-frame history changes that to 77 tokens and the
    # pretrained action path does not survive it: loading 100k and evaluating
    # with 15 state tokens gives arm 1.96 deg against 1.20 deg with one token,
    # and a 20k fine-tune only recovered to 1.69 deg. The history was also worth
    # little for the progress target itself — a ridge fit predicts t/T to 0.156
    # from the current frame and 0.145 from 15 frames, while the trained model
    # reaches 0.050, so most of the signal is in the images, not the history.
    max_state_history: 32
    # Weight on the t/T regression read off the DiT's future tokens. Small on
    # purpose: the aux task is a readout, not something that should steer the
    # action loss. A 15-frame state window predicts t/T to MAE 0.145 (vs 0.246
    # for predicting the mean), so there is real signal but not much.
    progress_loss_weight: 0.1

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: /mnt/DATA2/yyg/starVLA/playground/Datasets
    data_mix: car_left_turn_v2
    lerobot_version: "v3.0"
    # Mixed: the arms are rel (anchored on their own measured joints), the head
    # and both hands are absolute.
    #
    # Only the keys listed in action_mode_apply_keys are anchored; every other
    # action key keeps its absolute values, in the data and in the statistics
    # alike (calculate_rel_action_statistics writes one blob holding both).
    #
    # Arms rel: they track their own state closely, so the residual range is 3-8x
    # narrower than the joint range (R arm q01..q99 spans 13.6-16.8 deg as a
    # residual vs 34.4-137.6 deg absolute) and the same normalized error maps to
    # 5.5x less physical error.
    # Head abs: `head_cmd[t]` is the action pipeline delayed ~100 ms
    # (|action[t+3] - head_cmd[t]| = 0.90 deg), so anchoring on it makes the
    # start of every chunk a near-zero target - rel yaw std is 1.13 deg at step 3
    # against 12.50 deg at step 29. Absolute targets make the difficulty uniform
    # across the chunk. head_cmd remains a state input, just not an anchor.
    # Hands abs: grip targets were never anchored in any of these runs.
    action_mode: rel
    action_mode_apply_keys:
      - action.left_arm
      - action.right_arm
    action_mode_state_map:
      action.left_arm: state.left_arm
      action.right_arm: state.right_arm
    # emit base_index / (episode_length - 1) as `progress` in every sample.
    emit_progress: true
    sequential_step_sampling: false
    per_device_batch_size: 32   # global batch 128 (32 x 4 GPUs)
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    delete_pause_frame: false
    video_backend: torchcodec_cuda
    multiprocessing_context: spawn   # torchcodec_cuda cannot init CUDA in forked workers
    # 64-core box shared with other jobs (load ~90): 4 workers could not keep up
    # and the loop stalled 15 s every 4 steps (data_times 15.5 vs model 1.8).
    # Not disk-bound - iowait is 0 and the 51 GB of video fits in the 1.26 TB
    # page cache - so the fix is more decode workers, not faster storage.
    num_workers: 12
    prefetch_factor: 6
    in_order: false

trainer:
  # 412k frames: 1 epoch = 3,224 steps at batch 128, so 100k steps = 31.0
  # epochs. (The same 100k on car-real was 326 epochs — this set is 15x larger.)
  # Checkpoints every 5k so the best one can be picked after the fact.
  # Fine-tune from the finished 100k mix run rather than training from scratch.
  # Everything the checkpoint holds transfers: state_encoder is an MLP over the
  # last dim, so it accepts (B, 15, 42) as readily as (B, 1, 42). Only
  # `history_position_embedding` and `progress_head` are new (1.08M of 997M
  # params) and start random — load_pretrained_backbones uses strict=False.
  pretrained_checkpoint: playground/Checkpoints/starvla_qwengr00t_dit_leftturn_v2_mix/checkpoints/steps_100000_pytorch_model.pt
  # 5k steps x batch 128 = 1.6 epochs. The first attempt ran 20k and the action
  # metrics were flat from 5k onward (arm 2.38 -> 2.28 deg), while the progress
  # readout was already at MAE 0.060 by 5k — the extra 15k bought nothing. With
  # history_position_embedding zero-initialised the action path now starts where
  # the 100k checkpoint left it, so there is even less to re-learn.
  max_train_steps: 5000
  # Short warmup: the action path is already trained, only the two new modules
  # need to settle. A long warmup would mostly waste the budget.
  num_warmup_steps: 200
  save_interval: 1000
  eval_interval: 500
  # A fifth of the pretraining rate. The base run had converged by 70k (val was
  # flat from 70k to 100k), so a full-rate fine-tune would mostly undo it; the
  # job here is to fit the two new modules without disturbing the action path.
  learning_rate:
    base: 2.0e-06
    action_model: 2.0e-05
  # WSD: warmup 0-0.2k -> stable 0.2k-3.5k -> cosine decay 3.5k-5k
  lr_scheduler_type: warmup_stable_decay
  scheduler_specific_kwargs:
    num_decay_steps: 1500
    min_lr_ratio: 0.01
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true

  # Muon on the action head's 2D matrices only; the VLM stays on plain AdamW.
  # REQUIRES ZeRO stage 0 (launch with ACCELERATE_DEEPSPEED_ZERO_STAGE=0).
  optimizer:
    name: Muon
    muon_modules: [action_model]
    muon_lr: 2.0e-05
    muon_weight_decay: 1.0e-05
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-05
