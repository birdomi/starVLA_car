# QwenGR00T_EpisodeMemory on car-v3, from two pretrained parts:
#  * VLM + action DiT: the car-v3 Qwen3.5-2B DiT run (starvla_qwen35_2b_gr00t_dit_car_v3_3cam_50k_b1024.yaml, steps_50000)
#  * episode memory: the EgoDex multi-VLM memory pretraining (examples/realRobots/EgoDex/train_files/
#    memory_pretrain_multivlm_egodex.yaml, steps_50000, its Qwen3.5-2B export incl. token_resize 2048 -> 1024)
# Same memory / DiT layout as starvla_qwen35_2b_gr00t_dit_episodememory_n32d8_t1024_car1015_v3_3cam_20k.yaml (32 memory
# tokens, depth 8, d_model 768, token_dim 1024, gated attention), on the car-v3 data (21 tasks, the car_v3_3cam_headstate
# mixture). The DiT reads the memory through its existing Qwen cross-attention: [Qwen tokens ; 32 memory tokens + 1 progress
# token, projected to 2048] (episode_memory.condition: concat; the projections start at zero):
#  * the pretraining's Joint Decision Transformer (from its full checkpoint steps_50000.pt) reads the memory: only its
#    episode-progress output is used -> the progress logits (its 20-bin head, CE x 0.1) and, through a new projection
#    768 -> 2048, the progress token of the memory context (EpisodeMemory's own mean-pooled progress head is unused)
#  * frozen: Qwen, the pretrained memory core (init_tokens, in_proj, blocks: the part shared by every VLM in the
#    pretraining) and the decision transformer (its blocks, out_norm and the other 3 queries)
#  * trained: token_resize (the Qwen3.5-2B adapter in front of the memory, from the pretraining), the memory tokens'
#    readout (out_norm, mem_proj, source_embed: unused by the pretraining, still at their initialisation), the
#    episode-progress query + its progress head (from the pretraining) + the new progress projection, and the action
#    DiT
#  * memory updated from every episode's frame 0 about once per second (stream stride 30 +- 9 frames at 30 Hz, as the
#    pretraining's 1 s +- 0.3 s), truncated BPTT over the last 4 updates, progress token (50 bins, CE x 0.1)
#  * streams pick datasets / episodes by frames (balance_dataset_weights), each dataset with its episode list and
#    transforms (ch2 clip on car-0901 / car-3rd)
#  * 32 x 32 GPUs = global 1024 streams (= the car-v3 DiT's batch), 50k steps
# Launch: examples/realRobots/H1_2_car_real/train_files/hangang/train_car.sbatch <this yaml>
run_id: starvla_qwen35_2b_dit_episodememory_n32d8_t1024_egodex50k_car_v3_3cam_50k_b1024
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: ryk9012-gwangju-institute-of-science-and-technology
wandb_project: starVLA_h1_2_car
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T_EpisodeMemory
  num_views: 3              # head_left_2, wrist_left_2, wrist_right_2 (frame t)
  qwenvl:
    base_vlm: playground/Pretrained_models/Qwen3.5-2B
    # fla Triton kernels recompile per sequence length -> pad prompts to a multiple of 64
    pad_to_multiple_of: 64
    attn_implementation: flash_attention_2
    torch_dtype: bfloat16
  action_model:
    action_model_type: DiT-B
    action_dim: 42
    state_dim: 42           # measured head(2) + L arm(7) + R arm(7) + L hand(13) + R hand(13)
    action_horizon: 50
    repeated_diffusion_steps: 8
    num_inference_timesteps: 4
    num_target_vision_tokens: 0
    diffusion_model_cfg:
      memory_cond: false    # the memory context is appended to the Qwen tokens (episode_memory.condition: concat)
  episode_memory:
    # the pretraining's Qwen3.5-2B export: all 185 episode_memory.* tensors (token_resize + memory + readout)
    init_from: playground/Checkpoints/memory_pretrain_multivlm_n32d8_t1024_egodex/checkpoints/steps_50000_memory_qwen35_2b.pt
    token_dim: 1024         # VLM token resize MLP H -> 1024 (one memory architecture for every VLM)
    # the DiT reads [Qwen tokens ; 32 memory tokens + 1 progress token, projected to 2048] in its existing
    # cross-attention; the projections start at zero (the appended tokens carry no content until trained)
    condition: concat
    update_offsets: [0]     # stream: one update per step on the current frame (interval = datasets.vla_data.stream.stride)
    stream: {tbptt: 4}      # gradient through the last 4 updates (~4 s); needs the frozen VLM
    num_tokens: 32
    d_model: 768
    depth: 8
    num_heads: 12
    mlp_ratio: 4.0
    attention: gated        # sigmoid output gate per head channel (Qwen3.5 full-attention style)
    progress_bins: 50         # EpisodeMemory's own progress head: unused with decision (frozen below)
    progress_loss_weight: 0.1
    # the pretraining's Joint Decision Transformer, episode-progress output only (ProgressDecision)
    decision:
      init_from: playground/Checkpoints/memory_pretrain_multivlm_n32d8_t1024_egodex/checkpoints/steps_50000.pt
      num_layers: 2
      num_heads: 12
      mlp_ratio: 4.0
      progress_bins: 20

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: /appsdata/t509a04/data
    data_mix: car_v3_3cam_headstate   # the car-v3 DiT's data (+ ch2 clip on 0901 / 3rd)
    episode_lists: examples/realRobots/H1_2_car_real/car_v3_episode_lists.json   # per-dataset episode ids (train mixture)
    balance_dataset_weights: true   # streams pick datasets / episodes by frames
    emit_progress: true       # progress target t / (T - 1)
    # every batch position walks whole episodes from frame 0, one update every 30 +- 9 frames
    stream: {stride: 30, jitter: 9, random_start: false, random_phase: false}
    color_jitter: {brightness: 0.4, contrast: 0.4, saturation: 0.4, hue: 0.05}
    min_episode_length: 150
    lerobot_version: auto   # per dataset from meta/info.json: v3 is v3.0, the 0901 / 3rd overlays are v2.0
    action_mode: abs
    sequential_step_sampling: false
    per_device_batch_size: 32   # 32 x 32 GPUs = global 1024 streams
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    delete_pause_frame: false
    video_backend: torchvision_av   # no torchcodec / decord on aarch64
    video_backend_kwargs: {num_threads: 1}
    multiprocessing_context: fork
    num_workers: 16
    preprocess_in_workers: false
    cache_parquet_tables: false
    prefetch_factor: 4
    in_order: true          # streaming: batch k + 1 of a position continues batch k

trainer:
  # strict=False load: the car-v3 DiT has no episode_memory.* / norm_mem / attn_mem keys, so init_from's memory stays
  pretrained_checkpoint: playground/Checkpoints/starvla_qwen35_2b_dit_car_v3_3cam_50k_b1024/checkpoints/steps_50000_pytorch_model.pt
  max_train_steps: 50000
  num_warmup_steps: 1000
  save_interval: 5000
  eval_interval: 1000
  learning_rate:
    base: 1.0e-05           # nothing left in this group: the VLM is frozen
    action_model: 1.0e-04   # as the DiT's peak
    episode_memory: 1.0e-04 # token_resize + readout (the memory core is frozen)
    decision: 1.0e-04       # the episode-progress query, its progress head and the new progress projection
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr_rate: 0.01
  # Qwen, the pretrained memory core, the decision transformer (all but the progress query) and the unused
  # EpisodeMemory progress head / embedding; token_resize, the memory readout and the progress path stay trainable
  freeze_modules: qwen_vl_interface, episode_memory.init_tokens, episode_memory.in_proj, episode_memory.blocks, decision.jdt, episode_memory.progress_head, episode_memory.progress_embed
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  logging_frequency: 100
  gradient_clipping: 1.0
  skip_nonfinite_steps: true   # bf16 ZeRO-2 has no overflow check: skip inf / NaN gradient steps
  gradient_accumulation_steps: 1
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 0.0
