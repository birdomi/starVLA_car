# QwenGR00T_EpisodeMemory on car-1015-v3-ep, fine-tuned from the Qwen3.5-4B DiT baseline
# (starvla_qwen35_4b_gr00t_dit_car1015_v3_3cam_50k.yaml, steps_50000). The streamed gated-attention episode memory of
# starvla_qwengr00t_dit_episodememory_car1015_3cam.yaml (0.8B, car-1015-v1), with one change so that the 2B and 4B runs
# share the same memory architecture:
#  * token_dim 512: an MLP (LayerNorm -> Linear(H, 512) -> GELU -> Linear(512, 512), episode_memory.token_resize) maps
#    every VLM token (H = 2048 for 2B, 2560 for 4B) to 512 before the memory; the memory readout (16 memory tokens + 1
#    progress token) and the DiT's memory cross-attention are 512 wide as well (memory_dim 512).
#  * memory: updated continuously from every episode's frame 0, about once per second: each update interval drawn
#    uniformly from 30 +- 9 frames (0.7 - 1.3 s at 30 Hz, stream stride 30 / jitter 9), on the current frame's VLM tokens
#    (the DiT's own vl_embs); truncated BPTT over the last 4 updates (~4 s); progress token (50 bins, CE x 0.1)
#  * VLM frozen (the baseline's weights); trained: token_resize + memory (new) and the action DiT (incl. the new
#    zero-initialised memory cross-attention -> step 0 predicts exactly as the baseline)
#  * 16 x 32 GPUs = global 512 (= the baseline's batch) streams, 20k steps: 512 x 20k x 1 s ~ 119 walks per v3 episode,
#    each on ~1/30 of its frames (~4 epochs of frames)
# Twin: starvla_qwen35_2b_gr00t_dit_episodememory_t512_car1015_v3_3cam_20k.yaml (only base_vlm + checkpoint differ)
# Launch: examples/realRobots/H1_2_car_real/train_files/hangang/train_car.sbatch <this yaml>
run_id: starvla_qwen35_4b_dit_episodememory_t512_car1015_v3_3cam_20k_b512
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: ryk9012-gwangju-institute-of-science-and-technology
wandb_project: starVLA_h1_2_car
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T_EpisodeMemory
  num_views: 3              # head_left_2, wrist_left_2, wrist_right_2 (frame t)
  qwenvl:
    base_vlm: playground/Pretrained_models/Qwen3.5-4B
    # fla Triton kernels recompile per sequence length -> pad prompts to a multiple of 64
    pad_to_multiple_of: 64
    attn_implementation: flash_attention_2
    torch_dtype: bfloat16
  action_model:
    action_model_type: DiT-B
    action_dim: 42
    state_dim: 42           # measured head(2) + L arm(7) + R arm(7) + L hand(13) + R hand(13)
    action_horizon: 50
    repeated_diffusion_steps: 8
    num_inference_timesteps: 4
    num_target_vision_tokens: 0
    diffusion_model_cfg:
      memory_cond: true     # zero-init memory cross-attention in the DiT's cross-attention blocks
      memory_dim: 512       # == episode_memory.token_dim
  episode_memory:
    token_dim: 512          # VLM token resize MLP H -> 512 (same memory architecture for 2B / 4B)
    update_offsets: [0]     # stream: one update per step on the current frame (interval = datasets.vla_data.stream.stride)
    stream: {tbptt: 4}      # gradient through the last 4 updates (~4 s); needs the frozen VLM
    num_tokens: 16
    d_model: 768
    depth: 2
    num_heads: 12
    mlp_ratio: 4.0
    attention: gated        # sigmoid output gate per head channel (Qwen3.5 full-attention style)
    progress_bins: 50
    progress_loss_weight: 0.1

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: /appsdata/t509a04/data
    data_mix: car1015_v3_3cam_headstate   # the baseline's data config
    emit_progress: true       # progress target t / (T - 1)
    # every batch position walks whole episodes from frame 0 (random_start / random_phase off, also the stream's first
    # episode), one update every 30 +- 9 frames (uniform jitter per interval -> the walks cover all frames)
    stream: {stride: 30, jitter: 9, random_start: false, random_phase: false}
    color_jitter: {brightness: 0.4, contrast: 0.4, saturation: 0.4, hue: 0.05}
    min_episode_length: 150
    lerobot_version: "v3.0"
    action_mode: abs
    sequential_step_sampling: false
    per_device_batch_size: 16   # 16 x 32 GPUs = global 512
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    delete_pause_frame: false
    video_backend: torchvision_av   # no torchcodec / decord on aarch64
    video_backend_kwargs: {num_threads: 1}
    multiprocessing_context: fork
    num_workers: 16
    preprocess_in_workers: false
    cache_parquet_tables: false
    prefetch_factor: 4
    in_order: true          # streaming: batch k + 1 of a position continues batch k

trainer:
  # strict=False load: only episode_memory.* and the DiT's norm_mem / attn_mem keys are missing
  pretrained_checkpoint: playground/Checkpoints/starvla_qwen35_4b_dit_car1015_v3_3cam_50k_b512/checkpoints/steps_50000_pytorch_model.pt
  max_train_steps: 20000
  num_warmup_steps: 1000
  save_interval: 5000
  eval_interval: 1000
  learning_rate:
    base: 1.0e-05           # nothing left in this group: the VLM is frozen
    action_model: 1.0e-04   # as the baseline's peak (also the new zero-init memory cross-attention)
    episode_memory: 1.0e-04 # new module (incl. token_resize)
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr_rate: 0.01
  freeze_modules: qwen_vl_interface
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 0.0
