# Qwen3.5-0.8B + GR00T LEFT/RIGHT ACTION-GRID flow-matching DiT: same GridDiT head as starvla_qwen35_gr00t_griddit_robocasa.yaml,
# but the grid COLUMNS are body sides instead of the 5 joint keys -- left (arm + hand, 13-D), right (arm + hand, 13-D), waist (3-D).
# The GR1 action vector is laid out [left_arm 7 | right_arm 7 | left_hand 6 | right_hand 6 | waist 3], so a side is NOT contiguous:
# the columns are given as explicit index sets (action_group_indices) and the head gathers/scatters them.
# The grid ROWS are time patches: time_patch_size 1 -> 16 rows (16 x 3 = 48 tokens), 2 -> 8 rows (24 tokens), 4 -> 4 rows (12 tokens),
# 16 -> 1 row (3 tokens, each carrying a side's whole 16-step trajectory).
# Hyperparameters copied from the H1-2 car run on RoboCasa GR1 tabletop (24 tasks x 1000, ego view, 29-D action, 58-D sin/cos state)
# Launch: bash examples/simBenchmarks/launch_regressor_sim_local.sh examples/simBenchmarks/Robocasa_tabletop/train_files/starvla_qwen35_gr00t_leftright_griddit_tp2_robocasa.yaml [gpus] [port]
run_id: starvla_qwen35_0_8b_kf_actionmap_rc100_10k_robocasa_gr1_v3
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: ryk9012-gwangju-institute-of-science-and-technology
wandb_project: starVLA_robocasa
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T_GridDiT
  qwenvl:
    base_vlm: Qwen/Qwen3.5-0.8B
    attn_implementation: flash_attention_2
    # ZeRO-0 (needed by Muon) keeps no fp32 master copy, so the trained VLM
    # must hold fp32 weights; compute stays bf16 via autocast.
    torch_dtype: float32
    load_bf16: false
  action_model:
    action_dim: 29
    state_dim: 58
    action_horizon: 16   # matches the benchmark DataConfig (action_indices = 16)
    # flow-matching knobs (noise schedule, timestep buckets, inference steps) use the QwenGR00T
    # defaults, exactly like the H1-2 car yaml.
    # --- action grid: (16 / time_patch_size rows x 3 body-side columns) cells, each with its own encoder/decoder ---
    # action layout : [left_arm 0:7 | right_arm 7:14 | left_hand 14:20 | right_hand 20:26 | waist 26:29]
    action_group_indices:
      - "0:7,14:20"    # left  = left_arm  + left_hand   (13-D)
      - "7:14,20:26"   # right = right_arm + right_hand  (13-D)
      - "26:29"        # waist (3-D), belongs to neither side
    share_groups: [[0, 1]]   # left and right reuse ONE encoder / decoder / state encoder
    group_names: [left, right, waist]   # shows up as loss/left_l1, loss/right_l1, loss/waist_l1
    # how many consecutive timesteps one row covers: 1 | 2 | 4 | 8 | 16 (must divide action_horizon)
    time_patch_size: 1
    # Keyframe ActionMap: predict only anchors t=4,8,12,16 (0-indexed 3,7,11,15); loss touches only
    # these steps and inference fills the gaps by linear interpolation -> 4 rows x 3 groups = 12 tokens
    keyframe_stride: 4
    # dense reconstruction aux loss: interpolate the clean keyframe estimate to all 16 steps and
    # penalize MSE against the true dense trajectory
    # 손실 가중치 합 = 1: FM 0.5 + dense recon 0.5
    fm_loss_weight: 0.5
    dense_recon_weight: 0.5
    # state: 기본 DiT와 동일 — 58-D 전체를 MLP 하나로 한 토큰에 인코딩(그룹 분할 없음),
    # 시퀀스 선행 토큰으로 배치 (state_as_kv=false)
    state_single: true
    state_as_kv: false
    # === positional scheme v3 (2026-09-28~): 베이스라인 DiT와 같은 위치/조건 처리 ===
    # 셀(시간행 x 그룹)마다 학습형 절대 위치 임베딩 1개 -> 시간과 그룹 정체성을 모두 PE가 담당.
    # RoPE 없음. AdaLN은 베이스라인과 동일하게 768-d timestep 임베딩만 (그룹 조건 없음).
    # v2 대비 바뀐 것은 이 블록뿐 (state/recon/future token 등은 v2와 동일).
    add_pos_embed: true
    use_rope: false
    group_adaln_cond: false
    num_target_vision_tokens: 0

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: playground/Datasets/PhysicalAI-Robotics-GR00T-X-Embodiment-Sim
    data_mix: fourier_gr1_unified_1000
    # RoboCasa-100: keep only the FIRST 100 episodes of each task (~602k frames, 1/10 of the mix).
    # Normalization stats stay the full-dataset ones, so scaling matches the b256 full-data runs.
    max_episodes_per_dataset: 100
    lerobot_version: "v2.0"
    # RELATIVE joint targets: the loader emits a[t+i] - q[t] for every horizon step (datasets.py, mode "rel"),
    # so the head predicts displacements from the CURRENT joint position instead of absolute targets.
    # Restricted to arms + waist: for those keys state and action live in the same space (joint targets,
    # ~0.05 rad lag). The 6-finger hand ACTION is a [-3, 3] command while the hand STATE is a [0, 1.86]
    # finger angle, so "action - state" would be meaningless there -> hands stay ABSOLUTE.
    # Eval must mirror this: ROBOCASA_ACTION_MODE=rel ROBOCASA_ACTION_MODE_KEYS=left_arm,right_arm,waist
    action_mode: rel
    action_mode_apply_keys: [left_arm, right_arm, waist]
    sequential_step_sampling: false
    # 64 x 4 GPUs = global batch 256 (grad_accum 1)
    per_device_batch_size: 64
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    delete_pause_frame: false
    video_backend: decord
    video_backend_kwargs: {num_threads: 1}
    multiprocessing_context: fork
    num_workers: 16
    preprocess_in_workers: false   # QwenGR00T.forward does not accept pre-collated qwen_inputs (only the Regressor does)
    prefetch_factor: 2

trainer:
  # AdamW for EVERYTHING (no Muon) + cosine-with-min-lr, global batch 256, 100k steps.
  # 256 x 10k = 2.56M samples over the ~602k-frame rc100 subset -> ~4.25 epochs (matches the b256 full-data runs).
  max_train_steps: 10000
  num_warmup_steps: 500
  save_interval: 2500
  eval_interval: 500
  learning_rate:
    base: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-05
