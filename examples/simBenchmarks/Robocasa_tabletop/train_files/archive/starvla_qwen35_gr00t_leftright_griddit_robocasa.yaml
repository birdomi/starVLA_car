# Qwen3.5-0.8B + GR00T LEFT/RIGHT ACTION-GRID flow-matching DiT: same GridDiT head as starvla_qwen35_gr00t_griddit_robocasa.yaml,
# but the grid COLUMNS are body sides instead of the 5 joint keys -- left (arm + hand, 13-D), right (arm + hand, 13-D), waist (3-D).
# The GR1 action vector is laid out [left_arm 7 | right_arm 7 | left_hand 6 | right_hand 6 | waist 3], so a side is NOT contiguous:
# the columns are given as explicit index sets (action_group_indices) and the head gathers/scatters them.
# The grid ROWS are time patches: time_patch_size 1 -> 16 rows (16 x 3 = 48 tokens), 2 -> 8 rows (24 tokens), 4 -> 4 rows (12 tokens),
# 16 -> 1 row (3 tokens, each carrying a side's whole 16-step trajectory).
# Hyperparameters copied from the H1-2 car run on RoboCasa GR1 tabletop (24 tasks x 1000, ego view, 29-D action, 58-D sin/cos state)
# Launch: bash examples/simBenchmarks/launch_regressor_sim_local.sh examples/simBenchmarks/Robocasa_tabletop/train_files/starvla_qwen35_gr00t_leftright_griddit_robocasa.yaml [gpus] [port]
run_id: starvla_qwen35_0_8b_gr00t_lr_griddit_robocasa_gr1
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: ryk9012-gwangju-institute-of-science-and-technology
wandb_project: starVLA_robocasa
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T_GridDiT
  qwenvl:
    base_vlm: Qwen/Qwen3.5-0.8B
    attn_implementation: flash_attention_2
    # ZeRO-0 (needed by Muon) keeps no fp32 master copy, so the trained VLM
    # must hold fp32 weights; compute stays bf16 via autocast.
    torch_dtype: float32
    load_bf16: false
  action_model:
    action_dim: 29
    state_dim: 58
    action_horizon: 16   # matches the benchmark DataConfig (action_indices = 16)
    # flow-matching knobs (noise schedule, timestep buckets, inference steps) use the QwenGR00T
    # defaults, exactly like the H1-2 car yaml.
    # --- action grid: (16 / time_patch_size rows x 3 body-side columns) cells, each with its own encoder/decoder ---
    # action layout : [left_arm 0:7 | right_arm 7:14 | left_hand 14:20 | right_hand 20:26 | waist 26:29]
    action_group_indices:
      - "0:7,14:20"    # left  = left_arm  + left_hand   (13-D)
      - "7:14,20:26"   # right = right_arm + right_hand  (13-D)
      - "26:29"        # waist (3-D), belongs to neither side
    # state layout : sin/cos per key -> [left_arm 0:14 | right_arm 14:28 | left_hand 28:40 | right_hand 40:52 | waist 52:58]
    state_group_indices:
      - "0:14,28:40"   # left  (26-D)
      - "14:28,40:52"  # right (26-D)
      - "52:58"        # waist (6-D)
    group_names: [left, right, waist]   # shows up as loss/left_l1, loss/right_l1, loss/waist_l1
    # how many consecutive timesteps one row covers: 1 | 2 | 4 | 8 | 16 (must divide action_horizon)
    time_patch_size: 1
    state_as_kv: true      # per-group state tokens appended to the cross-attention KEYS/VALUES
    use_rope: true         # axial (time, group) RoPE in the DiT self-attention
    rope_theta: 10000.0
    num_target_vision_tokens: 0

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: playground/Datasets/PhysicalAI-Robotics-GR00T-X-Embodiment-Sim
    data_mix: fourier_gr1_unified_1000
    lerobot_version: "v2.0"
    action_mode: abs          # sims consume absolute joint targets
    sequential_step_sampling: false
    # 32 x 4 GPUs = global batch 128 (grad_accum 1)
    per_device_batch_size: 32
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    delete_pause_frame: false
    video_backend: decord
    video_backend_kwargs: {num_threads: 1}
    multiprocessing_context: fork
    num_workers: 16
    preprocess_in_workers: false   # QwenGR00T.forward does not accept pre-collated qwen_inputs (only the Regressor does)
    prefetch_factor: 2

trainer:
  # Same recipe as the H1-2 car run: Muon (action head only) + WSD, VLM trained with AdamW @ 1e-5.
  max_train_steps: 50000
  num_warmup_steps: 5000
  save_interval: 5000
  eval_interval: 500
  learning_rate:
    base: 1.0e-05
    action_model: 1.0e-04
  # WSD: warmup 0-5k -> stable 5k-40k -> cosine decay 40k-50k
  lr_scheduler_type: warmup_stable_decay
  scheduler_specific_kwargs:
    num_decay_steps: 10000
    min_lr_ratio: 0.01
  # VLM trains too: Muon is restricted to the action_model group via
  # optimizer.muon_modules; Qwen falls in the 'base' group -> pure AdamW @ 1e-5.
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true

  # torch.optim.Muon for 2D matrices of the action head, AdamW for the rest.
  # REQUIRES ZeRO stage 0 (launch_regressor_sim_local.sh sets ACCELERATE_DEEPSPEED_ZERO_STAGE=0).
  optimizer:
    name: Muon
    muon_modules: [action_model]
    muon_lr: 1.0e-04
    muon_weight_decay: 1.0e-05
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-05
