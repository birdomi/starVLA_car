# QwenGR00T_GeoResidual (user spec 10-22 "MoGe-2 Geometry-Guided Local Residual Policy"; choices: ego_view camera, SE(3)
# + FK/IK adapter, frozen System 2 = QwenGR00T rcfull 50k, vendored official MoGe; "Geometry Neck의 출력 feature를 사용하자.
# ViT feature나 다른 거 빼고"). Frozen System 2 (Qwen3.5-0.8B + DiT-B, sim baseline run qwengr00t_dit_rcfull_50k) + frozen
# MoGe-2 ViT-B geometry neck (levels 1-4 at 28 x 42) + trainable tokenizer / trajectory encoder / 3 x-attn blocks / zero-init
# regression head: 24-D residual (per hand dp 3, dw 3, dfinger 6) x K = 4 steps on System 2's local chunk at plan age 0 / 4 / 8.
# Loader: frames + states at deltas [-8, -4, 0] (oldest first), actions a[t .. t+15] (first 4 used as targets).
# Chain: geo_residual/run_geo_residual_rcfull.sh (smoke -> train -> eval with ROBOCASA_S2_EVERY=12, n_action_steps 4).
run_id: starvla_qwengr00t_georesidual_moge2b_neck_k4_rcfull_robocasa_gr1
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: ryk9012-gwangju-institute-of-science-and-technology
wandb_project: starVLA_robocasa
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T_GeoResidual
  qwenvl:                   # = qwengr00t_dit_rcfull_50k.yaml (System 2, loaded from trainer.pretrained_checkpoint)
    base_vlm: Qwen/Qwen3.5-0.8B
    attn_implementation: flash_attention_2
    torch_dtype: float32
    load_bf16: false
  action_model:
    action_model_type: DiT-B
    action_dim: 29
    state_dim: 58
    action_horizon: 16
    repeated_diffusion_steps: 8
    num_inference_timesteps: 4
    num_target_vision_tokens: 0
  geo_residual:
    moge_path: playground/Pretrained_models/moge-2-vitb-normal/model.pt
    moge_num_tokens: 1200     # crop 172 x 256 -> base grid 28 x 42 (MoGe's trained range 1200-3600)
    moge_crop: [42, 214, 0, 256]
    neck_levels: [1, 2, 3, 4] # 256 + 128 + 64 + 32 = 480 ch, area-pooled to 28 x 42 -> 1176 geometry tokens
    action_stats: playground/Checkpoints/starvla_qwengr00t_dit_0p8b_h16_rcfull_robocasa_gr1/dataset_statistics.json
    horizon: 4
    s2_offsets: [0, 4, 8]
    d_model: 256
    heads: 8
    n_layers: 3
    pos_scale: 0.02
    rot_scale: 0.05
    finger_scale: 0.1

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: playground/Datasets/PhysicalAI-Robotics-GR00T-X-Embodiment-Sim
    data_mix: fourier_gr1_unified_1000
    delta_indices_override:
      video.ego_view: [-8, -4, 0]
      state.left_arm: [-8, -4, 0]
      state.right_arm: [-8, -4, 0]
      state.left_hand: [-8, -4, 0]
      state.right_hand: [-8, -4, 0]
      state.waist: [-8, -4, 0]
    lerobot_version: "v2.0"
    sequential_step_sampling: false
    per_device_batch_size: 32   # 32 x 4 GPUs = global 128
    load_all_data_for_training: true
    obs_image_size: [256, 256]
    delete_pause_frame: false
    video_backend: decord
    video_backend_kwargs: {num_threads: 1}
    multiprocessing_context: fork
    num_workers: 8
    preprocess_in_workers: false
    prefetch_factor: 2

trainer:
  pretrained_checkpoint: playground/Checkpoints/starvla_qwengr00t_dit_0p8b_h16_rcfull_robocasa_gr1/checkpoints/steps_50000_pytorch_model.pt
  reload_modules: qwen_vl_interface,action_model
  freeze_modules: qwen_vl_interface,action_model,geo_backbone
  max_train_steps: 20000
  num_warmup_steps: 500
  save_interval: 5000
  eval_interval: 1000
  learning_rate:
    base: 1.0e-04           # geo_tokenizer / traj_encoder / residual_decoder / residual_head
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr_rate: 0.01
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 0.0
