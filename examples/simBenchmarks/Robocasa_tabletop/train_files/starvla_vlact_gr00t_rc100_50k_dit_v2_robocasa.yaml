# --- VLAct backbone (2026-10-06) ---------------------------------------------------------------------------
# Same recipe as the rc100 50k baseline (starvla_qwen35_gr00t_rc100_50k_dit_v2_robocasa.yaml) except the VLM:
#   Qwen3.5-0.8B  ->  VLAct Qwen3-VL-4B (StarVLA/VLAct_Qwen3_Pretrain, robot continued-pretrain, arXiv 2608.27550).
# Only qwen_vl_interface is loaded from the VLAct checkpoint (= VLAct's random_init_action_model): the action head
# is freshly initialised exactly as in the baseline. base_vlm MUST be Qwen3-VL-4B-Instruct-Action (vocab 153984 =
# Qwen3-VL-4B + 2048 <robot_action_*> tokens) - plain Qwen3-VL-4B-Instruct (151936) does not match the checkpoint.
# Prompt = plain instruction, same as the baseline (VLAct pretrained with "Task: .., State: ..; Please predict ..").
# Precision/launcher: DeepSpeed ZeRO-2 + bf16 (fp32 master weights sharded), as VLAct trains. The baseline's
# torchrun ZeRO-0 path keeps NO fp32 master copy and QWen3.py loads bf16 -> lr-1e-5 VLM updates would round away;
# fp32 weights there would need ~75 GB/GPU before activations. run_rc100_train_eval.sh reads launch_zero_stage.
# Qwen3.5-0.8B + GR00T flow-matching DiT head (QwenGR00T, same as the H1-2 car run), hyperparameters copied from the H1-2 car run
# (examples/realRobots/H1_2_car/train_files/starvla_qwengr00t_car3task_100k.yaml) on RoboCasa GR1 tabletop (24 tasks x 1000, ego view, 29-D action, 58-D sin/cos state)
# Launch: bash examples/simBenchmarks/launch_regressor_sim_local.sh examples/simBenchmarks/Robocasa_tabletop/train_files/starvla_qwen35_gr00t_dit_robocasa.yaml [gpus] [port]
run_id: starvla_vlact_qwen3vl_4b_dit_rc100_50k_b128_robocasa_gr1_v2
launch_zero_stage: 2   # read by run_rc100_train_eval.sh (accelerate + deepspeed_zero2.yaml)
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: ryk9012-gwangju-institute-of-science-and-technology
wandb_project: starVLA_robocasa
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3-VL-4B-Instruct-Action
    attn_implementation: flash_attention_2
    # bf16 weights; ZeRO-2 bf16 keeps the fp32 master copy (QWen3.py loads bf16 regardless of yaml dtype keys)
  action_model:
    action_dim: 29
    state_dim: 58
    action_horizon: 16   # matches the benchmark DataConfig (action_indices = 16)
    # flow-matching knobs (noise schedule, timestep buckets, inference steps) use the QwenGR00T
    # defaults, exactly like the H1-2 car yaml.
    # future token(GR00T 학습형 query 토큰) 0개: 기본값 32 대신 Grid 계열(ActionMap/Keyframe)과 동일하게 맞춤.
    # v1 베이스라인(run_id ..._gr1, 32개)과의 차이는 이 한 줄뿐.
    num_target_vision_tokens: 0

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: playground/Datasets/PhysicalAI-Robotics-GR00T-X-Embodiment-Sim
    data_mix: fourier_gr1_unified_1000
    # RoboCasa-100: keep only the FIRST 100 episodes of each task (~602k frames, 1/10 of the mix).
    # Normalization stats stay the full-dataset ones, so scaling matches the b256 full-data runs.
    max_episodes_per_dataset: 100
    lerobot_version: "v2.0"
    # RELATIVE joint targets: the loader emits a[t+i] - q[t] for every horizon step (datasets.py, mode "rel"),
    # so the head predicts displacements from the CURRENT joint position instead of absolute targets.
    # Restricted to arms + waist: for those keys state and action live in the same space (joint targets,
    # ~0.05 rad lag). The 6-finger hand ACTION is a [-3, 3] command while the hand STATE is a [0, 1.86]
    # finger angle, so "action - state" would be meaningless there -> hands stay ABSOLUTE.
    # Eval must mirror this: ROBOCASA_ACTION_MODE=rel ROBOCASA_ACTION_MODE_KEYS=left_arm,right_arm,waist
    action_mode: rel
    action_mode_apply_keys: [left_arm, right_arm, waist]
    sequential_step_sampling: false
    # 32 x 4 GPUs = global batch 128 (grad_accum 1)
    per_device_batch_size: 32
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    delete_pause_frame: false
    video_backend: decord
    video_backend_kwargs: {num_threads: 1}
    multiprocessing_context: fork
    num_workers: 8
    preprocess_in_workers: false   # QwenGR00T.forward does not accept pre-collated qwen_inputs (only the Regressor does)
    prefetch_factor: 2

trainer:
  # VLAct init: load ONLY the VLM from the VLAct pretrain checkpoint (strict), head stays random
  pretrained_checkpoint: ./playground/Pretrained_models/VLAct-Qwen3VL4B-Pretrained/checkpoints/steps_100000_pytorch_model.pt
  reload_modules: qwen_vl_interface
  # AdamW for EVERYTHING (no Muon) + cosine-with-min-lr, global batch 128, 50k steps.
  # 128 x 50k = 6.4M samples over the ~602k-frame rc100 subset -> ~10.6 epochs (10k/b256 runs: ~4.25).
  max_train_steps: 50000
  num_warmup_steps: 500
  save_interval: 10000
  eval_interval: 500
  learning_rate:
    base: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-05
