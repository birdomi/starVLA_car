# RoboCasa GR1 version of the car-v3 end-to-end episode-memory model
# (examples/realRobots/H1_2_car_real/train_files/starvla_qwen35_2b_gr00t_dit_episodememory_e2e_egodex50k_car_v3_3cam_50k_b768.yaml):
# Qwen3.5-2B (fully fine-tuned) + a new GR00T flow DiT-B + the EgoDex-pretrained episode memory (memory_pretrain_multivlm_egodex,
# steps_50000) attached from step 0, memory core and decision transformer frozen, the DiT reading
# [Qwen tokens ; 32 memory tokens + 1 progress token] (condition: concat).
# Everything RoboCasa-side is the full-data DiT baseline (starvla_qwen35_2b_gr00t_rcfull_50k_dit_v2_robocasa.yaml, 41.2%):
# data mix and sampling weights, rel arm/waist targets, 29-D action x 16, 58-D state, 224 x 224, fp32 weights + ZeRO-0
# (torchrun), AdamW, LR 1e-5 / 1e-4, warmup 500, cosine to 5e-7, global batch 128, 50k steps. Changes for the memory:
#  * one camera (ego_view), stream sampling: every batch position walks whole episodes from frame 0, one memory update
#    every 20 +- 6 frames (1 s at the data's 20 Hz, the car's 30 +- 9 frames at 30 Hz), BPTT over 4 updates, Qwen trained
#    through the current frame (vlm_grad)
#  * progress target t / (T - 1) for the frozen decision transformer's progress query (CE x 0.1)
# Sim eval needs a policy server that carries the memory across the calls of an episode (the stock server does not).
# Hangang: hangang/train_rc100.sbatch <this yaml>
run_id: starvla_qwen35_2b_dit_episodememory_e2e_egodex50k_rcfull_50k_b128_robocasa_gr1
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: ryk9012-gwangju-institute-of-science-and-technology
wandb_project: starVLA_robocasa
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T_EpisodeMemory
  num_views: 1              # ego_view (frame t)
  qwenvl:
    base_vlm: playground/Pretrained_models/Qwen3.5-2B
    # fla Triton kernels recompile per sequence length -> pad prompts to a multiple of 64
    pad_to_multiple_of: 64
    attn_implementation: flash_attention_2
    # ZeRO-0 keeps no fp32 master copy, so the trained VLM holds fp32 weights; compute stays bf16 via autocast
    # (as the RoboCasa DiT baseline)
    torch_dtype: float32
    load_bf16: false
  action_model:
    action_model_type: DiT-B
    action_dim: 29
    state_dim: 58
    action_horizon: 16   # matches the benchmark DataConfig (action_indices = 16)
    repeated_diffusion_steps: 8
    num_inference_timesteps: 4
    num_target_vision_tokens: 0
    diffusion_model_cfg:
      memory_cond: false    # the memory context is appended to the Qwen tokens (episode_memory.condition: concat)
  episode_memory:
    # the pretraining's Qwen3.5-2B export: all episode_memory.* tensors (token_resize + memory + readout)
    init_from: playground/Checkpoints/memory_pretrain_multivlm_n32d8_t1024_egodex/checkpoints/steps_50000_memory_qwen35_2b.pt
    token_dim: 1024         # VLM token resize MLP H -> 1024 (one memory architecture for every VLM)
    # the DiT reads [Qwen tokens ; 32 memory tokens + 1 progress token, projected to 2048] in its existing
    # cross-attention; the projections start at zero (the appended tokens carry no content until trained)
    condition: concat
    update_offsets: [0]     # stream: one update per step on the current frame (interval = datasets.vla_data.stream.stride)
    stream: {tbptt: 4, vlm_grad: true}   # BPTT over the last 4 updates (~4 s); Qwen trains through the current frame
    num_tokens: 32
    d_model: 768
    depth: 8
    num_heads: 12
    mlp_ratio: 4.0
    attention: gated
    progress_bins: 50         # EpisodeMemory's own progress head: unused with decision (frozen below)
    progress_loss_weight: 0.1
    # the pretraining's Joint Decision Transformer, episode-progress output only (ProgressDecision)
    decision:
      init_from: playground/Checkpoints/memory_pretrain_multivlm_n32d8_t1024_egodex/checkpoints/steps_50000.pt
      num_layers: 2
      num_heads: 12
      mlp_ratio: 4.0
      progress_bins: 20

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: playground/Datasets/PhysicalAI-Robotics-GR00T-X-Embodiment-Sim
    data_mix: fourier_gr1_unified_1000
    # full data: no max_episodes_per_dataset (all 1000 episodes per task); streams pick tasks / episodes with the
    # baseline's weights (balance_* false: uniform task, uniform episode)
    lerobot_version: "v2.0"
    emit_progress: true       # progress target t / (T - 1)
    # every batch position walks whole episodes from frame 0, one update every 20 +- 6 frames (20 Hz data)
    stream: {stride: 20, jitter: 6, random_start: false, random_phase: false}
    # RELATIVE joint targets for arms + waist, hands absolute (as the DiT baseline).
    # Eval must mirror this: ROBOCASA_ACTION_MODE=rel ROBOCASA_ACTION_MODE_KEYS=left_arm,right_arm,waist
    action_mode: rel
    action_mode_apply_keys: [left_arm, right_arm, waist]
    sequential_step_sampling: false
    # 32 x 4 GPUs = 128 streams (grad_accum 1)
    per_device_batch_size: 32
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    delete_pause_frame: false
    video_backend: torchvision_av   # decord has no aarch64 build (Hangang GH200)
    video_backend_kwargs: {num_threads: 1}
    multiprocessing_context: fork
    num_workers: 8
    preprocess_in_workers: false
    prefetch_factor: 2
    in_order: true          # streaming: batch k + 1 of a position continues batch k

trainer:
  max_train_steps: 50000
  num_warmup_steps: 500
  save_interval: 5000
  eval_interval: 500
  learning_rate:
    base: 1.0e-05           # qwen_vl_interface (full fine-tuning)
    action_model: 1.0e-04   # the new DiT
    episode_memory: 1.0e-04 # token_resize + readout (the memory core is frozen)
    decision: 1.0e-04       # the episode-progress query, its progress head and the new progress projection
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07
  # the pretrained memory core, the decision transformer (all but the progress query) and the unused EpisodeMemory
  # progress head / embedding; Qwen trains
  freeze_modules: episode_memory.init_tokens, episode_memory.in_proj, episode_memory.blocks, decision.jdt, episode_memory.progress_head, episode_memory.progress_embed
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-05
