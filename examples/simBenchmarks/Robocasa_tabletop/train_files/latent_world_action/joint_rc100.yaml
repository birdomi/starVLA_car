# QwenLatentWorldAction on RoboCasa-100 (first 100 of the 1000 demos per task, 24 GR1 tabletop tasks, ~602k frames):
# DEFAULT RECIPE = stage C only, END-TO-END JOINT TRAINING FROM SCRATCH. No stage A / B checkpoint: System 1.5 and
# System 1 start from random init; Qwen3.5-0.8B and C-RADIOv4 are the frozen pretrained models. One loop, one backward:
#   S = Qwen(I_t, instr), Z_t / Z_f = C-RADIO(I_t / I_t+16), X_1 = (Z_f - Z_t) / s
#   FM pass      v^ = v(X_tau, tau | Z_t, S), tau ~ U(0,1)          L_FM = ||v^ - (X_1 - eps)||^2
#   ODE samples  dZ_1, dZ_4 = 1- and 4-step euler ODE from the same X_0 ~ N(0, I) (tau 0 | 0, .25, .5, .75; the tau = 0
#                velocity is shared -> 4 DiT evaluations), differentiable (= the inference path, no GT in the input)
#   hidden pass  H_f = backbone(dZ_k | GT X_1 with p_gt, tau = 1 | Z_t, S), both k in one batch -> ActionQueryDecoder
#                -> A^_k,  L_action = mean_k SmoothL1(A^_k, A)
#   p_gt (scheduled teacher forcing, per example): 1.0 at step 0 -> 0.05 at step 10k (ODE samples with p >= 0.95).
#   L = lambda_FM L_FM + lambda_A(step) L_action; lambda_A: 0.1 -> 1.0 linearly over the first 2000 steps.
#   L_action -> H_f -> dZ_k -> every ODE step -> System 1.5 (velocity head, blocks, conditioning projectors) and -> System 1.
# Per step: FM pass (2 B rows) + 4 ODE evaluations (B) + hidden pass (2 B), all with graph (endpoint path: 2 B + B).
# Validation / inference use the full ODE (euler, system15.sample_steps = 4) -> dZ_hat -> H_f -> A^; the eval hook
# also reports the 1-step path (system1/rmse_pred_ode1, system15/cos_ode1).
# The previous recipe (100k run starvla_lwa_joint_scratch_rc100_100k): action_path endpoint, endpoint_tau shared.
# Time alignment: action chunk a_t .. a_{t+15}; future frame t + 16 = right after the chunk. Episode-end clamped futures
# (future_valid false, ~8.6 %) are left out of L_FM.
# Launch (4 GPUs, ZeRO-0, setsid; log in the repo root):
#   bash examples/simBenchmarks/launch_regressor_sim_local.sh <this yaml> 4,5,6,7 <port>
# The staged recipe (stageA / stageB / stageC yamls in this folder) is kept for comparison.
run_id: starvla_lwa_joint_scratch_rc100_robocasa_gr1
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: ryk9012-gwangju-institute-of-science-and-technology
wandb_project: starVLA_robocasa
is_debug: false
version_id: "0.21"

framework:
  name: QwenLatentWorldAction
  qwenvl:                   # System 2 (repo VLM interface, unmodified)
    base_vlm: Qwen/Qwen3.5-0.8B
    attn_implementation: flash_attention_2
    torch_dtype: bfloat16   # frozen; float32 for system2.finetune full under ZeRO-0
  system2:
    finetune: frozen        # frozen | full | lora (then remove qwen_vl_interface from trainer.freeze_modules)
    lora: {r: 16, alpha: 32, dropout: 0.05, target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]}
  radio:
    path: playground/Pretrained_models/C-RADIOv4-SO400M   # C-RADIOv4-H: point to its HF dir (+ new stats)
    input_size: [256, 256]  # (H, W) -> 16 x 16 = 256 patch tokens, current and future alike
    feature: backbone
    dtype: bfloat16
    outlier_norm: 100.0     # C-RADIO's fixed top-row artifact token (1 of 256) is masked
    mask_outliers: true
    normalize_features: true
    stats_path: playground/Pretrained_models/C-RADIOv4-SO400M/trisystem_stats_rc100_256x256_f16.pt
    trainable: false
    cache_dir: null         # e.g. playground/Cache/lwa_radio_rc100_256 (raw features, ~0.6 MB / frame)
  system15:                 # LatentFlowDiT: self-attn over X_tau, cross-attn Z_t, cross-attn S (masked), adaLN(tau)
    d_model: 768
    depth: 12
    num_heads: 12
    mlp_ratio: 4.0
    cond_dim: null          # = d_model
    dropout: 0.0
    attn_dropout: 0.0
    adaln_cond: tau
    tau_schedule: {schedule: uniform}
    num_noise_samples: 2
    delta_norm: rms         # X_1 = dZ / per-channel RMS(dZ)
    sample_steps: 4         # inference ODE (also stage B's predicted H_f)
    solver: euler           # euler | heun | midpoint | rk4
    grad_ckpt: false
  system1:                  # ActionQueryDecoder: learnable queries x cross-attn H_f -> regression head
    d_model: 512
    depth: 4
    num_heads: 8
    mlp_ratio: 4.0
    dropout: 0.1
    state_conditioning: token
    loss: smooth_l1
    smooth_l1_beta: 0.1
    hidden_source: pred
  action_model:
    action_dim: 29
    state_dim: 58           # sin/cos state
    action_horizon: 16
  latent_world:
    stage: C                # end-to-end joint training
    image_layout: [t, f]    # [ego t, ego t+16] (fourier_gr1_arms_waist_future16)
    radio_view: 0
    future_offset: 16
    mask_clamped_future: true
    loss_weights: {fm: 1.0, action: 1.0}   # lambda_FM, target lambda_A
    joint:
      action_path: ode          # ode: ODE samples (ode_steps) | endpoint: dZ~ = X_tau + (1 - tau) v^ of the FM pass
      ode_steps: [1, 4]         # one sample per step count, same noise; L_action averaged over them
      endpoint_tau: shared      # (endpoint path only) shared: the FM draw | zero: own pure-noise pass at tau 0
      action_grad: full         # full: L_action -> H_f -> dZ_k -> ODE steps -> System 1.5 | final_pass | none (ablations)
      action_grad_scale: 1.0
      action_loss_schedule: linear   # linear | fixed
      action_loss_warmup_steps: 2000
      action_loss_weight_start: 0.1
      # scheduled teacher forcing: System 1 reads the GT dZ instead of the ODE samples with p_gt(step), 1.0 at the
      # start -> 0.05 after gt_prob_decay_steps (ODE samples with probability >= 0.95); per example, training only
      gt_prob_schedule: linear  # linear | cosine | fixed (= gt_prob_end)
      gt_prob_start: 1.0
      gt_prob_end: 0.05
      gt_prob_decay_steps: 10000
      grad_norm_log_interval: null   # per-loss gradient norms (grad_norm/fm->system15, action->system15, ...) every
                                     # trainer.logging_frequency steps; costs one extra backward on those steps
    eval: {num_samples: 64, batch_size: 16, seed: 0}

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    emit_frame_meta: true   # frame_offsets / future_valid / sample_key / frame_keys
    data_root_dir: playground/Datasets/PhysicalAI-Robotics-GR00T-X-Embodiment-Sim
    data_mix: fourier_gr1_unified_1000_future16
    max_episodes_per_dataset: 100
    lerobot_version: "v2.0"
    # rel targets on arms + waist (a[t+i] - q[t]), hands absolute (= the rc100 baselines). Sim eval must mirror it:
    # ROBOCASA_ACTION_MODE=rel ROBOCASA_ACTION_MODE_KEYS=left_arm,right_arm,waist
    action_mode: rel
    action_mode_apply_keys: [left_arm, right_arm, waist]
    sequential_step_sampling: false
    per_device_batch_size: 32   # x 4 GPUs = 128
    load_all_data_for_training: true
    obs_image_size: [256, 256]
    delete_pause_frame: false
    video_backend: decord
    video_backend_kwargs: {num_threads: 1}
    multiprocessing_context: fork
    num_workers: 8
    prefetch_factor: 2
  val_data:   # held-out demos 900-999 of each task, eval hook only
    dataset_py: lerobot_datasets
    include_state: true
    emit_frame_meta: true
    data_root_dir: playground/Datasets/PhysicalAI-Robotics-GR00T-X-Embodiment-Sim
    data_mix: fourier_gr1_unified_1000_future16
    skip_first_episodes: 900
    max_episodes_per_dataset: 100
    lerobot_version: "v2.0"
    action_mode: rel
    action_mode_apply_keys: [left_arm, right_arm, waist]
    obs_image_size: [256, 256]
    video_backend: decord
    video_backend_kwargs: {num_threads: 1}

trainer:
  max_train_steps: 50000
  num_warmup_steps: 1000
  save_interval: 10000
  eval_interval: 1000
  learning_rate:
    base: 1.0e-05
    system15: 1.0e-04       # System 1.5 param group
    system1: 1.0e-04        # System 1 param group
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr_rate: 0.01
  freeze_modules: qwen_vl_interface,radio_encoder   # optimizer = System 1.5 + System 1 only
  max_grad_norm: 1.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 0.0
