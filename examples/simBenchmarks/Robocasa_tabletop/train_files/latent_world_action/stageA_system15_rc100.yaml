# [staged recipe; the default is joint_rc100.yaml (stage C only, from scratch)]
# QwenLatentWorldAction on RoboCasa-100 (first 100 of the 1000 demos per task, 24 GR1 tabletop tasks, ~602k frames),
# stage A: System 1.5 pretraining, L_FM only. Qwen3.5-0.8B, C-RADIOv4 and System 1 are frozen.
#   ego view t + instruction -> Qwen3.5-0.8B -> S (last hidden states of all vision + text tokens)
#   ego view t / t+16 -> C-RADIOv4-SO400M (256x256) -> Z_t / Z_f [16x16 = 256, 1152];  dZ = Z_f - Z_t
#   Time alignment: action chunk a_t .. a_{t+15} (16 steps, 0.8 s at 20 Hz); future frame t + 16 = the observation
#   right after the chunk was executed (future_offset == action_horizon == data config video delta 16).
#   Samples whose t + 16 runs past the episode end (the loader clamps to the last frame) are left out of L_FM
#   (emit_frame_meta + latent_world.mask_clamped_future).
# Stats: reuses the QwenGR00T_TriSystem rc100 C-RADIO stats (same encoder, 256x256, backbone, t -> t+16). To recompute:
#   python starVLA/training/latent_world_action_tools.py stats --config_yaml <this yaml> --num_samples 4096
# Next: stageB_system1_rc100.yaml. Launch (4 GPUs, ZeRO-0, setsid):
#   bash examples/simBenchmarks/launch_regressor_sim_local.sh <this yaml> 4,5,6,7 <port>
run_id: starvla_lwa_s1p5_rc100_robocasa_gr1
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: ryk9012-gwangju-institute-of-science-and-technology
wandb_project: starVLA_robocasa
is_debug: false
version_id: "0.21"

framework:
  name: QwenLatentWorldAction
  qwenvl:                   # System 2 (repo VLM interface, unmodified)
    base_vlm: Qwen/Qwen3.5-0.8B
    attn_implementation: flash_attention_2
    torch_dtype: bfloat16   # frozen; float32 for system2.finetune full under ZeRO-0
  system2:
    finetune: frozen        # frozen | full | lora (then remove qwen_vl_interface from trainer.freeze_modules)
    lora: {r: 16, alpha: 32, dropout: 0.05, target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]}
  radio:
    path: playground/Pretrained_models/C-RADIOv4-SO400M   # C-RADIOv4-H: point to its HF dir (+ new stats)
    input_size: [256, 256]  # (H, W) -> 16 x 16 = 256 patch tokens, current and future alike
    feature: backbone
    dtype: bfloat16
    outlier_norm: 100.0     # C-RADIO's fixed top-row artifact token (1 of 256) is masked
    mask_outliers: true
    normalize_features: true
    stats_path: playground/Pretrained_models/C-RADIOv4-SO400M/trisystem_stats_rc100_256x256_f16.pt
    trainable: false
    cache_dir: null         # e.g. playground/Cache/lwa_radio_rc100_256 (raw features, ~0.6 MB / frame)
  system15:                 # LatentFlowDiT: self-attn over X_tau, cross-attn Z_t, cross-attn S (masked), adaLN(tau)
    d_model: 768
    depth: 12
    num_heads: 12
    mlp_ratio: 4.0
    cond_dim: null          # = d_model
    dropout: 0.0
    attn_dropout: 0.0
    adaln_cond: tau
    tau_schedule: {schedule: uniform}
    num_noise_samples: 2
    delta_norm: rms         # X_1 = dZ / per-channel RMS(dZ)
    sample_steps: 4         # inference ODE (also stage B's predicted H_f)
    solver: euler           # euler | heun | midpoint | rk4
    grad_ckpt: false
  system1:                  # ActionQueryDecoder (frozen in this stage)
    d_model: 512
    depth: 4
    num_heads: 8
    mlp_ratio: 4.0
    dropout: 0.1
    state_conditioning: token
    loss: smooth_l1
    smooth_l1_beta: 0.1
    hidden_source: pred
  action_model:
    action_dim: 29
    state_dim: 58           # sin/cos state
    action_horizon: 16
  latent_world:
    stage: A
    image_layout: [t, f]    # [ego t, ego t+16] (fourier_gr1_arms_waist_future16)
    radio_view: 0
    future_offset: 16
    mask_clamped_future: true
    eval: {num_samples: 64, batch_size: 16, seed: 0}

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    emit_frame_meta: true   # frame_offsets / future_valid / sample_key / frame_keys
    data_root_dir: playground/Datasets/PhysicalAI-Robotics-GR00T-X-Embodiment-Sim
    data_mix: fourier_gr1_unified_1000_future16
    max_episodes_per_dataset: 100
    lerobot_version: "v2.0"
    # rel targets on arms + waist (a[t+i] - q[t]), hands absolute (= the rc100 baselines). Sim eval must mirror it:
    # ROBOCASA_ACTION_MODE=rel ROBOCASA_ACTION_MODE_KEYS=left_arm,right_arm,waist
    action_mode: rel
    action_mode_apply_keys: [left_arm, right_arm, waist]
    sequential_step_sampling: false
    per_device_batch_size: 32   # x 4 GPUs = 128
    load_all_data_for_training: true
    obs_image_size: [256, 256]
    delete_pause_frame: false
    video_backend: decord
    video_backend_kwargs: {num_threads: 1}
    multiprocessing_context: fork
    num_workers: 8
    prefetch_factor: 2
  val_data:   # held-out demos 900-999 of each task, eval hook only
    dataset_py: lerobot_datasets
    include_state: true
    emit_frame_meta: true
    data_root_dir: playground/Datasets/PhysicalAI-Robotics-GR00T-X-Embodiment-Sim
    data_mix: fourier_gr1_unified_1000_future16
    skip_first_episodes: 900
    max_episodes_per_dataset: 100
    lerobot_version: "v2.0"
    action_mode: rel
    action_mode_apply_keys: [left_arm, right_arm, waist]
    obs_image_size: [256, 256]
    video_backend: decord
    video_backend_kwargs: {num_threads: 1}

trainer:
  max_train_steps: 30000
  num_warmup_steps: 1000
  save_interval: 10000
  eval_interval: 1000
  learning_rate:
    base: 1.0e-05
    system15: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr_rate: 0.01
  freeze_modules: qwen_vl_interface,radio_encoder,system1
  max_grad_norm: 1.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 0.0
