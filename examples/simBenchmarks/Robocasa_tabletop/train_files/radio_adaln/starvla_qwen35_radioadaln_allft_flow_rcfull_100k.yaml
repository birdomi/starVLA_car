# QwenGR00T_RadioAdaLN (user 10-19), EVERYTHING TRAINED: System 2 = current-frame features only (no DiT):
# Qwen3.5-0.8B (ViT + LM) and C-RADIOv4-SO400M (all 431M, radio.trainable) both fine-tuned on frame t; Qwen's OUTPUT
# vision tokens (the LM's last hidden states at the 64 <|image_pad|> positions, 8 x 8 at 256 x 256) are AdaLN-modulated
# by the co-located C-RADIO patches (2 x 2 of the 16 x 16 grid) + the image's C-RADIO summary (standard AdaLN:
# LN(x) (1 + gamma) + beta, zero-init); text tokens get a plain LayerNorm with a learned affine (radio_adaln.text_norm,
# as GR00T's vlln: same scale as the vision tokens). System 1 = the ONLY DiT: GR00T flow-matching DiT-B (16 layers),
# input = noisy 16-step action chunk + state token, cross-attention condition = [Qwen last hidden states (normalised,
# vision modulated), C-RADIO patch + summary tokens projected to 1024]. Training budget / data as the am5reg DualSystem
# run (sim 49.8%, dual_system/joint_system12_plancond_kf025_am5reg_rcfull_100k.yaml): full RoboCasa GR1 set, ABSOLUTE
# actions (min_max), 256 x 256, global batch 128, 100k steps, lr 1e-5 Qwen + C-RADIO / 1e-4 heads, cosine to 1%.
# Eval: dual_system/eval_dualsystem_rc100.sh (absolute actions, state sent, 256 x 256, 12 of 16 actions per call).
# Chain: radio_adaln/run_radioadaln_rcfull.sh (train -> sim eval -> paired vs am5reg / staged / joint).
run_id: starvla_qwen35_radioadaln_allft_flow_h16_rcfull_robocasa_gr1
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: ryk9012-gwangju-institute-of-science-and-technology
wandb_project: starVLA_robocasa
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T_RadioAdaLN
  qwenvl:
    base_vlm: Qwen/Qwen3.5-0.8B
    attn_implementation: flash_attention_2
    torch_dtype: float32    # trained -> fp32 weights (ZeRO-0 keeps no fp32 master copy); compute is bf16 autocast
    load_bf16: false
  radio:
    path: playground/Pretrained_models/C-RADIOv4-SO400M
    feature: backbone
    input_size: [256, 256]  # == obs_image_size: C-RADIO 16 x 16 patches, Qwen 8 x 8 merged tokens on the same frame
    outlier_norm: 100.0     # C-RADIO's fixed top-row artifact token is masked
    prefix_tokens: summary  # SigLIP2-g + DINOv3 CLS (2 x 1152)
    trainable: true         # all of C-RADIO (patch embedder + position embedding + 27 blocks); eval mode, bf16 autocast, fp32 weights
  radio_adaln:
    enabled: true
    mode: plain             # standard AdaLN on the output vision tokens (denorm: keep each token's mean / scale)
    hidden_dim: 1024
    use_summary: true
    text_norm: true         # LayerNorm (learned affine) on the text positions
  radio_cond:
    enabled: true           # C-RADIO tokens (256 patches + 2 summary) next to the Qwen features in System 1's condition
    use_prefix: true
  action_model:
    action_model_type: DiT-B
    action_dim: 29
    state_dim: 58           # sin/cos state token
    action_horizon: 16      # RoboCasa chunk (data config action_indices = 16)
    repeated_diffusion_steps: 8
    num_inference_timesteps: 4
    num_target_vision_tokens: 0

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: playground/Datasets/PhysicalAI-Robotics-GR00T-X-Embodiment-Sim
    data_mix: fourier_gr1_unified_1000   # ego view + state at t, a[t .. t+15] absolute (min_max)
    lerobot_version: "v2.0"
    sequential_step_sampling: false
    per_device_batch_size: 32   # 32 x 4 GPUs = global 128
    load_all_data_for_training: true
    obs_image_size: [256, 256]
    delete_pause_frame: false
    video_backend: decord
    video_backend_kwargs: {num_threads: 1}
    multiprocessing_context: fork
    num_workers: 8
    preprocess_in_workers: false
    prefetch_factor: 2

trainer:
  max_train_steps: 100000
  num_warmup_steps: 1000
  save_interval: 10000
  eval_interval: 1000
  learning_rate:
    base: 1.0e-05           # qwen_vl_interface (full fine-tuning)
    radio_encoder: 1.0e-05  # C-RADIO fine-tuning (= the VLM's lr, as the radioft DualSystem ablation)
    radio_adaln: 1.0e-04
    radio_cond: 1.0e-04
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr_rate: 0.01
  freeze_modules: ""      # nothing frozen
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 0.0
