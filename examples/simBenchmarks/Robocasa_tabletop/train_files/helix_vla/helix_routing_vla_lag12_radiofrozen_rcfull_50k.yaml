# Helix_Routing_VLA (user 10-19): Helix_VLA lag12 (helix_vla_lag12_rcfull_50k.yaml, identical data / budget / System 2 /
# DiT-B) + DEPTH ROUTING of System 1's C-RADIO features. A learnable visual prompt token is appended to C-RADIO's INPUT
# only (VPT-shallow); its state after each of the 27 blocks is that layer's key (W_k LN). Each of the 8 cross-attention
# blocks of the System 1 DiT-B (16 blocks, self / cross interleaved) has its own learnable query -> softmax over the 27
# layers (per image) -> weighted sum of every layer's LayerNormed [summary ; patch] tokens -> its own LN + Linear + pos
# embedding -> that block's cross-attention condition [S2 latent ; fused C-RADIO tokens]. routing/* metrics = per-block
# routing entropy (1 = uniform) / top layer / mean depth. Only change vs Helix lag12 = the routing (paired comparison).
# Frames: [frame t-12, frame t]; sim eval ROBOCASA_VLM_PREV_FRAME=1 (as Helix lag12).
# RADIO FROZEN variant (user 10-20 after radioft = am5reg with C-RADIO trained: 31% lower in-train S1 RMSE but no sim gain,
# Close -6.7 pts): C-RADIO weights fixed (radio.trainable false, trainer.freeze_modules radio_encoder); the visual prompt
# still gets its gradient THROUGH the frozen C-RADIO blocks. Differences vs Helix lag12 = routing + frozen C-RADIO.
run_id: starvla_helix_routing_vla_lag12_radiofrozen_h16_rcfull_robocasa_gr1
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: ryk9012-gwangju-institute-of-science-and-technology
wandb_project: starVLA_robocasa
is_debug: false
version_id: "0.21"

framework:
  name: Helix_Routing_VLA
  qwenvl:
    base_vlm: Qwen/Qwen3.5-0.8B
    attn_implementation: flash_attention_2
    torch_dtype: float32    # trained -> fp32 weights; compute is bf16 autocast
    load_bf16: false
  radio:
    path: playground/Pretrained_models/C-RADIOv4-SO400M
    feature: backbone
    input_size: [256, 256]
    outlier_norm: 100.0
    prefix_tokens: summary  # SigLIP2-g + DINOv3 CLS (2 x 1152)
    trainable: false        # C-RADIO frozen (weights fixed; the routing prompt is trained through it)
  helix:
    s2_lag: 12              # System 2 frame = t - 12 (must match delta_indices_override below)
    s2_norm: true
    s1_vision: true
    use_prefix: true
  routing:
    n_prompt: 1             # VPT-shallow prompt token(s) at C-RADIO's input; key of layer l = their mean state after block l
    prompt_init: cls_mean   # mean of C-RADIO's summary CLS input tokens
    key_dim: 256
  action_model:
    action_model_type: DiT-B
    action_dim: 29
    state_dim: 58           # sin/cos state token
    action_horizon: 16
    repeated_diffusion_steps: 8
    num_inference_timesteps: 4
    num_target_vision_tokens: 0

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: playground/Datasets/PhysicalAI-Robotics-GR00T-X-Embodiment-Sim
    data_mix: fourier_gr1_unified_1000   # ego view + state at t, a[t .. t+15] absolute (min_max)
    delta_indices_override: {video.ego_view: [-12, 0]}
    lerobot_version: "v2.0"
    sequential_step_sampling: false
    per_device_batch_size: 32   # 32 x 4 GPUs = global 128
    load_all_data_for_training: true
    obs_image_size: [256, 256]
    delete_pause_frame: false
    video_backend: decord
    video_backend_kwargs: {num_threads: 1}
    multiprocessing_context: fork
    num_workers: 8
    preprocess_in_workers: false
    prefetch_factor: 2

trainer:
  max_train_steps: 50000
  num_warmup_steps: 1000
  save_interval: 10000
  eval_interval: 1000
  learning_rate:
    base: 1.0e-05           # qwen_vl_interface (full fine-tuning)
    radio_router: 1.0e-04   # visual prompt + key projection + block queries
    radio_cond: 1.0e-04     # 8 per-block LN + Linear + pos embeddings
    s2_norm: 1.0e-04
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr_rate: 0.01
  freeze_modules: radio_encoder
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 0.0
