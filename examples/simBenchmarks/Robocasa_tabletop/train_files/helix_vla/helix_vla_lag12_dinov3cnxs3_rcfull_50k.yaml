# Helix_VLA lag12 with System 1's eye = DINOv3 ConvNeXt-Small instead of C-RADIOv4-SO400M (user 10-21: "RADIO대신
# DINOv3 ConvNeXt-Small", trained, "stage3거만 쓰자"). Everything else = helix_vla_lag12_rcfull_50k.yaml (sim 45.8%):
# ConvNeXt cut after stage 3 (stride 16): 256 x 256 -> 16 x 16 = 256 tokens x 384 (stage 4 + final norm dropped, ~33M),
# no prefix tokens (C-RADIO had 2 summary tokens), ImageNet mean / std, fully trained at lr 1e-5 (as C-RADIO in lag12).
# Chain: helix_vla/run_helixrouting_rcfull.sh (YAML=<this>), fast eval + paired compares vs Helix lag12 / am5reg.
run_id: starvla_helix_vla_lag12_dinov3cnxs3_h16_rcfull_robocasa_gr1
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: ryk9012-gwangju-institute-of-science-and-technology
wandb_project: starVLA_robocasa
is_debug: false
version_id: "0.21"

framework:
  name: Helix_VLA
  qwenvl:
    base_vlm: Qwen/Qwen3.5-0.8B
    attn_implementation: flash_attention_2
    torch_dtype: float32    # trained -> fp32 weights; compute is bf16 autocast
    load_bf16: false
  radio:
    backbone: dinov3_convnext
    path: playground/Pretrained_models/dinov3-convnext-small-pretrain-lvd1689m
    stage: 3                # stages 1-3 only (stride 16) -> 16 x 16 x 384
    input_size: [256, 256]
    trainable: true         # all kept ConvNeXt stages
  helix:
    s2_lag: 12              # System 2 frame = t - 12 (must match delta_indices_override below)
    s2_norm: true
    s1_vision: true
    use_prefix: true
  action_model:
    action_model_type: DiT-B
    action_dim: 29
    state_dim: 58           # sin/cos state token
    action_horizon: 16
    repeated_diffusion_steps: 8
    num_inference_timesteps: 4
    num_target_vision_tokens: 0

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: playground/Datasets/PhysicalAI-Robotics-GR00T-X-Embodiment-Sim
    data_mix: fourier_gr1_unified_1000   # ego view + state at t, a[t .. t+15] absolute (min_max)
    delta_indices_override: {video.ego_view: [-12, 0]}
    lerobot_version: "v2.0"
    sequential_step_sampling: false
    per_device_batch_size: 32   # 32 x 4 GPUs = global 128
    load_all_data_for_training: true
    obs_image_size: [256, 256]
    delete_pause_frame: false
    video_backend: decord
    video_backend_kwargs: {num_threads: 1}
    multiprocessing_context: fork
    num_workers: 8
    preprocess_in_workers: false
    prefetch_factor: 2

trainer:
  max_train_steps: 50000
  num_warmup_steps: 1000
  save_interval: 10000
  eval_interval: 1000
  learning_rate:
    base: 1.0e-05           # qwen_vl_interface (full fine-tuning)
    radio_encoder: 1.0e-05  # DINOv3 ConvNeXt fine-tuning
    radio_cond: 1.0e-04
    s2_norm: 1.0e-04
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr_rate: 0.01
  freeze_modules: ""
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 0.0
