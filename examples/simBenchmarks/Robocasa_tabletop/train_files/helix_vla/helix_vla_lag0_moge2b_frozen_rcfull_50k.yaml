# Helix_VLA lag0 (SYNCHRONOUS) with System 1's eye = MoGe-2 ViT-B ENCODER, FROZEN (user 10-22: "DINOv3대신에 Moge-3-vitl"
# -> "Moge-2-base모델로 하자"; MoGe summed-projection features, frozen, lag0, implement only). = helix_vla_lag0_dinov3cnxs3_rcfull_50k.yaml
# (sim 47.9%) with radio.backbone moge: Ruicheng/moge-2-vitb-normal encoder = DINOv2 ViT-B/14 fine-tuned for geometry, layers
# 5 / 11 final-LN'ed -> 1x1 proj (768) -> sum; 256 x 256 frame -> 224 inside -> 16 x 16 = 256 tokens x 768 + 1 CLS prefix
# (MoGeEncoderBackbone, CPU parity vs MoGe code rel 4e-7); 86.6M + 1.2M FROZEN (trainer.freeze_modules radio_encoder, no lr).
# Chain: helix_vla/run_helix_variant2_rcfull.sh (YAML=<this>), fast eval + paired compares.
run_id: starvla_helix_vla_lag0_moge2b_frozen_h16_rcfull_robocasa_gr1
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: ryk9012-gwangju-institute-of-science-and-technology
wandb_project: starVLA_robocasa
is_debug: false
version_id: "0.21"

framework:
  name: Helix_VLA
  qwenvl:
    base_vlm: Qwen/Qwen3.5-0.8B
    attn_implementation: flash_attention_2
    torch_dtype: float32    # trained -> fp32 weights; compute is bf16 autocast
    load_bf16: false
  radio:
    backbone: moge
    path: playground/Pretrained_models/moge-2-vitb-normal/model.pt
    input_size: [256, 256]
    grid: [16, 16]          # 224 x 224 into the ViT/14 -> 256 tokens x 768 (+ 1 CLS prefix)
    trainable: false        # FROZEN MoGe encoder (backbone + output projections)
  helix:
    s2_lag: 0               # SYNCHRONOUS control: System 2 also on frame t
    s2_norm: true
    s1_vision: true
    use_prefix: true
  action_model:
    action_model_type: DiT-B
    action_dim: 29
    state_dim: 58           # sin/cos state token
    action_horizon: 16
    repeated_diffusion_steps: 8
    num_inference_timesteps: 4
    num_target_vision_tokens: 0

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: playground/Datasets/PhysicalAI-Robotics-GR00T-X-Embodiment-Sim
    data_mix: fourier_gr1_unified_1000   # ego view + state at t, a[t .. t+15] absolute (min_max)
    lerobot_version: "v2.0"
    sequential_step_sampling: false
    per_device_batch_size: 32   # 32 x 4 GPUs = global 128
    load_all_data_for_training: true
    obs_image_size: [256, 256]
    delete_pause_frame: false
    video_backend: decord
    video_backend_kwargs: {num_threads: 1}
    multiprocessing_context: fork
    num_workers: 8
    preprocess_in_workers: false
    prefetch_factor: 2

trainer:
  max_train_steps: 50000
  num_warmup_steps: 1000
  save_interval: 10000
  eval_interval: 1000
  learning_rate:
    base: 1.0e-05           # qwen_vl_interface (full fine-tuning)
    radio_cond: 1.0e-04
    s2_norm: 1.0e-04
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr_rate: 0.01
  freeze_modules: radio_encoder   # frozen MoGe encoder
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 0.0
