# Helix_VLA (user 10-19): the basic System 2 / System 1 VLA. System 2 = Qwen3.5-0.8B (ViT + LM fully fine-tuned) on the
# STALE frame t - 12 (0.6 s = one executed 12-step sim chunk: at deployment S2 works on the previous call's frame) ->
# LM last hidden states of all prompt tokens -> LayerNorm = latent tokens. System 1 = its own eye C-RADIOv4-SO400M
# (fine-tuned, radio.trainable) on the CURRENT frame t (256 patches + 2 summary tokens -> 1024) + state token + GR00T
# flow-matching DiT-B (the only DiT), cross-attention to [S2 latent ; S1 C-RADIO tokens] -> a[t .. t+15] absolute.
# Data / budget as the am5reg DualSystem (sim 49.8% at 100k) but 50k steps: full RoboCasa GR1 set, min_max, 256 x 256,
# global batch 128, lr 1e-5 Qwen + C-RADIO / 1e-4 new modules, cosine to 1%.
# Frames: delta_indices_override video [-12, 0] -> example image = [frame t-12, frame t] (clamped at episode start);
# sim eval: ROBOCASA_VLM_PREV_FRAME=1 (client sends [previous call's frame, frame t]).
# SYNCHRONOUS CONTROL: s2_lag 0, both systems on frame t (no delta_indices_override; sim eval without ROBOCASA_VLM_PREV_FRAME).
run_id: starvla_helix_vla_lag0_h16_rcfull_robocasa_gr1
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: ryk9012-gwangju-institute-of-science-and-technology
wandb_project: starVLA_robocasa
is_debug: false
version_id: "0.21"

framework:
  name: Helix_VLA
  qwenvl:
    base_vlm: Qwen/Qwen3.5-0.8B
    attn_implementation: flash_attention_2
    torch_dtype: float32    # trained -> fp32 weights; compute is bf16 autocast
    load_bf16: false
  radio:
    path: playground/Pretrained_models/C-RADIOv4-SO400M
    feature: backbone
    input_size: [256, 256]
    outlier_norm: 100.0
    prefix_tokens: summary  # SigLIP2-g + DINOv3 CLS (2 x 1152)
    trainable: true         # all of C-RADIO (patch embedder + position embedding + 27 blocks)
  helix:
    s2_lag: 0               # SYNCHRONOUS control: System 2 also on frame t
    s2_norm: true
    s1_vision: true
    use_prefix: true
  action_model:
    action_model_type: DiT-B
    action_dim: 29
    state_dim: 58           # sin/cos state token
    action_horizon: 16
    repeated_diffusion_steps: 8
    num_inference_timesteps: 4
    num_target_vision_tokens: 0

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: playground/Datasets/PhysicalAI-Robotics-GR00T-X-Embodiment-Sim
    data_mix: fourier_gr1_unified_1000   # ego view + state at t, a[t .. t+15] absolute (min_max)
    lerobot_version: "v2.0"
    sequential_step_sampling: false
    per_device_batch_size: 32   # 32 x 4 GPUs = global 128
    load_all_data_for_training: true
    obs_image_size: [256, 256]
    delete_pause_frame: false
    video_backend: decord
    video_backend_kwargs: {num_threads: 1}
    multiprocessing_context: fork
    num_workers: 8
    preprocess_in_workers: false
    prefetch_factor: 2

trainer:
  max_train_steps: 50000
  num_warmup_steps: 1000
  save_interval: 10000
  eval_interval: 1000
  learning_rate:
    base: 1.0e-05           # qwen_vl_interface (full fine-tuning)
    radio_encoder: 1.0e-05  # C-RADIO fine-tuning
    radio_cond: 1.0e-04
    s2_norm: 1.0e-04
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr_rate: 0.01
  freeze_modules: ""
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 0.0
