# QwenGR00T_TriSystem on RoboCasa-100 (10%: first 100 of the 1000 demos per task, 24 GR1 tabletop tasks, ~602k frames),
# stage 1: System 1.5 pretraining (latent-change world model, p(dZ | Z_t, S_t)).
#   ego view t + instruction -> Qwen3.5-0.8B -> S_t (last hidden states of all vision + text tokens)
#   ego view t -> C-RADIOv4 (256x256, native res) -> Z_t [16x16 = 256, 1152]; dZ = Z(t+16) - Z(t), 0.8 s = one chunk
# Only system15 trains. Same data / batch (32 x 4 = 128) / action space as the rc100 50k baselines
# (starvla_qwen35_gr00t_rc100_50k_dit_v2_robocasa.yaml), except Qwen is frozen here and sees 256x256 (baselines: 224).
# Before the first run:  python starVLA/training/trisystem_prepare_stats.py --config_yaml <this yaml> --num_samples 4096
# Next: stage2_system1_rc100.yaml (action expert, GT dZ), stage3_joint_rc100.yaml (joint fine-tuning).
# Launch: bash examples/simBenchmarks/launch_regressor_sim_local.sh <this yaml> 4,5,6,7 <port>
run_id: starvla_trisystem_s1p5_rc100_robocasa_gr1
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: ryk9012-gwangju-institute-of-science-and-technology
wandb_project: starVLA_robocasa
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T_TriSystem
  qwenvl:   # System 2, used unmodified
    base_vlm: Qwen/Qwen3.5-0.8B
    attn_implementation: flash_attention_2
    torch_dtype: bfloat16   # frozen; use float32 if Qwen is fine-tuned (ZeRO-0 keeps no fp32 master copy)
  radio:
    path: playground/Pretrained_models/C-RADIOv4-SO400M
    feature: backbone
    input_size: [256, 256]  # (H, W) -> 16 x 16 = 256 patch tokens (= the native ego-view resolution)
    teacher_ckpt: playground/Pretrained_models/C-RADIOv4-SO400M_pth/c-radio_v4-so400m_half.pth.tar
    outlier_norm: 100.0     # C-RADIO's fixed top-row artifact token (1 of 256) is masked
    stats_path: playground/Pretrained_models/C-RADIOv4-SO400M/trisystem_stats_rc100_256x256_f16.pt
  tri_system:
    frame_size: [256, 256]  # (H, W) loader frames (System 2 input); == obs_image_size [W, H]
    future_offsets: [16]    # == data config video delta_indices[1:] (fourier_gr1_arms_waist_future16)
    loss_weights: {system15: 1.0, system1: 0.0}
    eval: {num_samples: 8, system15_steps: 4, system1_steps: 4, seed: 0}
  system15:                 # Flow Transformer: self-attn over X_tau, cross-attn to Z_t and to S_t, adaLN(tau)
    target: delta
    d_model: 768
    depth: 12
    num_heads: 12
    tau_schedule: {schedule: uniform}
    num_noise_samples: 2
    s2_drop_prob: 0.0       # no S_t dropout (CFG off); > 0 only together with cfg_scale > 1
    sample_steps: 4         # Euler ODE steps at inference
    sample_method: euler
    grad_ckpt: false
  system1:                  # Action DiT: self-attn over [state, A_tau], cross-attn to dZ, adaLN(tau_a)
    d_model: 768
    depth: 12
    num_heads: 12
    cond_streams: [dz]      # predicted change only (S_t / Z_t not given to System 1)
    cond_mode: separate
    tau_schedule: {schedule: beta, beta_a: 1.5, beta_b: 1.0, beta_s: 0.999}
    num_noise_samples: 4
    sample_steps: 4         # Euler ODE steps at inference
    delta_source: gt
  action_model:             # action / state layout (QwenGR00T keys, as the rc100 baselines)
    action_dim: 29
    state_dim: 58           # sin/cos state
    action_horizon: 16      # 0.8 s at 20 Hz, = the dZ horizon

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: playground/Datasets/PhysicalAI-Robotics-GR00T-X-Embodiment-Sim
    data_mix: fourier_gr1_unified_1000_future16   # [ego t, ego t+16] + state + 16-step chunk
    # RoboCasa-100: keep only the FIRST 100 episodes of each task (1/10 of the mix); full-dataset normalization stats
    max_episodes_per_dataset: 100
    lerobot_version: "v2.0"
    # rel targets on arms + waist (a[t+i] - q[t]), hands absolute — identical to the rc100 baselines.
    # Eval must mirror this: ROBOCASA_ACTION_MODE=rel ROBOCASA_ACTION_MODE_KEYS=left_arm,right_arm,waist
    action_mode: rel
    action_mode_apply_keys: [left_arm, right_arm, waist]
    sequential_step_sampling: false
    per_device_batch_size: 32   # 32 x 4 GPUs = global 128
    load_all_data_for_training: true
    obs_image_size: [256, 256]
    delete_pause_frame: false
    video_backend: decord
    video_backend_kwargs: {num_threads: 1}
    multiprocessing_context: fork
    num_workers: 8
    prefetch_factor: 2
  val_data:   # held-out demos 900-999 of each task (disjoint from the first-100 training subset), eval hook only
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: playground/Datasets/PhysicalAI-Robotics-GR00T-X-Embodiment-Sim
    data_mix: fourier_gr1_unified_1000_future16
    skip_first_episodes: 900
    max_episodes_per_dataset: 100
    lerobot_version: "v2.0"
    action_mode: rel
    action_mode_apply_keys: [left_arm, right_arm, waist]
    obs_image_size: [256, 256]
    video_backend: decord
    video_backend_kwargs: {num_threads: 1}

trainer:
  max_train_steps: 30000
  num_warmup_steps: 1000
  save_interval: 10000
  eval_interval: 1000
  learning_rate:
    base: 1.0e-05
    system15: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr_rate: 0.01
  freeze_modules: qwen_vl_interface,radio_encoder,system1
  max_grad_norm: 1.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 0.0
