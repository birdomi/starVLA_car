# Full-data twin of starvla_qwen35_2b_gr00t_rc100_50k_dit_v2_robocasa.yaml: identical recipe (Qwen3.5-2B + GR00T DiT-B, rel arm/waist targets,
# 224 x 224, global batch 128, 50k steps), only max_episodes_per_dataset is dropped -> all 1000 episodes of each of
# the 24 GR1 tasks (~6.02M frames; 128 x 50k = 6.4M samples ~ 1.06 epochs, vs ~10.6 on rc100).
# Hangang: hangang/train_eval_rc100.sbatch <this yaml> (train -> sim eval in one job).
run_id: starvla_qwen35_2b_dit_rcfull_50k_b128_robocasa_gr1_v2
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: ryk9012-gwangju-institute-of-science-and-technology
wandb_project: starVLA_robocasa
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T
  qwenvl:
    base_vlm: playground/Pretrained_models/Qwen3.5-2B
    # fla Triton kernels recompile per sequence length -> pad prompts to a multiple of 64
    pad_to_multiple_of: 64
    attn_implementation: flash_attention_2
    # ZeRO-0 (needed by Muon) keeps no fp32 master copy, so the trained VLM
    # must hold fp32 weights; compute stays bf16 via autocast.
    torch_dtype: float32
    load_bf16: false
  action_model:
    action_dim: 29
    state_dim: 58
    action_horizon: 16   # matches the benchmark DataConfig (action_indices = 16)
    # flow-matching knobs (noise schedule, timestep buckets, inference steps) use the QwenGR00T
    # defaults, exactly like the H1-2 car yaml.
    # future token(GR00T 학습형 query 토큰) 0개: 기본값 32 대신 Grid 계열(ActionMap/Keyframe)과 동일하게 맞춤.
    # v1 베이스라인(run_id ..._gr1, 32개)과의 차이는 이 한 줄뿐.
    num_target_vision_tokens: 0

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: playground/Datasets/PhysicalAI-Robotics-GR00T-X-Embodiment-Sim
    data_mix: fourier_gr1_unified_1000
    # full data: no max_episodes_per_dataset (all 1000 episodes per task)
    lerobot_version: "v2.0"
    # RELATIVE joint targets: the loader emits a[t+i] - q[t] for every horizon step (datasets.py, mode "rel"),
    # so the head predicts displacements from the CURRENT joint position instead of absolute targets.
    # Restricted to arms + waist: for those keys state and action live in the same space (joint targets,
    # ~0.05 rad lag). The 6-finger hand ACTION is a [-3, 3] command while the hand STATE is a [0, 1.86]
    # finger angle, so "action - state" would be meaningless there -> hands stay ABSOLUTE.
    # Eval must mirror this: ROBOCASA_ACTION_MODE=rel ROBOCASA_ACTION_MODE_KEYS=left_arm,right_arm,waist
    action_mode: rel
    action_mode_apply_keys: [left_arm, right_arm, waist]
    sequential_step_sampling: false
    # 32 x 4 GPUs = global batch 128 (grad_accum 1)
    per_device_batch_size: 32
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    delete_pause_frame: false
    video_backend: torchvision_av   # decord has no aarch64 build (Hangang GH200)
    video_backend_kwargs: {num_threads: 1}
    multiprocessing_context: fork
    num_workers: 8
    preprocess_in_workers: false   # QwenGR00T.forward does not accept pre-collated qwen_inputs (only the Regressor does)
    prefetch_factor: 2

trainer:
  # AdamW for EVERYTHING (no Muon) + cosine-with-min-lr, global batch 128, 50k steps.
  # 128 x 50k = 6.4M samples over the ~6.02M-frame full set -> ~1.06 epochs.
  max_train_steps: 50000
  num_warmup_steps: 500
  save_interval: 10000
  eval_interval: 500
  learning_rate:
    base: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-05
