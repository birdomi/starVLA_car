# QwenGR00T_DualSystem on the FULL RoboCasa GR1 set, ONE-STAGE joint training with the VLM 0.6 s behind (stale_input
# vlm, as joint_system12_plancond_vlm12_rcfull_50k.yaml) AND System 2 planning PER-STEP DELTAS (dual_system.delta_plan):
#   arms + waist: d[0] = a[t] - s[t], d[k] = a[t+k] - a[t+k-1] (k > 0), d[k] = a[t+k] - a[t+k+1] (k < 0) at 20 Hz over the
#   -2 .. +4 s window, z-normalised (anchor / step mean, std of the full set: s2_delta_stats_rcfull.json, s2_delta_stats.py;
#   std floor 0.005 rad), clipped at +-60 (never reached: max 55.5); s[t] = atan2 of the loader's sin / cos state. Hands stay absolute (their command [-3, 3] is not the
#   finger-angle state, and a one-step open / close jump would vanish between 0.1 s keyframes).
#   System 1 takes System 2's delta plan AS-IS (its GT plan in the eval hook too) and predicts the RESIDUAL of that plan
#   (dual_system.s1_residual): target (a - A_sys2) * 4 on a[t .. t+15], A_sys2 = the delta plan integrated to absolute
#   (abs min_max normalised) at the System 1 steps; output A_sys2 + residual / 4 = ABSOLUTE actions (the policy server's
#   normalisation: no eval-client change for the actions). x4: the plan error on the System 1 window falls from ~0.32
#   to ~0.08 (abs-normalised RMS, joint_system12_plancond_rcfull_50k eval hook 1k -> 50k).
#   The eval hook's system2/* RMSE integrates the plan back to absolute units (comparable with the abs runs).
#   Representation floor on GT data (256 samples, arms + waist, abs-normalised RMSE on a[t .. t+15] / future 4 s):
#   abs keyframes 0.012 / 0.012; delta keyframes point-sampled 0.074 / 0.178; least-squares delta keyframes (what the
#   dense loss fits) 0.023 / 0.024 (scratchpad delta_repr_err.py, 10-14).
#   Otherwise identical to joint_system12_plancond_vlm12_rcfull_50k.yaml.
# Chain: dual_system/run_dualsystem_joint_vlm12_rcfull.sh with JOINT_YAML=<this> (sim eval with the VLM lag).
run_id: starvla_dualsystem_joint_plancond_vlm12_s2delta_s1res_h16_rcfull_robocasa_gr1
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: ryk9012-gwangju-institute-of-science-and-technology
wandb_project: starVLA_robocasa
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T_DualSystem
  qwenvl:
    base_vlm: Qwen/Qwen3.5-0.8B
    attn_implementation: flash_attention_2
    torch_dtype: float32    # trained -> fp32 weights (ZeRO-0 keeps no fp32 master copy); compute is bf16 autocast
    load_bf16: false
  radio:
    path: playground/Pretrained_models/C-RADIOv4-SO400M   # smallest released C-RADIOv4 (H / SO400M / 1D-H only)
    feature: backbone
    input_size: [256, 256]
    outlier_norm: 100.0     # C-RADIO's fixed top-row artifact token (1 of 256) is masked
    prefix_tokens: summary  # SigLIP2-g + DINOv3 CLS (RADIO's 2304-d summary, 2 x 1152 tokens) -> both systems
  dual_system:
    action_rate_hz: 20.0
    keyframes: {t_min: -2.0, t_max: 4.0, dt: 0.1}   # 61 keyframes: 20 past / 1 current / 40 future
    s1_horizon_s: 0.8       # 16 actions (0.8 s chunk)
    video_offsets: [-12, 0] # == data config video delta_indices (fourier_gr1_arms_waist_dual_vlm12): VLM frame, current frame
    stale_input: vlm        # Qwen tokens of frame t - 12; C-RADIO / state / System 1 at t
    s1_offset_probs: [1.0, 0.0]   # always the 0.6 s old VLM frame (frame t only where t - 12 lies before the episode)
    frame_size: [256, 256]  # == obs_image_size
    train_systems: [system2, system1]
    loss_weights: {system2: 1.0, system1: 1.0}
    mask_out_of_episode: true
    delta_plan:             # System 2 plans per-step deltas of arms + waist (hands absolute); System 1 absolute
      stats_path: examples/simBenchmarks/Robocasa_tabletop/train_files/dual_system/s2_delta_stats_rcfull.json
      # [action_start, action_end, sin_start, cos_start]: left_arm a[0:7] / sin 0, cos 7; right_arm a[7:14] / 14, 21;
      # waist a[26:29] / 52, 55 (loader state = per key [sin, cos], keys left_arm, right_arm, left_hand, right_hand, waist)
      ref: [[0, 7, 0, 7], [7, 14, 14, 21], [26, 29, 52, 55]]
      clip: 60.0            # z bound: with min_std the full set's largest |z| is 55.5 (a right-arm step) -> exact
      min_std: 0.005        # waist step std is 0.002-0.008 rad: floor (its rare jumps reached 139 sigma, now < 48)
    s1_residual: {scale: 4.0}   # System 1 target (a - A_sys2) * 4, output A_sys2 + prediction / 4
    eval: {num_samples: 64, seed: 0}
  system2:
    use_radio_prefix: true # C-RADIO summary tokens (SigLIP2-g / DINOv3 CLS = 2304-d summary) in s2_context
    d_model: 768
    depth: 12
    num_heads: 12
    use_state: true
    vlm_age_embed: false    # no age MLP on the VLM tokens (the lag is fixed at 0.6 s; 0 only within the first 12 frames)
    num_noise_samples: 4    # noise draws per sample per step (the DiT is cheap next to the VLM)
    diffusion: {type: flow_matching, beta_alpha: 1.5, beta_beta: 1.0, noise_s: 0.999, num_timestep_buckets: 1000, sample_steps: 4}  # GR00T
    interpolation: {default_mode: linear, groups: [], strict: true}   # GR1 arms / hands / waist are all continuous
  system1:
    use_radio_prefix: true # current frame's C-RADIO summary tokens in the cross-attention context
    d_model: 768           # same size as the System 2 DiT / the GR00T action head
    depth: 12
    num_heads: 12
    use_state: true         # state at frame t (the System 1 frame) as one token
    plan_input: condition   # trajectory tokens in the cross-attention memory (not the sequence)
    state_input: condition  # state token stays in the cross-attention memory
    num_noise_samples: 4
    diffusion: {type: flow_matching, beta_alpha: 1.5, beta_beta: 1.0, noise_s: 0.999, num_timestep_buckets: 1000, sample_steps: 4}  # GR00T
    traj_source: pred       # System 2's own sampled plan (no_grad), exactly what System 1 sees at test time
    traj_pred_steps: 4      # Euler steps of System 2's plan (= inference)
  action_model:             # action / state layout (QwenGR00T keys)
    action_dim: 29
    state_dim: 58           # sin/cos state
    action_horizon: 16      # = System 1 horizon (the policy server's chunk length)

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    emit_action_valid: true # action_valid / frame_valid masks (padded slots outside the episode)
    data_root_dir: playground/Datasets/PhysicalAI-Robotics-GR00T-X-Embodiment-Sim
    data_mix: fourier_gr1_unified_1000_dual_vlm12   # ego / state at t + {-12, 0} + a[t-40 .. t+80]
    lerobot_version: "v2.0"
    sequential_step_sampling: false
    per_device_batch_size: 32   # 32 x 4 GPUs = global 128
    load_all_data_for_training: true
    obs_image_size: [256, 256]
    delete_pause_frame: false
    video_backend: decord
    video_backend_kwargs: {num_threads: 1}
    multiprocessing_context: fork
    num_workers: 8
    prefetch_factor: 2
  val_data:   # demos 900-999 of each task (INSIDE the training set here), eval hook only
    dataset_py: lerobot_datasets
    include_state: true
    emit_action_valid: true
    data_root_dir: playground/Datasets/PhysicalAI-Robotics-GR00T-X-Embodiment-Sim
    data_mix: fourier_gr1_unified_1000_dual_vlm12
    skip_first_episodes: 900
    max_episodes_per_dataset: 100
    lerobot_version: "v2.0"
    obs_image_size: [256, 256]
    video_backend: decord
    video_backend_kwargs: {num_threads: 1}

trainer:
  max_train_steps: 50000
  num_warmup_steps: 1000
  save_interval: 10000
  eval_interval: 1000
  learning_rate:
    base: 1.0e-05           # qwen_vl_interface (full fine-tuning)
    system2: 1.0e-04
    system1: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr_rate: 0.01
  freeze_modules: radio_encoder
  max_grad_norm: 1.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 0.0
