# QwenGR00T_DualSystem on RoboCasa-100, stage 2: System 1 (fast 1 s flow-matching action policy), starting from the stage-1 model.
#   System 2 (Qwen + keyframe DiT) frozen: its SAMPLED 61-keyframe plan of frame t (traj_source: pred, 4 Euler steps,
#   as at test time) -> TrajectoryTokenizer -> 61 trajectory tokens (past / current / future types)
#   System 1 frame = t + o, o in video_offsets {0, 4, 8, 12, 16} frames -> plan age 0 .. 0.8 s; temporal RoPE uses
#   timestamps relative to t + o (trajectory token i at t_i - o / 20 s, action token k at k / 20 s)
#   X = [20 noisy action tokens, 61 trajectory tokens], full self-attention, cross-attention to C-RADIO(frame t + o)
#   2 summary + 256 patch tokens + the state token of frame t + o (data config state delta_indices == video_offsets)
#   loss = GR00T flow-matching velocity MSE on a[t + o .. t + o + 19]
# Trains system1 only (tokenizer, radio_projector_s1, DiT). Launch:
#   bash examples/simBenchmarks/launch_regressor_sim_local.sh <this yaml> 4,5,6,7 <port>
run_id: starvla_dualsystem_s1_rc100_robocasa_gr1
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: ryk9012-gwangju-institute-of-science-and-technology
wandb_project: starVLA_robocasa
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T_DualSystem
  qwenvl:
    base_vlm: Qwen/Qwen3.5-0.8B
    attn_implementation: flash_attention_2
    torch_dtype: bfloat16   # frozen in this stage (the stage-1 fp32 weights are cast on load)
  radio:
    path: playground/Pretrained_models/C-RADIOv4-SO400M
    feature: backbone
    input_size: [256, 256]
    outlier_norm: 100.0
    prefix_tokens: summary  # must match stage 1
  dual_system:
    action_rate_hz: 20.0
    keyframes: {t_min: -2.0, t_max: 4.0, dt: 0.1}
    s1_horizon_s: 1.0
    video_offsets: [0, 4, 8, 12, 16]   # == data config video delta_indices (fourier_gr1_arms_waist_dual)
    frame_size: [256, 256]
    train_systems: [system1]
    loss_weights: {system2: 1.0, system1: 1.0}
    mask_out_of_episode: true
    eval: {num_samples: 64, seed: 0}
  system2:                  # must match stage 1
    use_radio_prefix: true
    d_model: 768
    depth: 12
    num_heads: 12
    use_state: true
    diffusion: {type: flow_matching, beta_alpha: 1.5, beta_beta: 1.0, noise_s: 0.999, num_timestep_buckets: 1000, sample_steps: 4}  # GR00T
    interpolation: {default_mode: linear, groups: [], strict: true}
  system1:
    use_radio_prefix: true # current frame's C-RADIO summary tokens in the cross-attention context
    d_model: 768           # same size as the System 2 DiT / the GR00T action head
    depth: 12
    num_heads: 12
    use_state: true         # state at the System 1 frame (t + o) as a cross-attention token
    num_noise_samples: 4
    diffusion: {type: flow_matching, beta_alpha: 1.5, beta_beta: 1.0, noise_s: 0.999, num_timestep_buckets: 1000, sample_steps: 4}  # GR00T
    traj_source: pred       # System 2's own sampled plan (no_grad), exactly what System 1 sees at test time
    traj_pred_steps: 4      # Euler steps of System 2's plan (= inference)
  action_model:
    action_dim: 29
    state_dim: 58
    action_horizon: 20

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    emit_action_valid: true
    data_root_dir: playground/Datasets/PhysicalAI-Robotics-GR00T-X-Embodiment-Sim
    data_mix: fourier_gr1_unified_1000_dual     # ego / state at t + {0, 4, 8, 12, 16} + a[t-40 .. t+80]
    max_episodes_per_dataset: 100
    lerobot_version: "v2.0"
    sequential_step_sampling: false
    per_device_batch_size: 32
    load_all_data_for_training: true
    obs_image_size: [256, 256]
    delete_pause_frame: false
    video_backend: decord
    video_backend_kwargs: {num_threads: 1}
    multiprocessing_context: fork
    num_workers: 8
    prefetch_factor: 2
  val_data:
    dataset_py: lerobot_datasets
    include_state: true
    emit_action_valid: true
    data_root_dir: playground/Datasets/PhysicalAI-Robotics-GR00T-X-Embodiment-Sim
    data_mix: fourier_gr1_unified_1000_dual
    skip_first_episodes: 900
    max_episodes_per_dataset: 100
    lerobot_version: "v2.0"
    obs_image_size: [256, 256]
    video_backend: decord
    video_backend_kwargs: {num_threads: 1}

trainer:
  pretrained_checkpoint: playground/Checkpoints/starvla_dualsystem_s2_rc100_robocasa_gr1/checkpoints/steps_30000_pytorch_model.pt
  max_train_steps: 20000
  num_warmup_steps: 500
  save_interval: 10000
  eval_interval: 1000
  learning_rate:
    base: 1.0e-04
    system1: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr_rate: 0.01
  freeze_modules: qwen_vl_interface,radio_encoder,system2
  max_grad_norm: 1.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 0.0
