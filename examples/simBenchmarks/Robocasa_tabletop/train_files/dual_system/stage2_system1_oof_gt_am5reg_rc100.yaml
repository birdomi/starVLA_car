# Out-of-fold (OOF) System 1 study on RoboCasa (2026-10-17). System 2 = stage1_system2_rc100 30k (trained on demos 0-99
# of each task), FROZEN. System 1 trained from scratch on demos 100-899 (never seen by System 2), so with
# traj_source: pred it sees System 2's real held-out plan errors (keyframe RMSE ~0.15 vs 0.03 on its training demos);
# traj_source: gt gives the same demos with perfect GT keyframes (the in-fold / copier regime). Val = demos 900-999
# (held out of both systems). 2 x 2 grid: plan source {pred, gt} x System 1 {flow (plan + state as conditions),
# am5reg (ActionMap 5 columns, direct regression, as in joint_system12_plancond_kf025_am5reg_rcfull_100k)}.
# Plan age 0 (video_offsets [0], = the synchronous sim eval), 1 s chunk (20 actions, = the rc100 baselines).
#   VARIANT: gt_am5reg
run_id: starvla_dualsystem_s1oof_gt_am5reg_rc100_robocasa_gr1
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: ryk9012-gwangju-institute-of-science-and-technology
wandb_project: starVLA_robocasa
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T_DualSystem
  qwenvl:
    base_vlm: Qwen/Qwen3.5-0.8B
    attn_implementation: flash_attention_2
    torch_dtype: bfloat16   # frozen in this stage
  radio:
    path: playground/Pretrained_models/C-RADIOv4-SO400M
    feature: backbone
    input_size: [256, 256]
    outlier_norm: 100.0
    prefix_tokens: summary  # must match stage 1
  dual_system:
    action_rate_hz: 20.0
    keyframes: {t_min: -2.0, t_max: 4.0, dt: 0.1}   # must match stage 1 (61 keyframes)
    s1_horizon_s: 1.0
    video_offsets: [0]      # == data config fourier_gr1_arms_waist_dual_s2 (plan age 0)
    frame_size: [256, 256]
    train_systems: [system1]
    loss_weights: {system2: 1.0, system1: 1.0}
    mask_out_of_episode: true
    eval: {num_samples: 64, seed: 0}
  system2:                  # must match stage 1
    use_radio_prefix: true
    d_model: 768
    depth: 12
    num_heads: 12
    use_state: true
    diffusion: {type: flow_matching, beta_alpha: 1.5, beta_beta: 1.0, noise_s: 0.999, num_timestep_buckets: 1000, sample_steps: 4}
    interpolation: {default_mode: linear, groups: [], strict: true}
  system1:
    use_radio_prefix: true
    d_model: 768
    depth: 12
    num_heads: 12
    use_state: true
    plan_input: condition
    state_input: condition
    action_map:             # ActionMap System 1: 20 steps x 5 columns (L_arm, R_arm, L_hand, R_hand, waist)
      groups: ["0:7", "7:14", "14:20", "20:26", "26:29"]
      names: [L_arm, R_arm, L_hand, R_hand, waist]
      plan_grid: false
    num_noise_samples: 1    # regression: deterministic input, one draw
    diffusion: {type: regression}
    traj_source: gt
    traj_pred_steps: 4      # Euler steps of System 2's plan (= inference)
  action_model:
    action_dim: 29
    state_dim: 58
    action_horizon: 20

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    emit_action_valid: true
    data_root_dir: playground/Datasets/PhysicalAI-Robotics-GR00T-X-Embodiment-Sim
    data_mix: fourier_gr1_unified_1000_dual_s2
    skip_first_episodes: 100          # demos 100-899: out of System 2's training fold
    max_episodes_per_dataset: 800
    lerobot_version: "v2.0"
    sequential_step_sampling: false
    per_device_batch_size: 64         # 1 GPU per variant
    load_all_data_for_training: true
    obs_image_size: [256, 256]
    delete_pause_frame: false
    video_backend: decord
    video_backend_kwargs: {num_threads: 1}
    multiprocessing_context: fork
    num_workers: 5                    # 4 variants share CPUs 40-63 next to the GPU 4-7 run
    prefetch_factor: 2
  val_data:                           # demos 900-999: held out of both systems
    dataset_py: lerobot_datasets
    include_state: true
    emit_action_valid: true
    data_root_dir: playground/Datasets/PhysicalAI-Robotics-GR00T-X-Embodiment-Sim
    data_mix: fourier_gr1_unified_1000_dual_s2
    skip_first_episodes: 900
    max_episodes_per_dataset: 100
    lerobot_version: "v2.0"
    obs_image_size: [256, 256]
    video_backend: decord
    video_backend_kwargs: {num_threads: 1}

trainer:
  pretrained_checkpoint: playground/Checkpoints/starvla_dualsystem_s2_rc100_robocasa_gr1/checkpoints/steps_30000_pytorch_model.pt
  reload_modules: qwen_vl_interface,radio_encoder,system2   # System 1 from scratch
  max_train_steps: 15000
  num_warmup_steps: 500
  save_interval: 5000
  eval_interval: 2500
  learning_rate:
    base: 1.0e-04
    system1: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr_rate: 0.01
  freeze_modules: qwen_vl_interface,radio_encoder,system2
  max_grad_norm: 1.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 0.0
