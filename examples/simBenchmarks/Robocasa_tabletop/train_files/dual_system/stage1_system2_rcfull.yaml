# = stage1_system2_rc100.yaml on the FULL RoboCasa GR1 set (all 1000 demos of each of the 24 tasks, 6.0M frames),
#   40k steps x b128 (~0.85 epoch; + 10k of stage 2 = 50k total). Episodes 900-999 are now TRAINING data: the val_data eval hook measures fit, not
#   generalization (sim eval is the only held-out test). Next: stage2_system1_plancond_rcfull.yaml.
# QwenGR00T_DualSystem on RoboCasa-100 (first 100 of the 1000 demos per task, 24 GR1 tabletop tasks, 20 Hz),
# stage 1: System 2 (long-horizon keyframe planner).
#   ego view t + instruction -> Qwen3.5-0.8B (FULLY trainable, fp32 weights / bf16 autocast) -> last hidden states
#   ego view t -> frozen C-RADIOv4-SO400M (256x256 -> 2 summary + 16x16 = 256 patch tokens), shared with System 1
#   s2_context = concat([vlm_projector(Qwen), radio_prefix_projector_s2(summary), radio_projector_s2(patches),
#                        state_projector(state)], token dim)
#   keyframe DiT (GR00T-style flow matching) -> 61 keyframes on [-2.0, +4.0] s (0.1 s) around t
#   loss = GR00T velocity MSE taken on the dense trajectory: MSE(interp(v_hat), dense GT - interp(eps)) at the 121 dense
#   20 Hz timestamps (no keyframe-level loss)
# Only qwen_vl_interface + system2 train. Actions are ABSOLUTE (min_max, full-dataset stats): the plan covers the past
# 2 s and the next 4 s in one frame of reference, and a stale plan stays valid while the robot moves.
# Next: stage2_system1_rc100.yaml.
# Launch: bash examples/simBenchmarks/launch_regressor_sim_local.sh <this yaml> 4,5,6,7 <port>
run_id: starvla_dualsystem_s2_rcfull_robocasa_gr1
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: ryk9012-gwangju-institute-of-science-and-technology
wandb_project: starVLA_robocasa
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T_DualSystem
  qwenvl:
    base_vlm: Qwen/Qwen3.5-0.8B
    attn_implementation: flash_attention_2
    torch_dtype: float32    # trained -> fp32 weights (ZeRO-0 keeps no fp32 master copy); compute is bf16 autocast
    load_bf16: false
  radio:
    path: playground/Pretrained_models/C-RADIOv4-SO400M   # smallest released C-RADIOv4 (H / SO400M / 1D-H only)
    feature: backbone
    input_size: [256, 256]
    outlier_norm: 100.0     # C-RADIO's fixed top-row artifact token (1 of 256) is masked
    prefix_tokens: summary  # SigLIP2-g + DINOv3 CLS (RADIO's 2304-d summary, 2 x 1152 tokens) -> both systems
  dual_system:
    action_rate_hz: 20.0
    keyframes: {t_min: -2.0, t_max: 4.0, dt: 0.1}   # 61 keyframes: 20 past / 1 current / 40 future
    s1_horizon_s: 0.8       # 16 actions (System 1 of stage 2 uses a 0.8 s chunk; unused here)
    video_offsets: [0]      # == data config video delta_indices (fourier_gr1_arms_waist_dual_s2)
    frame_size: [256, 256]  # == obs_image_size
    train_systems: [system2]
    loss_weights: {system2: 1.0, system1: 1.0}
    mask_out_of_episode: true
    eval: {num_samples: 64, seed: 0}
  system2:
    use_radio_prefix: true # C-RADIO summary tokens (SigLIP2-g / DINOv3 CLS = 2304-d summary) in s2_context
    d_model: 768
    depth: 12
    num_heads: 12
    use_state: true
    num_noise_samples: 4    # noise draws per sample per step (the DiT is cheap next to the VLM)
    diffusion: {type: flow_matching, beta_alpha: 1.5, beta_beta: 1.0, noise_s: 0.999, num_timestep_buckets: 1000, sample_steps: 4}  # GR00T
    interpolation: {default_mode: linear, groups: [], strict: true}   # GR1 arms / hands / waist are all continuous
  system1:
    use_radio_prefix: true # current frame's C-RADIO summary tokens in the cross-attention context
    d_model: 768           # same size as the System 2 DiT / the GR00T action head
    depth: 12
    num_heads: 12
    use_state: true         # state at the System 1 frame (t + o) as a cross-attention token
    diffusion: {type: flow_matching, beta_alpha: 1.5, beta_beta: 1.0, noise_s: 0.999, num_timestep_buckets: 1000, sample_steps: 4}  # GR00T
  action_model:             # action / state layout (QwenGR00T keys)
    action_dim: 29
    state_dim: 58           # sin/cos state
    action_horizon: 16      # = System 1 horizon (informational; the windows come from dual_system)

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    emit_action_valid: true # action_valid / frame_valid masks (padded slots outside the episode)
    data_root_dir: playground/Datasets/PhysicalAI-Robotics-GR00T-X-Embodiment-Sim
    data_mix: fourier_gr1_unified_1000_dual_s2   # ego t + state t + a[t-40 .. t+80]
    lerobot_version: "v2.0"
    sequential_step_sampling: false
    per_device_batch_size: 32   # 32 x 4 GPUs = global 128
    load_all_data_for_training: true
    obs_image_size: [256, 256]
    delete_pause_frame: false
    video_backend: decord
    video_backend_kwargs: {num_threads: 1}
    multiprocessing_context: fork
    num_workers: 8
    prefetch_factor: 2
  val_data:   # demos 900-999 of each task (INSIDE the training set here), eval hook only
    dataset_py: lerobot_datasets
    include_state: true
    emit_action_valid: true
    data_root_dir: playground/Datasets/PhysicalAI-Robotics-GR00T-X-Embodiment-Sim
    data_mix: fourier_gr1_unified_1000_dual_s2
    skip_first_episodes: 900
    max_episodes_per_dataset: 100
    lerobot_version: "v2.0"
    obs_image_size: [256, 256]
    video_backend: decord
    video_backend_kwargs: {num_threads: 1}

trainer:
  max_train_steps: 40000
  num_warmup_steps: 1000
  save_interval: 10000
  eval_interval: 1000
  learning_rate:
    base: 1.0e-05           # qwen_vl_interface (full fine-tuning)
    system2: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr_rate: 0.01
  freeze_modules: radio_encoder,system1
  max_grad_norm: 1.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 0.0
