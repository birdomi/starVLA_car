# QwenGR00T_DualSystem, FULL RoboCasa GR1 set, ONE-STAGE joint training, Qwen3.5-0.8B FULLY fine-tuned (built from
# joint_system12_plancond_vlm12_s2delta_s1res10_rcfull_50k.yaml), changes (user 10-16; 100k steps):
#  * NO VLM lag: the VLM, C-RADIO, state and System 1 all see the current frame t (video_offsets [0], default
#    stale_input plan with plan age 0 = the synchronous policy server; as joint_system12_plancond_rcfull_50k.yaml but
#    without its plan-age offsets 4..16). Sim eval without ROBOCASA_VLM_PREV_FRAME.
#  * System 2 keyframes every 0.25 s, absolute plan (as joint_system12_vlact4b_l4_kf025_mem_am5_vlm12_rcfull_50k.yaml):
#    -2 .. +4 s -> 25 keyframes (8 past / current / 16 future); no delta_plan, no s1_residual.
#  * System 1 = ActionMap (16 steps x 5 columns L_arm | R_arm | L_hand | R_hand | waist, plan not split) trained by direct
#    REGRESSION (system1.diffusion.type regression: all-zero action input at t = 0, L_S1 = MSE(a_hat, a), one forward
#    pass at inference) instead of flow matching; one draw per sample (num_noise_samples 1: the regression input is
#    deterministic, repeats would be identical). System 2 stays keyframe flow matching (System 1 sees its sampled plan).
#  * no episode memory, no progress head.
# Chain: dual_system/run_dualsystem_am5reg_after_vlact.sh (waits for the VLAct-4B memory chain, then
#   run_dualsystem_joint_rcfull.sh with this yaml: train -> seeded 24-task sim eval -> paired comparisons).
run_id: starvla_dualsystem_joint_plancond_kf025_am5reg_h16_rcfull_robocasa_gr1
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: ryk9012-gwangju-institute-of-science-and-technology
wandb_project: starVLA_robocasa
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T_DualSystem
  qwenvl:
    base_vlm: Qwen/Qwen3.5-0.8B
    attn_implementation: flash_attention_2
    torch_dtype: float32    # trained -> fp32 weights (ZeRO-0 keeps no fp32 master copy); compute is bf16 autocast
    load_bf16: false
  radio:
    path: playground/Pretrained_models/C-RADIOv4-SO400M   # smallest released C-RADIOv4 (H / SO400M / 1D-H only)
    feature: backbone
    input_size: [256, 256]
    outlier_norm: 100.0     # C-RADIO's fixed top-row artifact token (1 of 256) is masked
    prefix_tokens: summary  # SigLIP2-g + DINOv3 CLS (RADIO's 2304-d summary, 2 x 1152 tokens) -> both systems
  dual_system:
    action_rate_hz: 20.0
    keyframes: {t_min: -2.0, t_max: 4.0, dt: 0.25}   # 25 keyframes: 8 past / 1 current / 16 future
    s1_horizon_s: 0.8       # 16 actions (0.8 s chunk)
    video_offsets: [0]      # == data config video delta_indices (fourier_gr1_arms_waist_dual_s2): VLM / C-RADIO / state / System 1 all at frame t
    frame_size: [256, 256]  # == obs_image_size
    train_systems: [system2, system1]
    loss_weights: {system2: 1.0, system1: 1.0}
    mask_out_of_episode: true
    eval: {num_samples: 64, seed: 0}
  system2:
    use_radio_prefix: true # C-RADIO summary tokens (SigLIP2-g / DINOv3 CLS = 2304-d summary) in s2_context
    d_model: 768
    depth: 12
    num_heads: 12
    use_state: true
    vlm_age_embed: false    # no VLM lag
    num_noise_samples: 4    # noise draws per sample per step (the DiT is cheap next to the VLM)
    diffusion: {type: flow_matching, beta_alpha: 1.5, beta_beta: 1.0, noise_s: 0.999, num_timestep_buckets: 1000, sample_steps: 4}  # GR00T
    interpolation: {default_mode: linear, groups: [], strict: true}   # GR1 arms / hands / waist are all continuous
  system1:
    use_radio_prefix: true # current frame's C-RADIO summary tokens in the cross-attention context
    d_model: 768           # same size as the System 2 DiT / the GR00T action head
    depth: 12
    num_heads: 12
    use_state: true         # state at frame t (the System 1 frame) as one token
    plan_input: condition   # trajectory tokens in the cross-attention memory (not the sequence)
    state_input: condition  # state token stays in the cross-attention memory
    action_map:             # ActionMap System 1: 16 steps x 5 columns (loader order left_arm, right_arm, left_hand, right_hand, waist)
      groups: ["0:7", "7:14", "14:20", "20:26", "26:29"]
      names: [L_arm, R_arm, L_hand, R_hand, waist]
      plan_grid: false      # 25 plan tokens (the plan is not split per column)
    num_noise_samples: 1    # regression: deterministic input, one draw
    diffusion: {type: regression}   # direct regression (no flow matching): x = 0, t = 0 -> a_hat, MSE
    traj_source: pred       # System 2's own sampled plan (no_grad), exactly what System 1 sees at test time
    traj_pred_steps: 4      # Euler steps of System 2's plan (= inference)
  action_model:             # action / state layout (QwenGR00T keys)
    action_dim: 29
    state_dim: 58           # sin/cos state
    action_horizon: 16      # = System 1 horizon (the policy server's chunk length)

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    emit_action_valid: true # action_valid / frame_valid masks (padded slots outside the episode)
    data_root_dir: playground/Datasets/PhysicalAI-Robotics-GR00T-X-Embodiment-Sim
    data_mix: fourier_gr1_unified_1000_dual_s2   # ego / state at t + a[t-40 .. t+80]
    lerobot_version: "v2.0"
    sequential_step_sampling: false
    per_device_batch_size: 32   # 32 x 4 GPUs = global 128
    load_all_data_for_training: true
    obs_image_size: [256, 256]
    delete_pause_frame: false
    video_backend: decord
    video_backend_kwargs: {num_threads: 1}
    multiprocessing_context: fork
    num_workers: 8
    prefetch_factor: 2
  val_data:   # demos 900-999 of each task (INSIDE the training set here), eval hook only
    dataset_py: lerobot_datasets
    include_state: true
    emit_action_valid: true
    data_root_dir: playground/Datasets/PhysicalAI-Robotics-GR00T-X-Embodiment-Sim
    data_mix: fourier_gr1_unified_1000_dual_s2
    skip_first_episodes: 900
    max_episodes_per_dataset: 100
    lerobot_version: "v2.0"
    obs_image_size: [256, 256]
    video_backend: decord
    video_backend_kwargs: {num_threads: 1}

trainer:
  max_train_steps: 100000
  num_warmup_steps: 1000
  save_interval: 10000
  eval_interval: 1000
  learning_rate:
    base: 1.0e-05           # qwen_vl_interface (full fine-tuning)
    system2: 1.0e-04
    system1: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr_rate: 0.01
  freeze_modules: radio_encoder
  max_grad_norm: 1.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 0.0
