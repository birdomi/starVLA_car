# RMBench (memory-dependent manipulation, RoboTwin 2.0 aloha-agilex, demo_clean) -- multi-task baseline: the RoboTwin
# "DiT v2" recipe (Robotwin/train_files/starvla_qwen35_gr00t_rt50k_dit_v2_robotwin.yaml) on all 10 RMBench tasks.
# Memoryless (current frame + state only), so it is the no-memory reference for memory variants.
# Data: train_files/convert_rmbench_to_lerobot.py -> playground/Datasets/RMBench/<task> (500 episodes, ~325k frames).
# Train: bash examples/simBenchmarks/launch_regressor_sim_local.sh <this yaml> [gpus] [port]
# Eval:  bash examples/simBenchmarks/RMBench/eval_files/eval_rmbench.sh <run_dir>/final_model/pytorch_model.pt all <gpu>
run_id: starvla_qwen35_0_8b_dit_v2_30k_b128_rmbench_all
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: ryk9012-gwangju-institute-of-science-and-technology
wandb_project: starVLA_rmbench
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T
  qwenvl:
    base_vlm: Qwen/Qwen3.5-0.8B
    attn_implementation: flash_attention_2
    # ZeRO-0 keeps no fp32 master copy, so the trained VLM must hold fp32 weights; compute stays bf16 via autocast.
    torch_dtype: float32
    load_bf16: false
  action_model:
    action_dim: 14
    state_dim: 14
    action_horizon: 16   # matches AgilexDataConfig (action_indices = 16)
    num_target_vision_tokens: 0

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: playground/Datasets/RMBench
    # 10 tasks x 50 demo_clean episodes (RMBench/train_files/data_registry); rmbench_9 = the paper's 9 tasks,
    # rmbench_m1 / rmbench_mn = memory-complexity groups, rmbench_<task> = one task.
    # robot type `robotwin` (AgilexDataConfig): 3 cameras, 14-D, key order [left 6 | right 6 | left grip | right grip]
    data_mix: rmbench_all
    lerobot_version: "v2.0"
    action_mode: abs
    sequential_step_sampling: false
    # 32 x 4 GPUs = global batch 128 (grad_accum 1)
    per_device_batch_size: 32
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    delete_pause_frame: false
    video_backend: decord
    video_backend_kwargs: {num_threads: 1}
    multiprocessing_context: fork
    num_workers: 8
    preprocess_in_workers: false   # QwenGR00T forward does not accept pre-collated qwen_inputs
    prefetch_factor: 2

trainer:
  # 128 x 30k = 3.84M samples over ~325k frames -> ~11.8 epochs (RoboTwin DiT v2: ~11.6).
  max_train_steps: 30000
  num_warmup_steps: 500
  save_interval: 10000
  eval_interval: 500
  learning_rate:
    base: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-05
