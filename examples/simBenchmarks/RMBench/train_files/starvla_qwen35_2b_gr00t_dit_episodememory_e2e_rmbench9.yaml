# RMBench (paper's 9 tasks, demo_clean, aloha-agilex) -- Qwen3.5-2B + streamed episode memory + action DiT, END-TO-END.
# The recipe of the KISTI car run starvla_qwen35_2b_dit_episodememory_e2e_egodex50k_car_v3_3cam_50k_b768
# (playground/kisti_bundles/carv3_mem2b_e2e_50k/model/config.yaml), adapted to RMBench:
#  * framework QwenGR00T_EpisodeMemory: Qwen3.5-2B (base weights, TRAINED) sees the current frame of the 3 cameras
#    (head, left wrist, right wrist; 224 x 224) + instruction; a flow-matching DiT-B (16 blocks) reads Qwen's last hidden
#    states with the memory context appended (condition: concat; starts content-free, the projections are zero-init)
#  * memory: 32 tokens x d 768, depth 8, gated attention, token_dim 1024, initialised from the EgoDex memory pretraining
#    (memory_pretrain_multivlm_n32d8_t1024_egodex steps_50000, the 2B head); its core stays frozen (freeze_modules),
#    trained: token_resize, out_norm / mem_proj / source embeddings. Progress from the pretraining's decision
#    transformer (episode-progress query + new projection trained, its blocks frozen), CE x 0.1 on emit_progress labels
#  * stream: the memory runs from every episode's frame 0, one update EXACTLY every 16 frames (1.07 s at 15 Hz, frames
#    0, 16, 32, ...; jitter 0 -- the car run drew 30 +- 9 at 30 Hz), truncated BPTT over the last 4 updates, the
#    current frame's VLM tokens keep their gradient (vlm_grad: true = end-to-end)
#  * actions: 16 x 14 absolute joints (RoboTwin layout, robot type `robotwin`); stride = chunk length, so eval executes
#    the whole chunk (the starVLA_dev adapter takes the stream stride as execute_horizon) and the policy calls fall on
#    the same 16-frame grid: one memory update per call
#  * changes vs the car recipe: 14-D / horizon 16, no color jitter (sim, clean eval), no min_episode_length
#    (observe_and_pickup episodes are ~150 frames), decord decoding, GPU count / batch below
# Batch: 28 streams per GPU x 4 GPUs = 112 per step, no accumulation. 11-04 on RTX PRO 6000 (97.9 GB): 56 per GPU OOMs
#   in the first VLM forward (no activation checkpointing); 32 runs but at the memory limit (peak 97.2 GB, 3.5 s/step,
#   GPU util 22-46%); 28 peaks ~91 GB at ~1.95 s/step.
#   rmbench_9 = 450 episodes / 277k frames = 17.3k grid frames (every 16th), so 30k steps x 112 walk every episode ~195
#   times, each walk on the same 1/16 of its frames (frames 0, 16, 32, ...; random_phase false).
# Train: bash examples/simBenchmarks/launch_sim_train_local.sh <this yaml> 4,5,6,7 29660   (accelerate + ZeRO-2)
# Eval:  bash examples/simBenchmarks/RMBench/eval_files/eval_rmbench.sh <run_dir>/final_model/pytorch_model.pt 9 <gpu>
#        (the starVLA_dev adapter detects the stream memory from the run config and carries it per episode)
run_id: starvla_qwen35_2b_dit_episodememory_e2e_egodex50k_rmbench9_30k_b112
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: ryk9012-gwangju-institute-of-science-and-technology
wandb_project: starVLA_rmbench
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T_EpisodeMemory
  num_views: 3              # cam_high, cam_left_wrist, cam_right_wrist (frame t)
  qwenvl:
    base_vlm: playground/Pretrained_models/Qwen3.5-2B
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048
    # fla Triton kernels recompile per sequence length -> pad prompts to a multiple of 64
    pad_to_multiple_of: 64
    torch_dtype: bfloat16
  action_model:
    action_model_type: DiT-B
    action_hidden_dim: 1024
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    action_dim: 14
    state_dim: 14
    action_horizon: 16       # AgilexDataConfig action_indices = range(16)
    future_action_window_size: 15
    past_action_window_size: 0
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 0
    diffusion_model_cfg:
      cross_attention_dim: 2048
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 16
      output_dim: 1024
      positional_embeddings: null
      memory_cond: false     # condition: concat -> the memory goes through the DiT's VLM cross-attention
  episode_memory:
    init_from: playground/Checkpoints/memory_pretrain_multivlm_n32d8_t1024_egodex/checkpoints/steps_50000_memory_qwen35_2b.pt
    token_dim: 1024
    condition: concat
    update_offsets: [0]
    stream:
      tbptt: 4
      vlm_grad: true
    num_tokens: 32
    d_model: 768
    depth: 8
    num_heads: 12
    mlp_ratio: 4.0
    attention: gated
    progress_bins: 50
    progress_loss_weight: 0.1
    decision:
      init_from: playground/Checkpoints/memory_pretrain_multivlm_n32d8_t1024_egodex/checkpoints/steps_50000.pt
      num_layers: 2
      num_heads: 12
      mlp_ratio: 4.0
      progress_bins: 20

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: playground/Datasets/RMBench
    data_mix: rmbench_9          # observe_and_pickup rearrange_blocks put_back_block swap_blocks swap_T + 4 M(n) tasks
    balance_dataset_weights: true
    emit_progress: true
    stream:
      stride: 16             # one memory update every 16 frames (= the action chunk) = 1.07 s at 15 Hz
      jitter: 0              # exactly: no interval jitter
      random_start: false
      random_phase: false
    lerobot_version: "v2.0"
    action_mode: abs
    sequential_step_sampling: false
    per_device_batch_size: 28    # streams per GPU
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    delete_pause_frame: false
    video_backend: decord
    video_backend_kwargs: {num_threads: 1}
    multiprocessing_context: fork
    num_workers: 8
    preprocess_in_workers: false
    prefetch_factor: 2
    in_order: true

trainer:
  max_train_steps: 30000
  num_warmup_steps: 1000
  save_interval: 5000
  eval_interval: 1000
  learning_rate:
    base: 1.0e-05
    action_model: 1.0e-04
    episode_memory: 1.0e-04
    decision: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr_rate: 0.01
  freeze_modules: episode_memory.init_tokens, episode_memory.in_proj, episode_memory.blocks, decision.jdt, episode_memory.progress_head, episode_memory.progress_embed
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  logging_frequency: 100
  gradient_clipping: 1.0
  skip_nonfinite_steps: true
  gradient_accumulation_steps: 1
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 0.0
