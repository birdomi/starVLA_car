# RMBench 9 tasks -- the 30k recipe of starvla_qwen35_2b_gr00t_dit_episodememory_e2e_rmbench9.yaml (see its header for the
# model / memory / stream details) trained 100k steps at 24 streams per GPU x 4 GPUs = 96 per step (user 11-04).
# Differences: run_id, per_device_batch_size, max_train_steps, save_interval 20k (5 x 5.9 GB), stream.random_phase
# true (user 11-05: every walk starts at a random frame in [0, 16), so the grid covers all frames over the ~555 walks of
# each episode; eval still updates from frame 0) and 50-step action chunks (user 11-05: data_mix rmbench_9_h50 = robot
# type robotwin_h50, action_horizon 50). The memory still updates every 16 frames, so eval executes the first 16
# actions of each chunk (the starVLA_dev adapter's execute_horizon defaults to the stream stride) and calls on the
# 16-frame grid as before. Same init (base Qwen3.5-2B + EgoDex memory pretraining).
# Train: PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True bash examples/simBenchmarks/launch_sim_train_local.sh <this yaml> 4,5,6,7 29660
# Eval:  python examples/simBenchmarks/RMBench/eval_files/eval_rmbench_parallel.py <run_dir>/final_model/pytorch_model.pt
run_id: starvla_qwen35_2b_dit_episodememory_e2e_egodex50k_rmbench9_100k_b96
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: ryk9012-gwangju-institute-of-science-and-technology
wandb_project: starVLA_rmbench
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T_EpisodeMemory
  num_views: 3              # cam_high, cam_left_wrist, cam_right_wrist (frame t)
  qwenvl:
    base_vlm: playground/Pretrained_models/Qwen3.5-2B
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048
    # fla Triton kernels recompile per sequence length -> pad prompts to a multiple of 64
    pad_to_multiple_of: 64
    torch_dtype: bfloat16
  action_model:
    action_model_type: DiT-B
    action_hidden_dim: 1024
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    action_dim: 14
    state_dim: 14
    action_horizon: 50       # robotwin_h50 action_indices = range(50)
    future_action_window_size: 49
    past_action_window_size: 0
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 0
    diffusion_model_cfg:
      cross_attention_dim: 2048
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 16
      output_dim: 1024
      positional_embeddings: null
      memory_cond: false     # condition: concat -> the memory goes through the DiT's VLM cross-attention
  episode_memory:
    init_from: playground/Checkpoints/memory_pretrain_multivlm_n32d8_t1024_egodex/checkpoints/steps_50000_memory_qwen35_2b.pt
    token_dim: 1024
    condition: concat
    update_offsets: [0]
    stream:
      tbptt: 4
      vlm_grad: true
    num_tokens: 32
    d_model: 768
    depth: 8
    num_heads: 12
    mlp_ratio: 4.0
    attention: gated
    progress_bins: 50
    progress_loss_weight: 0.1
    decision:
      init_from: playground/Checkpoints/memory_pretrain_multivlm_n32d8_t1024_egodex/checkpoints/steps_50000.pt
      num_layers: 2
      num_heads: 12
      mlp_ratio: 4.0
      progress_bins: 20

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: playground/Datasets/RMBench
    data_mix: rmbench_9_h50      # observe_and_pickup rearrange_blocks put_back_block swap_blocks swap_T + 4 M(n) tasks
    balance_dataset_weights: true
    emit_progress: true
    stream:
      stride: 16             # one memory update every 16 frames (= the action chunk) = 1.07 s at 15 Hz
      jitter: 0              # exactly: no interval jitter
      random_start: false
      random_phase: true     # walk grid starts at a random frame in [0, stride) (30k run: false)
    lerobot_version: "v2.0"
    action_mode: abs
    sequential_step_sampling: false
    per_device_batch_size: 24    # streams per GPU
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    delete_pause_frame: false
    video_backend: decord
    video_backend_kwargs: {num_threads: 1}
    multiprocessing_context: fork
    num_workers: 8
    preprocess_in_workers: false
    prefetch_factor: 2
    in_order: true

trainer:
  max_train_steps: 100000
  num_warmup_steps: 1000
  save_interval: 20000
  eval_interval: 1000
  learning_rate:
    base: 1.0e-05
    action_model: 1.0e-04
    episode_memory: 1.0e-04
    decision: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr_rate: 0.01
  freeze_modules: episode_memory.init_tokens, episode_memory.in_proj, episode_memory.blocks, decision.jdt, episode_memory.progress_head, episode_memory.progress_embed
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  logging_frequency: 100
  gradient_clipping: 1.0
  skip_nonfinite_steps: true
  gradient_accumulation_steps: 1
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 0.0
