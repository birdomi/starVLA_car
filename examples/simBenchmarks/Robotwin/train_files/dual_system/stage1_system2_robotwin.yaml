# QwenGR00T_DualSystem on RoboTwin 2.0 (aloha-agilex, robotwin_clean50 = 50 tasks x 50 clean demos, 15 Hz, 3 cameras),
# stage 1: System 2 (long-horizon keyframe planner). RoboTwin port of Robocasa_tabletop/train_files/dual_system/
# stage1_system2_rc100.yaml (same model sizes / losses / lr; data layout changed):
#   head + left wrist + right wrist at t + instruction -> Qwen3.5-0.8B (FULLY trainable, fp32 weights / bf16 autocast)
#   the same 3 views -> frozen C-RADIOv4-SO400M (224x224 -> 2 summary + 14x14 = 196 patch tokens per view), the views
#   concatenated on the token dim (3 x 2 prefix + 3 x 196 patch tokens, + a learned per-view embedding), shared with System 1
#   s2_context = concat([vlm_projector(Qwen), radio_prefix_projector_s2(summary), radio_projector_s2(patches),
#                        state_projector(state)], token dim)
#   keyframe DiT (GR00T-style flow matching) -> 61 keyframes on [-2.0, +4.0] s (0.1 s) around t
#   loss = GR00T velocity MSE on the dense trajectory: MSE(interp(v_hat), dense GT - interp(eps)) at the 91 dense 15 Hz
#   timestamps
# Actions / state: 14-D [left joints 6 | right joints 6 | left gripper | right gripper], ABSOLUTE joints (min_max), grippers
# binary-normalized (linearly interpolated between keyframes like every other dim).
# Steps: 30k here + 20k stage 2 = the 50k x b128 of the RoboTwin DiT v2 / ActionMap v3 baselines.
# Next: stage2_system1_robotwin.yaml. Chain (train both + 50-task eval): dual_system/run_dualsystem_robotwin.sh
run_id: starvla_dualsystem_s2_robotwin_clean50
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: ryk9012-gwangju-institute-of-science-and-technology
wandb_project: starVLA_robotwin
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T_DualSystem
  qwenvl:
    base_vlm: Qwen/Qwen3.5-0.8B
    attn_implementation: flash_attention_2
    torch_dtype: float32    # trained -> fp32 weights (ZeRO-0 keeps no fp32 master copy); compute is bf16 autocast
    load_bf16: false
  radio:
    path: playground/Pretrained_models/C-RADIOv4-SO400M   # smallest released C-RADIOv4 (H / SO400M / 1D-H only)
    feature: backbone
    input_size: [224, 224]  # == frame_size (the RoboTwin baselines' 224 x 224 views)
    outlier_norm: 100.0     # C-RADIO's fixed top-row artifact token is masked
    prefix_tokens: summary  # SigLIP2-g + DINOv3 CLS (RADIO's 2304-d summary, 2 x 1152 tokens) -> both systems
  dual_system:
    action_rate_hz: 15.0    # RoboTwin video / action rate
    keyframes: {t_min: -2.0, t_max: 4.0, dt: 0.1}   # 61 keyframes: 20 past / 1 current / 40 future
    s1_horizon_s: 1.0       # 15 actions
    video_offsets: [0]      # == data config video delta_indices (robotwin_dual_s2)
    num_views: 3            # head, left wrist, right wrist (AgilexDataConfig video_keys order = the eval client's order)
    frame_size: [224, 224]  # == obs_image_size
    train_systems: [system2]
    loss_weights: {system2: 1.0, system1: 1.0}
    mask_out_of_episode: true
    eval: {num_samples: 64, seed: 0}
  system2:
    use_radio_prefix: true # C-RADIO summary tokens (SigLIP2-g / DINOv3 CLS = 2304-d summary) in s2_context
    d_model: 768
    depth: 12
    num_heads: 12
    use_state: true
    num_noise_samples: 4    # noise draws per sample per step (the DiT is cheap next to the VLM)
    diffusion: {type: flow_matching, beta_alpha: 1.5, beta_beta: 1.0, noise_s: 0.999, num_timestep_buckets: 1000, sample_steps: 4}  # GR00T
    interpolation: {default_mode: linear, groups: [], strict: true}
  system1:
    use_radio_prefix: true # current frame's C-RADIO summary tokens in the cross-attention context
    d_model: 768           # same size as the System 2 DiT / the GR00T action head
    depth: 12
    num_heads: 12
    use_state: true         # state at the System 1 frame (t + o) as a cross-attention token
    diffusion: {type: flow_matching, beta_alpha: 1.5, beta_beta: 1.0, noise_s: 0.999, num_timestep_buckets: 1000, sample_steps: 4}  # GR00T
  action_model:             # action / state layout (QwenGR00T keys)
    action_dim: 14
    state_dim: 14
    action_horizon: 15      # = System 1 horizon = the chunk the RoboTwin client executes per call (1 s)

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    emit_action_valid: true # action_valid / frame_valid masks (padded slots outside the episode)
    data_root_dir: playground/Datasets/RoboTwin
    data_mix: robotwin_clean50_dual_s2   # 3 views t + state t + a[t-30 .. t+60]
    lerobot_version: "v2.0"
    action_mode: abs
    sequential_step_sampling: false
    per_device_batch_size: 32   # 32 x 4 GPUs = global 128
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    delete_pause_frame: false
    video_backend: decord
    video_backend_kwargs: {num_threads: 1}
    multiprocessing_context: fork
    num_workers: 8
    prefetch_factor: 2
  val_data:   # first 2 RANDOMIZED demos of each of the 50 tasks (held out; domain-randomized scenes), eval hook only
    dataset_py: lerobot_datasets
    include_state: true
    emit_action_valid: true
    data_root_dir: playground/Datasets/RoboTwin
    data_mix: robotwin_rand50_dual_s2
    max_episodes_per_dataset: 2
    lerobot_version: "v2.0"
    action_mode: abs
    obs_image_size: [224, 224]
    video_backend: decord
    video_backend_kwargs: {num_threads: 1}

trainer:
  max_train_steps: 30000
  num_warmup_steps: 1000
  save_interval: 10000
  eval_interval: 1000
  learning_rate:
    base: 1.0e-05           # qwen_vl_interface (full fine-tuning)
    system2: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr_rate: 0.01
  freeze_modules: radio_encoder,system1
  max_grad_norm: 1.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 0.0
