# Qwen3.5-0.8B + GR00T PATCH regressor, IMAGE-TO-IMAGE: the past (16 x 14) executed-action window is the input image,
# the future (16 x 14) window the output image. (4 x joint-group) patches, axial RoPE; each past patch token is decoded
# into the future patch at the same (time, group) grid cell (no separate future query tokens).
# ABS targets (min_max, same as the plain regressor); past = raw normalized abs history. Same head/recipe as the RoboCasa run
# starvla_qwen35_0_8b_gr00t_patchreg_abs_robocasa_gr1, here on RoboTwin 2.0. Hyperparameters copied from the H1-2 car run
# (examples/realRobots/H1_2_car/train_files/starvla_qwengr00t_car3task_100k.yaml) on RoboTwin 2.0 (50 tasks, clean 50 + randomized 500, 3 cams, 14-D joints)
# Launch: bash examples/simBenchmarks/launch_regressor_sim_local.sh examples/simBenchmarks/Robotwin/train_files/starvla_qwen35_gr00t_patchreg_abs_robotwin.yaml [gpus] [port]
run_id: starvla_qwen35_0_8b_gr00t_patchreg_i2i_abs_robotwin_all
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: ryk9012-gwangju-institute-of-science-and-technology
wandb_project: starVLA_robotwin
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T_PatchRegressor
  qwenvl:
    base_vlm: Qwen/Qwen3.5-0.8B
    attn_implementation: flash_attention_2
  action_model:
    action_dim: 14
    state_dim: 14        # 6+6 joints (min_max) + 2 binary grippers
    action_horizon: 16     # future steps (regression target)
    num_past_steps: 16     # executed-action history fed as patch tokens
    patch_t: 4             # time patch size -> 4 time patches
    patch_groups: [6, 6, 1, 1]  # left_joints, right_joints, left_gripper, right_gripper -> 4 column groups (key order of AgilexDataConfig)
    token_mode: image2image  # past patch tokens ARE the output queries (P == H)
    past_repr: raw           # normalized past window fed as-is: same value space as the output image
    target_mode: abs
    use_rope: true         # axial (time, group) RoPE in the DiT self-attention
    rope_theta: 10000.0
    loss_type: l1

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: playground/Datasets/RoboTwin
    data_mix: robotwin_all_pf32   # range(-16, 16) window, min_max abs targets (same stats as the plain robotwin run)
    lerobot_version: "v2.0"
    action_mode: abs          # absolute joint targets, exactly like the plain regressor
    sequential_step_sampling: false
    # H1-2 car recipe: 16 x 4 GPUs = global batch 64 (grad_accum 1)
    per_device_batch_size: 16
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    delete_pause_frame: false
    video_backend: decord
    video_backend_kwargs: {num_threads: 1}
    multiprocessing_context: fork
    num_workers: 16
    preprocess_in_workers: true
    prefetch_factor: 2

trainer:
  # Same recipe as the H1-2 car run: Muon (action head only) + WSD, VLM trained with AdamW @ 1e-5.
  max_train_steps: 100000
  num_warmup_steps: 2000
  save_interval: 10000
  eval_interval: 500
  learning_rate:
    base: 1.0e-05
    action_model: 1.0e-04
  # WSD: warmup 0-2k -> stable 2k-90k -> cosine decay 90k-100k
  lr_scheduler_type: warmup_stable_decay
  scheduler_specific_kwargs:
    num_decay_steps: 10000
    min_lr_ratio: 0.01
  # VLM trains too: Muon is restricted to the action_model group via
  # optimizer.muon_modules; Qwen falls in the 'base' group -> pure AdamW @ 1e-5.
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true

  # torch.optim.Muon for 2D matrices of the action head, AdamW for the rest.
  # REQUIRES ZeRO stage 0 (launch_regressor_sim_local.sh sets ACCELERATE_DEEPSPEED_ZERO_STAGE=0).
  optimizer:
    name: Muon
    muon_modules: [action_model]
    muon_lr: 1.0e-04
    muon_weight_decay: 1.0e-05
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-05
