# RoboTwin 2.0 (aloha-agilex, robotwin_clean50) -- baseline GR00T flow-matching DiT ("DiT v2"), same head and trainer recipe as
# the RoboCasa 50k comparison (Robocasa_tabletop/train_files/starvla_qwen35_gr00t_rc100_50k_dit_v2_robocasa.yaml):
# 16 action tokens (one per step, whole 14-D vector), future tokens 0, learned PE, timestep-only AdaLN, state = 1 leading token.
# Train + eval: examples/simBenchmarks/Robotwin/train_files/run_robotwin_train_eval.sh rt50k_dit_v2
run_id: starvla_qwen35_0_8b_dit_rt_50k_b128_robotwin_clean50_v2
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: ryk9012-gwangju-institute-of-science-and-technology
wandb_project: starVLA_robotwin
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T
  qwenvl:
    base_vlm: Qwen/Qwen3.5-0.8B
    attn_implementation: flash_attention_2
    # ZeRO-0 keeps no fp32 master copy, so the trained VLM must hold fp32 weights; compute stays bf16 via autocast.
    torch_dtype: float32
    load_bf16: false
  action_model:
    action_dim: 14
    state_dim: 14
    action_horizon: 16   # matches AgilexDataConfig (action_indices = 16)
    # flow-matching knobs (noise schedule, timestep buckets, inference steps) use the QwenGR00T defaults.
    # GR00T learnable "planning" query tokens: 0, matching the ActionMap heads (default would be 32)
    num_target_vision_tokens: 0

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: playground/Datasets/RoboTwin
    # CLEAN only: 50 tasks x 50 clean demos (2.5k episodes, ~550k frames; Robotwin/train_files/data_registry).
    # AgilexDataConfig: 3 cameras (head + 2 wrists), 14-D state/action,
    # key order [left_joints 6 | right_joints 6 | left_gripper 1 | right_gripper 1]
    data_mix: robotwin_clean50
    lerobot_version: "v2.0"
    # ABSOLUTE joint targets (RoboTwin consumes absolute joints; eval client default action_mode abs)
    action_mode: abs
    sequential_step_sampling: false
    # 32 x 4 GPUs = global batch 128 (grad_accum 1)
    per_device_batch_size: 32
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    delete_pause_frame: false
    video_backend: decord
    video_backend_kwargs: {num_threads: 1}
    multiprocessing_context: fork
    num_workers: 8
    preprocess_in_workers: false   # QwenGR00T / GridDiT forward do not accept pre-collated qwen_inputs
    prefetch_factor: 2

trainer:
  # AdamW for EVERYTHING (no Muon) + cosine-with-min-lr, global batch 128, 50k steps -- same trainer as the RoboCasa 50k runs.
  # 128 x 50k = 6.4M samples over the ~550k-frame robotwin_clean50 mix (2.5k episodes) -> ~11.6 epochs (RoboCasa 50k: ~10.6).
  max_train_steps: 50000
  num_warmup_steps: 500
  save_interval: 25000
  eval_interval: 500
  learning_rate:
    base: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-05
