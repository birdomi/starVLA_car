# QwenLatentWorldAction on LIBERO (4 suites), stage C only: end-to-end joint training of System 1.5 + System 1 from
# scratch (see the RoboCasa joint_rc100.yaml for the loss / gradient path). NOT run on this machine (no LIBERO data
# under playground/Datasets); kept as the template for datasets WITHOUT a future-frame data config:
#   * the future frame comes from datasets.*.delta_indices_override: primary camera at [t, t+8] (trajectory indexing in
#     the same episode; indices past the episode end are clamped by the loader and flagged future_valid: false),
#     wrist camera at t only -> loader images [primary t, primary t+8, wrist t] = image_layout [t, f, t]
#   * System 2 sees both current views (primary + wrist); C-RADIO encodes the primary view (radio_view 0)
#   * action chunk a_t .. a_{t+7} (libero_franka action_indices range(8)); future_offset 8 = right after the chunk
# Before training: python starVLA/training/latent_world_action_tools.py stats --config_yaml <this yaml>
# Eval: the LIBERO websocket client works unchanged (predict_action keeps the QwenGR00T interface); it must send the
# current views in the same order (primary, wrist).
run_id: starvla_lwa_joint_scratch_libero
run_root_dir: playground/Checkpoints
seed: 42
is_debug: false
version_id: "0.21"

framework:
  name: QwenLatentWorldAction
  qwenvl: {base_vlm: Qwen/Qwen3.5-0.8B, attn_implementation: flash_attention_2, torch_dtype: bfloat16}
  system2: {finetune: frozen}
  radio:
    path: playground/Pretrained_models/C-RADIOv4-SO400M
    input_size: [224, 224]  # LIBERO frames are 224 / 256 px -> 14 x 14 = 196 tokens
    feature: backbone
    normalize_features: true
    stats_path: playground/Pretrained_models/C-RADIOv4-SO400M/lwa_stats_libero_224_f8.pt
  system15: {d_model: 768, depth: 12, num_heads: 12, adaln_cond: tau, tau_schedule: {schedule: uniform},
             num_noise_samples: 2, delta_norm: rms, sample_steps: 4, solver: euler}
  system1: {d_model: 512, depth: 4, num_heads: 8, dropout: 0.1, loss: smooth_l1, smooth_l1_beta: 0.1, hidden_source: pred}
  action_model: {action_dim: 7, state_dim: 0, action_horizon: 8}
  latent_world:
    stage: C
    image_layout: [t, f, t]
    radio_view: 0
    future_offset: 8
    mask_clamped_future: true
    loss_weights: {fm: 1.0, action: 1.0}
    joint: {action_path: ode, ode_steps: [1, 4], action_grad: full, action_loss_schedule: linear,
            action_loss_warmup_steps: 2000, action_loss_weight_start: 0.1,
            gt_prob_schedule: linear, gt_prob_start: 1.0, gt_prob_end: 0.05, gt_prob_decay_steps: 10000}
    eval: {num_samples: 64, batch_size: 16, seed: 0}

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: playground/Datasets/LEROBOT_LIBERO_DATA
    data_mix: libero_all
    delta_indices_override: {"video.primary_image": [0, 8]}
    emit_frame_meta: true
    sequential_step_sampling: false
    per_device_batch_size: 32
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    video_backend: torchvision_av

trainer:
  max_train_steps: 30000
  num_warmup_steps: 1000
  save_interval: 10000
  eval_interval: 1000
  learning_rate: {base: 1.0e-05, system15: 1.0e-04, system1: 1.0e-04}
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs: {min_lr_rate: 0.01}
  freeze_modules: qwen_vl_interface,radio_encoder
  max_grad_norm: 1.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  optimizer: {name: AdamW, betas: [0.9, 0.95], eps: 1.0e-08, weight_decay: 0.0}
